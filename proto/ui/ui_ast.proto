enum Align {
  ALIGN_DEFAULT = 0;
  ALIGN_TOP_LEFT = 1;
  ALIGN_TOP_MID = 2;
  ALIGN_TOP_RIGHT = 3;
  ALIGN_BOTTOM_LEFT = 4;
  ALIGN_BOTTOM_MID = 5;
  ALIGN_BOTTOM_RIGHT = 6;
  ALIGN_LEFT_MID = 7;
  ALIGN_RIGHT_MID = 8;
  ALIGN_CENTER = 9;
  ALIGN_OUT_TOP_LEFT = 10;
  ALIGN_OUT_TOP_MID = 11;
  ALIGN_OUT_TOP_RIGHT = 12;
  ALIGN_OUT_BOTTOM_LEFT = 13;
  ALIGN_OUT_BOTTOM_MID = 14;
  ALIGN_OUT_BOTTOM_RIGHT = 15;
  ALIGN_OUT_LEFT_TOP = 16;
  ALIGN_OUT_LEFT_MID = 17;
