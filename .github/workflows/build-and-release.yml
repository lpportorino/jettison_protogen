name: Build and Distribute Proto Bindings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'proto/**'
      - 'Dockerfile*'
      # The build CONTEXT filter for both `docker build … .` steps below. A path
      # excluded here that Dockerfile.base COPYs makes the image build fail, and
      # nothing else in this list would have fired.
      - '.dockerignore'
      - 'generate-*.sh'
      - 'scripts/**'
      # Copied into all ten consumer repositories by every fan-out step, so a
      # licence change that never fires here never reaches any of them.
      - 'LICENSE'
      # The wire-contract gate below is a step of THIS job, so a change to the
      # checker or its make target must re-run the fan-out's validation.
      - 'tools/wire_contract_check.py'
      - 'lint.mk'
      # THIS FILE ONLY — not '.github/workflows/**'. The other three workflows
      # each name only their own file; this one used to name the whole
      # directory, so every renderer.yml / devcards.yml / lint.yml edit ran the
      # fan-out. A run is still not a cheap no-op now that the ten "Push to …"
      # steps below commit only when a consumer's payload actually moved: it
      # builds two docker images, runs `make generate` — which spends this
      # repo's BSR code-generation quota on the Go leg — and the "Create
      # release" step still cuts a prerelease unconditionally.
      #
      # Measured on this repo's own history (503 first-parent master commits,
      # per COMMIT — GitHub evaluates a push's whole range, so this is a lower
      # bound on pushes, not a push count): 199 commits match the old set, 189
      # match this one. The ten that stop firing touched only renderer.yml,
      # devcards.yml, lint.yml or .github/actions/**, none of which changes
      # anything this workflow runs. Every commit that touches THIS file still
      # fires (verified: 0 misses).
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write  # Allow pushing to the repository
  packages: write  # Allow pushing packages

# The other three workflows all had one; this one never did, and stacking was
# real rather than theoretical — 12 overlapping run-pairs across 4 clusters,
# up to 4 runs concurrently in flight on one day.
#
# cancel-in-progress is FALSE, deliberately, and this is the one place this
# repo's concurrency shape diverges from renderer/devcards/lint/wire-contract.
# Those four are read-only gates whose only product is a verdict, so cancelling
# a superseded run costs nothing. This workflow is a WRITER: it clones, commits
# and pushes to ten consumer repositories in sequence, then cuts a release.
# Cancelling it mid-sequence leaves the fleet SPLIT — some consumers carrying
# the new bindings, the rest carrying the old — with no record of where it
# stopped, which is exactly the cross-repo divergence CLAUDE.md's trunk-only
# policy exists to prevent. Queueing instead makes the fan-out serial: at most
# one run writing to any consumer repo at a time (today two stacked runs can
# clone/rebase/push the same consumer concurrently), one `buf generate` against
# the BSR at a time, and the newest push still wins because GitHub cancels the
# PENDING run — never the running one — when a third arrives.
concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-distribute:
    runs-on: ubuntu-22.04-arm  # Native ARM64 runner matching Jetson BSP 6.2 (Ubuntu 22.04)

    steps:
    - name: Verify ARM64 architecture
      run: |
        echo "Running on architecture: $(uname -m)"
        if [ "$(uname -m)" != "aarch64" ]; then
          echo "Error: Expected aarch64 architecture but got $(uname -m)"
          exit 1
        fi
        echo "✓ Confirmed running on ARM64"

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # DOCUMENTATION LINT — before the first push, for the same reason: what
    # ships to ten consumers should not carry undocumented constrained fields or
    # undocumented enum values. A WARNING FAILS THIS STEP.
    #
    # IT RUNS BEFORE `make generate`, and keep it there. This step's inputs are
    # the COMMITTED proto-db.edn and the tools tree (see below), never anything
    # generation produces, so nothing is lost by linting first — and a
    # documentation finding then aborts the job before the long generate leg
    # rather than after it.
    #
    # It was once MANDATORY here rather than merely preferable, and the hazard
    # is worth knowing because re-creating it is easy. Generation's last leg,
    # `binary-dedup-run`, used to bind-mount docs/.protodoc/tools READ-WRITE as
    # the working directory of a container running as ROOT, and invoke
    # `clojure` there — leaving a root-owned .cpcache in this step's working
    # directory. What that breaks is a WRITE: the CLI's cache key folds in the
    # PATHS of the config files it found, including $HOME/.clojure/deps.edn, so
    # this step — whose HOME is the runner user's, not the container's root —
    # computes a DIFFERENT key, cannot select the container's .cp at all, and
    # must mint its own into a directory it does not own. The cached entries
    # naming the container's .m2 are incidental; making them portable would fix
    # nothing,
    # and CLJ_CACHE does not relocate the cache (both measured).
    #
    # That is fixed at the source: the recipe now mounts the tools tree
    # read-only and copies it into a container-local workdir, so generation
    # writes nothing into this tree. Any new container leg that mounts a source
    # directory read-write as root re-opens it.
    #
    # That is the whole point. `protodoc lint` used to exit 0 while printing its
    # findings, so both this pipeline and docs.yml stayed green while warnings
    # accumulated, and nothing ever forced a disposition. Two responses are
    # permitted: fix the finding, or delete the rule with its reasoning recorded
    # in docs/.protodoc/tools/src/protodoc/lint.clj.
    #
    # WHAT IT SEES, STATED EXACTLY, because the boundary is not the one above:
    # this reads the COMMITTED proto-db.edn, NOT the freshly generated
    # descriptors. So it catches an undocumented field that was committed, and it
    # does NOT catch a proto edit whose docs were never regenerated — that gap is
    # a FRESHNESS question, not a lint one, and closing it here would require
    # running the docs generation inside this writer job. Do not read a green here
    # as "the docs match the protos"; it means "the docs that exist are complete".
    #
    # THE TOOLCHAIN BELOW IS WHAT THAT STEP RUNS ON, and it is not optional.
    # `lint.mk`'s docs-lint recipe invokes `clojure` directly — it runs on the
    # RUNNER, not in either image this job builds. No other step here installs
    # a JVM (they are docker, python3, shell, or the checkout action), so
    # nothing had ever put one on this runner and the step exited 127
    # (`clojure: not found`) on every run since it landed.
    # A 127 here is indistinguishable in the job's summary from a real finding,
    # and because every fan-out step is gated behind it, no consumer repo
    # received a binding for as long as it stood.
    #
    # NOT `make docs-docker-lint`, which is the tempting one-line alternative:
    # that target runs a SEPARATE `protodoc:latest` image this job never builds,
    # and lint.mk's recipe comment records why the host path is deliberate —
    # running the tools directory directly means a rule change takes effect
    # without an image rebuild, and "a gate that silently runs a stale copy of
    # itself is worse than none".
    #
    # The java-version and both setup-clojure pins below are the ones docs.yml,
    # lint.yml, renderer.yml and devcards.yml already carry; that agreement IS
    # the point, so bump those together or not at all.
    #
    # The JDK PROVIDER is deliberately NOT uniform, and must not be "unified"
    # to make the set look consistent. docs.yml and lint.yml take temurin
    # through actions/setup-java, as this job does; renderer.yml and
    # devcards.yml take GraalVM CE through graalvm/setup-graalvm because their
    # legs run GraalWasm — the devcard corpus runner, and the cross-engine
    # mirror that re-proves wasmtime and GraalWasm byte-identical. Swapping
    # them to temurin for symmetry deletes the second wasm engine and the
    # oracle that compares the two.
    - name: Set up JDK 25 (LTS)
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "25"

    - name: Set up Clojure CLI
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: "1.12.5.1654"

    # NOT the same exact key as docs.yml, and the reason is asymmetry rather than
    # tidiness. This job resolves ONLY protodoc's base :deps (the lint leg).
    # docs.yml resolves those PLUS the whole :test alias — the cognitect
    # test-runner (a git dep, and the only reason ~/.gitlibs is in the path list
    # at all), test.check, specter, jimfs, protobuf-java, protovalidate,
    # test.chuck. A strict superset.
    #
    # actions/cache never saves after an exact-key hit and never overwrites an
    # existing key — renderer.yml's cargo-cache comment records the same
    # mechanism. So ONE shared exact key means whichever job saves FIRST freezes
    # the entry for the whole life of that deps.edn hash: when this job wins,
    # docs.yml gets an exact hit on a cache carrying no ~/.gitlibs and no test
    # dependency, and can never replace it.
    #
    # The shared `protodoc-m2-` PREFIX keeps the useful half of the sharing —
    # ~/.m2 is cumulative, so a prefix restore of docs.yml's superset followed by
    # this job's own save under its own key converges both upward rather than
    # starving either.
    #
    # NO ARCH TERM, on the record. This job is aarch64 and docs.yml is x86_64, so
    # an arch term would delete the cross-warming entirely — and every artifact in
    # both resolutions is a pure-JVM jar or a git source checkout today. RETIRES
    # WHEN either resolution gains a native or classifier'd artifact: add
    # `${{ runner.arch }}` to both keys and both prefixes then.
    - name: Cache Maven-resolved dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: protodoc-m2-lint-${{ hashFiles('docs/.protodoc/tools/deps.edn') }}
        restore-keys: |
          protodoc-m2-

    - name: Proto documentation lint
      run: make -f lint.mk docs-lint

    # Build base Docker image (native ARM64 build)
    - name: Build base Docker image
      run: |
        echo "Building base image..."
        docker build -t jettison-proto-generator-base:latest -f Dockerfile.base .

    # Build main Docker image
    - name: Build main Docker image
      run: |
        echo "Building main image..."
        docker build -t jettison-proto-generator:latest -f Dockerfile .

    # Generate all proto bindings
    - name: Generate all proto bindings
      env:
        # BSR AUTHENTICATION for the Go leg (the one generator that reaches the
        # network — two REMOTE plugins in its buf.gen.yaml). Unauthenticated,
        # BSR allows 10 code-generation requests/hour per IP; a token lifts that
        # to 960. This workflow has been unauthenticated for its entire life.
        #
        # THE SECRET DOES NOT EXIST YET. To configure it: create a BSR token at
        # https://buf.build/settings/user, add it as the repository secret
        # `BUF_TOKEN`, and nothing else changes — generate-protos.sh forwards it
        # into the go container only, and ONLY when non-empty.
        #
        # Until then this expands to the empty string, which the script treats
        # as absent: it prints the unauthenticated warning and runs exactly as
        # it does today. That is also what every fork build gets, since forks
        # cannot read repository secrets — so this must never be a hard failure.
        BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      run: |
        # List proto files we're going to process
        echo "Proto files to process:"
        ls -la proto/*.proto | head -10

        # Use Make command which properly sets PROTO_SOURCE_DIR=./proto by default
        make generate

        echo "Generated files:"
        find output -type f 2>/dev/null | head -20 || echo "No files generated yet"

    # THE ONLY VALIDATION BETWEEN `make generate` AND TEN CONSUMER REPOS.
    #
    # It runs HERE, after generation and before the first push, because this is
    # the one point in the fleet where the FRESHLY generated descriptor set
    # exists and nothing has shipped yet. wire-contract.yml runs the same target
    # on PRs and pushes, but against the COMMITTED descriptor set — which cannot
    # see a proto edit nobody regenerated. This step can.
    #
    # WHAT IT DOES NOT DO: forbid a renumber. docs/INTERFACE-CONTRACTS.md §10
    # allows one when every consumer rebuilds in lockstep, and that same §10
    # spells out the loop — "edit proto/, regenerate the bindings, UPDATE THIS
    # DOC TO MATCH, bump the jettison_protogen submodule pin in BOTH consumers".
    # This step enforces the doc-update beat of that documented loop. A red here
    # means the bindings about to be fanned out no longer match the contract the
    # consumers assert their encoders against, so shipping them would hand every
    # consumer a §9 parity failure whose cause lives in a commit already pushed.
    # Fix the doc (and bump the pins in lockstep), or revert the proto change.
    - name: Validate the wire contract against the generated descriptors
      run: make -f lint.mk wire-contract

    # THE TEN FAN-OUT STEPS BELOW SHARE ONE ORDERING RULE: DECIDE, THEN STAMP.
    #
    # Each writes a consumer README carrying two lines that vary on every run —
    # `date -u` and the triggering sha. While that write happened BEFORE
    # `git add -A`, the `git diff --staged --quiet` guard could never be true,
    # so every triggered run committed and pushed to all ten consumer repos
    # whether or not a generated byte had moved. Dropping just the date would
    # have fixed nothing; the sha line varies independently of it.
    #
    # So the README write lives in the ELSE branch, and everything a consumer
    # consumes — the bindings, the LICENSE, and each language's generated
    # scaffolding (go.mod/go.sum, package.json, Cargo.toml) — is staged BEFORE
    # the guard runs.
    #
    # WHY THIS CANNOT SKIP A PUSH IT OWED. The step clones the consumer repo
    # fresh at its top, so the guard compares against that repo's real published
    # tree rather than any cache: a delivery that failed, or that a cancelled
    # run never made, is still outstanding on the next run and still goes out.
    # And the commit is built from the same index the guard read, so anything
    # the guard cannot see is something the commit could not have carried
    # either. The delta a skip forgoes is exactly this README write, no more.
    #
    # WHAT IT COSTS: editing a README BODY here no longer reaches the consumers
    # on its own — the next payload change carries it out.
    #
    # DO NOT "FIX" THAT WITH `git add -f`. Forcing ignored paths in does not
    # merely arm the guard: it commits and pushes files the consumer's own
    # .gitignore excludes, re-adding them on every run with no way for that
    # repo to opt out. A path a consumer ignores is undeliverable by that
    # repo's own declaration and was equally undeliverable before this guard
    # existed, so `-f` would be a new distribution policy smuggled in as a
    # guard fix. It buys nothing else either — plain `git add -A` already
    # stages content, additions, deletions, renames and mode changes, and `-f`
    # affects ignored paths and nothing else.

    # Push to C repository
    - name: Push to jettison_proto_c
      run: |
        set -e  # Exit on any error
        if [ -n "${{ secrets.C_PUSH }}" ]; then
          # Clean up any existing target-repo directory
          rm -rf target-repo

          # Clone via HTTPS using GitHub token for authentication
          echo "Cloning repository..."
          git clone https://${{ github.actor }}:${{ github.token }}@github.com/lpportorino/jettison_proto_c.git target-repo || {
            echo "Failed to clone repository"
            exit 1
          }

          cd target-repo

          # Setup SSH key for pushing
          mkdir -p ~/.ssh
          echo "${{ secrets.C_PUSH }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git to use SSH for push
          git remote set-url origin git@github.com:lpportorino/jettison_proto_c.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Update files
          rm -rf *.pb.* *.h *.c
          cp -r ../output/c/* .

          cp ../LICENSE .
          # Decide, then stamp (see the fan-out ordering note above).
          git add -A
          if git diff --staged --quiet; then
            echo "No C binding changes to distribute"
          else
            echo "# Jettison Proto C Bindings" > README.md
            echo "" >> README.md
            echo "Auto-generated C bindings using nanopb." >> README.md
            echo "" >> README.md
            echo "**Target Platform**: ARM64 (NVIDIA Jetson AGX Orin BSP 6.2)" >> README.md
            echo "**Build Architecture**: $(uname -m)" >> README.md
            echo "" >> README.md
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md
            echo "Commit: ${{ github.sha }}" >> README.md

            git add -A
            git commit -m "Update C bindings from ${{ github.sha }}"
            # Pull before pushing. A brand-new consumer repository has no upstream
            # branch yet; that one case is benign and is now detected explicitly.
            # Anything else — a rebase conflict, an auth or network failure — ABORTS
            # here instead of being swallowed and resurfacing below as a confusing
            # non-fast-forward rejection from the push.
            if GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git ls-remote --exit-code --heads origin >/dev/null 2>&1; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git pull --rebase
            fi
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git push
          fi
        else
          echo "C_PUSH secret not configured, skipping"
        fi

    # Push to C++ repository
    - name: Push to jettison_proto_cpp
      run: |
        set -e  # Exit on any error
        if [ -n "${{ secrets.CPP_PUSH }}" ]; then
          # Clean up any existing target-repo directory
          rm -rf target-repo

          # Clone via HTTPS using GitHub token for authentication
          echo "Cloning repository..."
          git clone https://${{ github.actor }}:${{ github.token }}@github.com/lpportorino/jettison_proto_cpp.git target-repo || {
            echo "Failed to clone repository"
            exit 1
          }

          cd target-repo

          # Setup SSH key for pushing
          mkdir -p ~/.ssh
          echo "${{ secrets.CPP_PUSH }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git to use SSH for push
          git remote set-url origin git@github.com:lpportorino/jettison_proto_cpp.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Update files
          rm -rf *.pb.* *.h *.cc
          cp -r ../output/cpp/* .

          cp ../LICENSE .
          # Decide, then stamp (see the fan-out ordering note above).
          git add -A
          if git diff --staged --quiet; then
            echo "No C++ binding changes to distribute"
          else
            echo "# Jettison Proto C++ Bindings" > README.md
            echo "" >> README.md
            echo "Auto-generated C++ bindings with buf.validate support." >> README.md
            echo "" >> README.md
            echo "**Runtime validation requires**: [protovalidate-cc](https://github.com/bufbuild/protovalidate-cc) and [CEL-C++](https://github.com/google/cel-cpp)" >> README.md
            echo "" >> README.md
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md
            echo "Commit: ${{ github.sha }}" >> README.md

            git add -A
            git commit -m "Update C++ bindings from ${{ github.sha }}"
            # Pull before pushing. A brand-new consumer repository has no upstream
            # branch yet; that one case is benign and is now detected explicitly.
            # Anything else — a rebase conflict, an auth or network failure — ABORTS
            # here instead of being swallowed and resurfacing below as a confusing
            # non-fast-forward rejection from the push.
            if GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git ls-remote --exit-code --heads origin >/dev/null 2>&1; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git pull --rebase
            fi
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git push
          fi
        else
          echo "CPP_PUSH secret not configured, skipping"
        fi

    # Push to Go repository
    - name: Push to jettison_proto_go
      run: |
        set -e  # Exit on any error
        if [ -n "${{ secrets.GO_PUSH }}" ]; then
          # Clean up any existing target-repo directory
          rm -rf target-repo

          # Clone via HTTPS using GitHub token for authentication
          echo "Cloning repository..."
          git clone https://${{ github.actor }}:${{ github.token }}@github.com/lpportorino/jettison_proto_go.git target-repo || {
            echo "Failed to clone repository"
            exit 1
          }

          cd target-repo

          # Setup SSH key for pushing
          mkdir -p ~/.ssh
          echo "${{ secrets.GO_PUSH }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git to use SSH for push
          git remote set-url origin git@github.com:lpportorino/jettison_proto_go.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Update files
          rm -rf *.pb.go *.pb.gw.go buf
          cp -r ../output/go/* .

          # Initialize go module if needed
          if [ ! -f go.mod ]; then
            go mod init github.com/lpportorico/jettison_proto_go
          fi
          go mod tidy || echo "Warning: go mod tidy failed, continuing..."

          cp ../LICENSE .
          # Decide, then stamp (see the fan-out ordering note above).
          git add -A
          if git diff --staged --quiet; then
            echo "No Go binding changes to distribute"
          else
            echo "# Jettison Proto Go Bindings" > README.md
            echo "" >> README.md
            echo "Auto-generated Go bindings with buf.validate support." >> README.md
            echo "" >> README.md
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md
            echo "Commit: ${{ github.sha }}" >> README.md

            git add -A
            git commit -m "Update Go bindings from ${{ github.sha }}"
            # Pull before pushing. A brand-new consumer repository has no upstream
            # branch yet; that one case is benign and is now detected explicitly.
            # Anything else — a rebase conflict, an auth or network failure — ABORTS
            # here instead of being swallowed and resurfacing below as a confusing
            # non-fast-forward rejection from the push.
            if GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git ls-remote --exit-code --heads origin >/dev/null 2>&1; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git pull --rebase
            fi
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git push
          fi
        else
          echo "GO_PUSH secret not configured, skipping"
        fi

    # Push to Python repository
    - name: Push to jettison_proto_python
      run: |
        set -e  # Exit on any error
        if [ -n "${{ secrets.PYTHON_PUSH }}" ]; then
          # Clean up any existing target-repo directory
          rm -rf target-repo

          # Clone via HTTPS using GitHub token for authentication
          echo "Cloning repository..."
          git clone https://${{ github.actor }}:${{ github.token }}@github.com/lpportorino/jettison_proto_python.git target-repo || {
            echo "Failed to clone repository"
            exit 1
          }

          cd target-repo

          # Setup SSH key for pushing
          mkdir -p ~/.ssh
          echo "${{ secrets.PYTHON_PUSH }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git to use SSH for push
          git remote set-url origin git@github.com:lpportorino/jettison_proto_python.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Update files
          rm -rf *_pb2.py *_pb2.pyi
          cp -r ../output/python/* .

          cp ../LICENSE .
          # Decide, then stamp (see the fan-out ordering note above).
          git add -A
          if git diff --staged --quiet; then
            echo "No Python binding changes to distribute"
          else
            echo "# Jettison Proto Python Bindings" > README.md
            echo "" >> README.md
            echo "Auto-generated Python bindings with type stubs." >> README.md
            echo "" >> README.md
            echo "**Target Platform**: ARM64 (NVIDIA Jetson AGX Orin BSP 6.2)" >> README.md
            echo "**Build Architecture**: $(uname -m)" >> README.md
            echo "" >> README.md
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md
            echo "Commit: ${{ github.sha }}" >> README.md

            git add -A
            git commit -m "Update Python bindings from ${{ github.sha }}"
            # Pull before pushing. A brand-new consumer repository has no upstream
            # branch yet; that one case is benign and is now detected explicitly.
            # Anything else — a rebase conflict, an auth or network failure — ABORTS
            # here instead of being swallowed and resurfacing below as a confusing
            # non-fast-forward rejection from the push.
            if GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git ls-remote --exit-code --heads origin >/dev/null 2>&1; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git pull --rebase
            fi
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git push
          fi
        else
          echo "PYTHON_PUSH secret not configured, skipping"
        fi

    # Push to TypeScript repository
    - name: Push to jettison_proto_typescript
      run: |
        set -e  # Exit on any error
        if [ -n "${{ secrets.TYPESCRIPT_PUSH }}" ]; then
          # Clean up any existing target-repo directory
          rm -rf target-repo

          # Clone via HTTPS using GitHub token for authentication
          echo "Cloning repository..."
          git clone https://${{ github.actor }}:${{ github.token }}@github.com/lpportorino/jettison_proto_typescript.git target-repo || {
            echo "Failed to clone repository"
            exit 1
          }

          cd target-repo

          # Setup SSH key for pushing
          mkdir -p ~/.ssh
