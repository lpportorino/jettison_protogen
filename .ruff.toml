# Pinned executable: tools/lint/ruff.sh. The default syntax floor is Python 3.12.
required-version = "==0.16.10"
target-version = "py312"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

# tools/press runs INSIDE its own image (tools/press/Dockerfile), whose interpreter is the
# Playwright base image's Python 3.10. Judging it as 3.12 makes
# the upgrade rules rewrite it into syntax that image cannot import (`datetime.UTC`).
[per-file-target-version]
"tools/press/**" = "py310"
