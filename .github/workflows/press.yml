name: Press browser proofs

on:
  push:
    branches: [main, master]
    paths:
    - "tools/press/**"
    - "press.mk"
    - ".github/workflows/press.yml"
  pull_request:
    paths:
    - "tools/press/**"
    - "press.mk"
    - ".github/workflows/press.yml"

permissions:
  contents: read

jobs:
  browser-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - name: Build the pinned press image
      run: make -f press.mk image
    - name: Exercise browser detectors and launcher boundaries offline
      run: tools/press/bin/press selftest .press/ci-selftest
    - name: Keep browser evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: press-browser-evidence
        path: .press/ci-selftest
        if-no-files-found: error
