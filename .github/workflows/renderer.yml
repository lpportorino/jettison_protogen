# protogen Actions workflow — the RENDERER battery. Deliberately a SEPARATE
# workflow from devcards.yml, with the OPPOSITE container decision, for that
# file's own stated reason:
#
# devcards.yml's header rejects a `container:` built from Dockerfile.base
# because rebuilding the multi-toolchain base image (no layer cache, no
# registry cache) is a bad tax on the HIGH-FREQUENCY devcards path
# (tools/devcards/**, manifests, proto/ui/**), whose only real dependency is
# a JDK. That argument does NOT transfer here: this workflow fires only on
# renderer/** — the once-per-renderer-push battery — and its dependencies are
# exactly what Dockerfile.base provides (the pinned WASI-SDK clang for
# wasm.mk, Rust for the wasmtime harness). Paying one docker build per
# renderer push buys toolchain parity with the local build, and parity is
# load-bearing: the interpreter's relocation gate was a BIT-IDENTICAL
# controls.wasm, and a runner-provisioned clang is precisely the drift that
# gate exists to catch.
#
# Path-triggered on renderer/**, so the workflow could land before the
# interpreter tree itself: until renderer/ exists the workflow structurally
# cannot fire — stood up empty-green, with no vacuous green run pretending
# coverage.
#
# ── Honesty ledger ─────────────────────────────────────────────────────────
# The jobs below encode the FULL battery (build + fixtures + harness +
# matrix/demo oracles — matrix/demo need reference.wasm, which IS a wasm.mk
# target, so they are included, not deferred). One convergence residue is
# open, and the affected steps FAIL LOUDLY at their input checks
# (renderer.mk's honesty ledger names it — nothing is skipped silently,
# nothing is continue-on-error): the harness/oracle FIXTURE source
# (visual-regression scenes, morph triples, matrix/demo EDN→pb codegen)
# still runs from the interim tools/renderer-gen closure; the ratified
# design converges it onto tools/devcards' public UiAst builder — one
# fixture source for oracles AND devcards.
name: Renderer Battery

on:
  push:
    branches: [main, master]
    paths:
    - "renderer/**"
    - "renderer.mk"
    - "Dockerfile.base"
    - "tools/renderer-gen/**"
    - "output/manifests/**"
    # renderer/generated/** is a PROJECTION of output/c (renderer.mk's
    # generated-projection gate), so a binding regenerated there is a renderer
    # input even though nothing under renderer/ moved. Without this entry the
    # freshness gate could only ever fire on the side that was already correct.
    - "output/c/**"
    # The SOURCE side of the proto-db manifest leg, for exactly the reason
    # output/c/** is above it. The "Manifest freshness" step below runs
    # `renderer.mk manifests`, which chains `manifests-proto-db` — a comparison
    # whose INPUTS are these three roots and whose outputs are the
    # output/manifests/*.json already matched. Matching only the outputs armed
    # the gate on the side that was already correct: replaying this filter over
    # the 67 commits in history that touched these roots, 37 (55%) matched no
    # renderer.yml path at all and so never ran this gate in CI — including
    # `fix(protodoc): deterministic manifest provenance, drop wall-clock`, a
    # change to the manifest emitter's own stamping.
    #
    # A docs-only push now pays a full battery, and that is the accepted price:
    # the alternative is a second CI home for one gate, which is what this repo
    # refuses everywhere else. The runner is GitHub-hosted on a public repo, so
    # the minutes are free; what is NOT free is a published manifest nothing
    # compares.
    - "docs/.protodoc/proto-db.edn"
    - "docs/.protodoc/manifest-config.edn"
    - "docs/.protodoc/tools/**"
    - ".github/workflows/renderer.yml"
  pull_request:
    paths:
    - "renderer/**"
    - "renderer.mk"
    - "Dockerfile.base"
    - "tools/renderer-gen/**"
    - "output/manifests/**"
    - "output/c/**"
    # See the push filter above: the proto-db manifest leg's SOURCE side.
    - "docs/.protodoc/proto-db.edn"
    - "docs/.protodoc/manifest-config.edn"
    - "docs/.protodoc/tools/**"
    - ".github/workflows/renderer.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded PR runs; NEVER cancel a master run.
#
# On a pull request only the tip matters — an intermediate push is not a thing
# anyone can pin, so cancelling it costs nothing. On master every push produces
# a sha the consumer fleet can pin (a bisect, a hand-pinned submodule, or simply
# the window between a push and its successor), and this is the 14-minute lane:
# MEASURED, 18 of 41 distinct shas that triggered a Renderer Battery have no
# successful run — 12 of those cancelled. Lint (28 s) has 0 cancellations and
# Devcards 2 of 46, so the effect tracks lane DURATION, not the change. Under
# blanket cancel-in-progress, whether a sha was verified depends on how fast the
# next push landed rather than on anything about the change itself.
#
# The narrowing that keeps this honest: CLAUDE.md's flow is that consumers track
# the master BRANCH and `git submodule update --remote` follows HEAD, and head
# is normally the SURVIVING push — the one whose run was not cancelled. So this
# is not "44% of what consumers pin is unverified"; it is that the intermediate
# shas are unverifiable after the fact, and those are exactly what a bisect walks.
#
# WHAT THIS DOES NOT BUY, stated because the obvious reading is wrong: it does
# NOT give every master sha a battery. GitHub holds at most ONE pending run per
# group and cancels the previously pending one when a third arrives, so a burst
# of four rapid pushes completes the FIRST and the LAST and still discards the
# two in between. The change moves coverage from "only the newest" to "the
# newest, plus every sha that had a free runner when it landed" — strictly
# better, not total. Making it total needs a queue this setting does not have.
#
# Cost, stated rather than hidden: latency. A push that lands during a battery
# now waits for it instead of killing it. On a public repo these are free-tier
# runners, so the cost is time-to-verdict, not budget.
concurrency:
  group: renderer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build both wasm oracles in the pinned toolchain image, then run the
  # wasmtime harness suite + the dual-oracle drivers in the same image (Rust
  # lives there too). One job, one image build — the once-per-renderer-push
  # cost the header argues for.
  battery:
    name: wasm + harness + oracles (Dockerfile.base container)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Build the pinned toolchain image
      run: docker build -t jettison-proto-generator-base:latest -f Dockerfile.base .
    - # Cargo caches keyed on the harness lockfile: the wasmtime host crates
      # are a multi-minute cold build; the cache turns a warm renderer push
      # into seconds of cargo work. CARGO_HOME is redirected into the
      # workspace so the cache survives the container boundary.
      name: Cache cargo registry + harness target
      uses: actions/cache@v5
      with:
        path: |
          .cargo-home/registry
          .cargo-home/git
          renderer/wasm_harness/target
        # BOTH files, not just the lock. The lock pins WHICH dependencies; Cargo.toml's
        # [profile] section decides HOW they are compiled, and a profile change makes the
        # cached artifacts invalid. Keying on the lock alone is an UNDERHASH: the key still
        # hits exactly, so actions/cache restores a now-worthless tree AND — because an
        # exact hit never triggers the post-job save — never replaces it. The rebuild would
        # then be paid on every run instead of once. Overhash, never underhash.
        key: renderer-cargo-${{ hashFiles('renderer/wasm_harness/Cargo.lock', 'renderer/wasm_harness/Cargo.toml') }}
        restore-keys: |
          renderer-cargo-
    - # renderer/generated/** is a projection of output/c and had no producer and
      # no comparison, so a proto change refreshed the bindings while the
      # interpreter went on compiling the old ones — green everywhere, wrong on
      # the wire. FIRST of the docker steps, and that is the whole point: it is a
      # sub-second cmp loop over committed files on both sides, and if it reds
      # then the wasm this job is about to build would be compiled against stale
      # field tags, making every downstream step meaningless. Like the A2
      # manifest step below, it exists here because renderer.yml DECOMPOSES
      # check-renderer into individual targets — a target omitted here simply
      # never runs in CI.
      name: renderer/generated freshness (projection of output/c)
      run: |
        docker run --rm -v "$PWD:/workspace" -w /workspace \
          jettison-proto-generator-base:latest \
          make -f renderer.mk generated-projection
    - # The C half of the format gate lives HERE, not in lint.yml, because the
      # only PINNED clang-format is the one inside this image — the WASI-SDK the
      # renderer is compiled with (/opt/wasi-sdk/bin/clang-format). A formatter
      # rewrites committed source, so its version belongs to the toolchain pin;
      # an unpinned apt clang-format in some other workflow would disagree with
      # what devs run and manufacture the very drift this gate exists to catch.
      # This workflow's path filter fires on every renderer/** change, so no C
      # edit reaches master without passing through here.
      #
      # BEFORE the wasm build, deliberately: it is seconds of work, and a
      # formatting failure should not cost a full multi-minute wasm build first.
      name: clang-format (check, pinned WASI-SDK)
      run: |
        docker run --rm -v "$PWD:/workspace" -w /workspace \
          jettison-proto-generator-base:latest \
          make -f lint.mk fmt-c
    - # clang-tidy static analysis over hand-authored C, HERE for the same
      # reason as clang-format: the pinned clang-tidy is the WASI-SDK's, and the
      # compile database it needs is emitted from THIS image's build flags
      # (make -f lint.mk lint-c-tidy runs `wasm.mk compile-db` first). A
      # hand-assembled flag list invents diagnostics the compiler never sees.
      # Config is renderer/.clang-tidy (WarningsAsErrors:'*'); after clang-format
      # (cheap) and before the wasm build (slow), so an analysis failure does not
      # cost a multi-minute build first.
      #
      # Invoked the same way as clang-format above, with no inline PATH export:
      # lint.mk resolves the pinned run-clang-tidy/clang-tidy by explicit path,
      # exactly as it already resolved clang-format. The export used to be the
      # only reason this was green, which meant CI and `tools/uber.sh 'make -f
      # lint.mk lint-c-tidy'` disagreed about how the gate finds its binary —
      # and the local one failed with a message naming the very thing you were
      # already doing.
      name: clang-tidy (static analysis, pinned WASI-SDK)
      run: |
        docker run --rm -v "$PWD:/workspace" -w /workspace \
          jettison-proto-generator-base:latest \
          make -f lint.mk lint-c-tidy
    - # THE LVGL DRIFT AXIS, plus the canary layer that proves its parity
      # assertion still fires. Both were in `check-renderer` and in ZERO
      # workflows — CI decomposes the battery, so a target omitted here simply
      # never runs.
      #
      # `construct-bindings` re-extracts the vendored LVGL enums with the
      # container's clang (AST dump, for typedef grouping) and gcc (a native
      # probe, the only correct oracle for `A | B` bitmask and macro-derived
      # values), re-emits enums.clj + renderer/generated/ui_luts.h from that one
      # extraction, and cmps both against the committed copies. This is a WIRE
      # gate, not a codegen gate: `construct/registry.clj`'s assign-once
      # numbering THROWS when a vendored-LVGL bump renumbers an already-pinned
      # member, which is a silent cross-fleet wire break — and a whole set of
      # enum typedefs is DIRECT-CAST, so the proto number must EQUAL the header
      # value and the C compiler cannot catch a shift because the generated
      # header IS the declaration. `generated-projection` above structurally
      # cannot see this axis: it projects from output/c and deliberately
      # excludes ui_luts.h (renderer.mk records the split).
      #
      # `clj-schema-test` is the canary layer for the schema guards. The
      # sharpest form of the gap it closes: lint.yml already hands
      # tools/renderer-gen/test to clj-kondo, so CI LINTED THESE CANARIES AND
      # NEVER EXECUTED THEM.
      #
      # PATH-FILTER CHECK (the failure this workflow already made once with the
      # proto-db leg): construct-bindings reads renderer/lvgl/**, renderer/
      # lv_conf.h and tools/renderer-gen/{src,tools}/**, and writes into
      # tools/renderer-gen/src/lvgl_codegen/generated/ and renderer/generated/;
      # clj-schema-test reads tools/renderer-gen/{src,test}/**. Every one of
      # those is under `renderer/**` or `tools/renderer-gen/**`, both already in
      # this workflow's `paths:`. Nothing here needs a new trigger.
      #
      # In the container because the extractor needs BOTH the WASI-SDK clang and
      # a native gcc, neither of which a plain runner is provisioned with. After
      # the cheap C lint lanes, before the wasm build.
      name: LVGL enum factory freshness + renderer-gen schema canaries
      run: |
        docker run --rm -v "$PWD:/workspace" -w /workspace \
          jettison-proto-generator-base:latest \
          make -f renderer.mk construct-bindings clj-schema-test
    - # A2: every published manifest must be byte-fresh vs a regen from its
      # source. check-renderer runs `manifests` FIRST locally; renderer.yml
      # DECOMPOSES check-renderer into individual targets, so without this step
      # CI would never catch a manifest that drifted from its source
      # (harness/oracles/goldens all render self-consistently against a stale
      # manifest).
      #
      # THIS STEP HAS TWO LEGS, and the title used to name only the first. The
      # `manifests` target emits+cmps design-tokens.json / renderer-caps.json
      # (from tokens.edn) and generated/theme_tokens.h + gesture_thresholds.h
      # (tokens.edn's C projections), and then CHAINS `manifests-proto-db`,
      # which emits+cmps the four output/manifests/*.json the fleet consumes
      # (endpoints / signals / sub-signals / reverse-index) from
      # docs/.protodoc/proto-db.edn. The old comment asserted "Reads only
      # tokens.edn + renderer.c" — false since that leg was chained in, and
      # believing it is precisely why this workflow's `paths:` never grew the
      # proto-db roots it now carries.
      #
      # Still no wasm / proto-classes / cargo, so it runs cheaply and fails
      # early.
      name: Manifest freshness (A2 — design-tokens + renderer-caps + theme/gesture headers + the proto-db manifests)
      run: |
        docker run --rm -v "$PWD:/workspace" -w /workspace \
          jettison-proto-generator-base:latest \
          make -f renderer.mk manifests
    - name: Build controls.wasm + reference.wasm (bit-identity artifact)
      run: |
        docker run --rm -v "$PWD:/workspace" -w /workspace \
          -e CARGO_HOME=/workspace/.cargo-home \
          jettison-proto-generator-base:latest \
          make -f renderer.mk wasm reference
        sha256sum renderer/output/controls.wasm renderer/output/reference.wasm
    - # `reload` and `decode-limits` join this invocation, closing the last two
      # battery lanes that ran in no workflow at all.
      #
      # THEY RIDE THIS `make`, NOT A STEP OF THEIR OWN, for the reason
      # renderer.mk's own header gives for morph-fixtures: `reload` takes the
      # shared `morph-fixtures` prerequisite that `oracles`→`morph-parity`
      # already builds, and make builds a phony target once per invocation — a
      # second `make` would regenerate the triples a second time for nothing.
      #
      # WHAT THEY COVER THAT NOTHING ELSE HERE DOES. Measured when arming them:
      # reverting the atomic uid-registration fix in renderer.c (identity
      # propagating BEFORE register_uid is consulted) and rebuilding reds
      # `reload/duplicate_uid_screen_reload` — "colliding load left duplicate
      # uid(s) in the live tree" — while its three sibling tests in the same
      # binary pass and `decode-limits` passes on that same wasm. That control is
      # the sharp one: decode_limits walks the IDENTICAL collision path (it
      # builds two nodes with uid 42 and its log shows "uid 42 registered twice")
      # and still passes, because it asserts "refused, not trapped" and never
      # inspects identity bookkeeping. The wider claim that the pixel oracles and
      # the devcards corpus also stay green is the gate audit's measurement, not
      # re-run here; the structural reason it holds is that the defect is
      # invisible in the framebuffer and invisible to a pure reload, so only a
      # dump_tree uid-uniqueness assertion can see it.
      #
      # `decode-limits` is uniquely-covering by construction: the in-tree
      # fixtures top out at three nesting levels and the corpus at six, so a
      # MAX_DECODE_DEPTH above six is invisible to every other lane — which is
      # exactly how it went unreachable once without a gate noticing. It is also
      # the ONLY assertion that wasm.mk's 256 KiB stack reservation is adequate.
      #
      # PATH-FILTER CHECK: harness and oracles read
      # renderer/wasm_harness/tests/*.rs and the controls.wasm built from
      # renderer/src/**; reload additionally reads the morph triples emitted
      # from tools/renderer-gen/** against output/manifests/design-tokens.json.
      # All four roots are already in this workflow's `paths:`.
      #
      # dump-contracts IS DIFFERENT and the difference is not covered by the
      # sentence above. Its renderer-side halves — the descend_gate emission
      # and the truncation sentinel, both in renderer/src/** — do trigger this
      # workflow. Its probe and the membrane it asserts against live under
      # tools/devcards/**, which this workflow's `paths:` does NOT name, so a
      # push touching only that root never starts this job. That gap is closed
      # on the other side rather than by widening the filter (which would run
      # the whole battery on every corpus edit): devcards.host/normalize-dump
      # is a pure fn gated by devcards.host-test under devcards.yml's
      # devcards-test, which does fire on tools/devcards/**. Read this lane as
      # proof the two SIDES agree — not as the only gate on either one.
      name: Harness suite + oracles + reload-cycle + decode-limits + dump contracts
      run: |
        docker run --rm -v "$PWD:/workspace" -w /workspace \
          -e CARGO_HOME=/workspace/.cargo-home \
          jettison-proto-generator-base:latest \
          make -f renderer.mk harness oracles reload decode-limits dump-contracts
    - # The wasm + harness steps run as ROOT inside the container (no --user),
      # so every file cargo writes into the cached paths comes back root-owned.
      # The post-job `actions/cache` save runs as the RUNNER user, cannot read
      # them, and dies with `"/usr/bin/tar" failed with exit code 2` — the cache
      # is then never written, so the next run pays the full cold cargo build
      # that this cache exists to avoid. Hand the paths back before that save.
      # `|| true`: this is a cache optimisation, never a reason to fail the job.
      name: Return cargo cache ownership to the runner (pre cache-save)
      if: always()
      run: |
        sudo chown -R "$(id -u):$(id -g)" \
          .cargo-home renderer/wasm_harness/target 2>/dev/null || true
    - name: Upload wasm artifacts (for the fixtures job + debugging)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: renderer-wasm
        path: |
          renderer/output/controls.wasm
          renderer/output/reference.wasm
        retention-days: 7
        if-no-files-found: error
  
  # The devcards corpus regen against the freshly built wasm — the fixtures
  # regen + golden freshness gate. Runner-provisioned JDK/Clojure (the
  # devcards runner is pure JVM+GraalWasm — devcards.yml's own provisioning
  # argument), consuming the wasm ARTIFACT from the battery job rather than
  # rebuilding the toolchain image a second time.
  fixtures:
    name: devcards corpus regen + golden freshness
    runs-on: ubuntu-latest
    needs: battery
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Download the built wasm
      uses: actions/download-artifact@v7
      with:
        name: renderer-wasm
        path: renderer/output/
    - name: Set up GraalVM CE for JDK 25 (LTS)
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: "25"
        distribution: "graalvm-community"
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Clojure CLI
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: "1.12.5.1654"
    - name: Cache Maven-resolved deps
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: devcards-m2-${{ hashFiles('tools/devcards/deps.edn') }}
        restore-keys: |
          devcards-m2-
    - # The interaction-prebuilt lane in the step below builds the wasmtime
      # harness with cargo; cache its registry + target so a warm fixtures run
      # does not pay a cold Rust build. Keyed on the harness lockfile — the same shape as the battery job's
      # cargo cache (this job runs on the plain runner, so CARGO_HOME is ~/.cargo,
      # not the container's redirected path).
      name: Cache cargo registry + interaction-harness target
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          renderer/wasm_harness/target
        # Both files — see the renderer-cargo key above for why the lock alone underhashes.
        key: fixtures-cargo-${{ hashFiles('renderer/wasm_harness/Cargo.lock', 'renderer/wasm_harness/Cargo.toml') }}
        restore-keys: |
          fixtures-cargo-
    - # B3b: the ui bindings compile via renderer.mk's `bindings` prereq
      # (compile-bindings.sh) — the ONE home. The inline javac that used to sit
      # here had no -sourcepath (UiNodes.java references cmd.Root) and no rm -rf
      # (an orphan .class survived a rename); dropping it and running BOTH
      # prebuilt targets in ONE make invocation compiles the bindings exactly
      # once (they share the prereq). fixtures-prebuilt consumes the wasm
      # ARTIFACT downloaded above and FAILS LOUD if it is absent — this runner
      # has no WASI toolchain, so it must never re-trigger the wasm build (the
      # plain `fixtures` target depends on `wasm` and would). gallery-prebuilt
      # regenerates the JPEG gallery + doc pages.
      #
      # interaction-prebuilt is the wasmtime cross-engine suite
      # (composition_interaction.rs): check-renderer runs it locally, but
      # renderer.yml DECOMPOSES check-renderer and — like the A2 manifest gate
      # before it — once omitted this lane, so a pointer-contract or cross-engine
      # (wasmtime vs GraalWasm) regression could not redden CI. It re-renders the
      # composition cards on the DOWNLOADED wasm and replays the pointer contract
      # natively; the runner's preinstalled cargo builds the harness (cached
      # above) — no WASI toolchain needed, wasmtime is pure Rust.
      #
      # It rides in THIS invocation rather than a step of its own for the same
      # reason the other two share one: it takes fixtures-prebuilt as a declared
      # prerequisite, and a phony prerequisite named by a SECOND `make` would
      # re-render the entire corpus a second time. One invocation, one render,
      # and make (not step adjacency) is what orders the suite after the cards.
      name: Corpus build + judge + gallery + interaction + dead-zone canary (renderer.mk *-prebuilt)
      run: make -f renderer.mk fixtures-prebuilt gallery-prebuilt interaction-prebuilt deadzone-canary-prebuilt
    - # A renderer change that shifts any pixel MUST re-mint the goldens AND
      # the gallery/doc pages in the same change (the manifests pin per-card
      # raw-FB sha256; the contact sheets are renders of the same corpus). A
      # dirty goldens/ or docs/ here means the push forgot them.
      name: Golden manifest + gallery freshness
      run: git diff --exit-code tools/devcards/goldens tools/devcards/docs

    # The UI-standard briefing freshness gate lives in devcards.yml, NOT here.
    # Its inputs are docs/UI-QUALITY-CONTRACTS.md, devcards/lvgl_classes.clj
    # and each producer's :thresholds — none of which this workflow's `paths:`
    # filter matches, so arming it here gave a gate that ran only on pushes
    # that structurally could not drift the briefing, and never on the ones
    # that could.
