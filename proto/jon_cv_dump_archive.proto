syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/cvdump";

package jon.cvdump;

// Format version of a CvDumpArchive. Carried as CvDumpArchive.version — FIELD
// NUMBER 1, PERMANENTLY. That number is never renumbered and never reused for
// anything else, because it is the ONE field every future reader must be able
// to find without knowing the rest of the schema.
//
// Why the payload states its own version at all: a bundle gets separated from
// its index row routinely — copied to a drive by cdump/export-drive!, pulled
// piecemeal by cdump/pull!, handed over months later with no target reachable.
// A payload that cannot state its own format is undecodable the moment that
// happens. The cv_dump_sessions index row keeps its own schema marker; this is
// IN ADDITION, never a replacement.
//
// HOW A READER GETS IT WITHOUT PARSING ANYTHING ELSE: a protobuf message is a
// flat sequence of (tag, value) pairs, and a tag's low 3 bits are the wire
// type. So a reader walks tags and skips values using ONLY the wire type
// (varint -> skip a varint; 64-bit -> skip 8; length-delimited -> read a varint
// length N, REFUSE if N exceeds the bytes remaining, else skip N; 32-bit ->
// skip 4), never interpreting a field body and never consulting a schema.
//
// TWO RULES THAT ARE NOT OPTIONAL — a reader that breaks either disagrees with
// every schema-aware parser on bytes that are perfectly legal:
//
//   1. SCAN TO THE END AND KEEP THE LAST field 1, never stop at the first.
//      Protobuf is last-one-wins on a duplicated scalar, and concatenating two
//      encoded messages is a DEFINED merge — so an appended-to archive legally
//      carries two versions and only the last one is its own.
//   2. RANGE-CHECK EVERY LENGTH BEFORE ADDING IT to the cursor. A corrupt or
//      hostile length is an unsigned 64-bit wire value; narrowing it to a
//      signed offset without the check drives the cursor BACKWARDS, which a
//      forward-only overrun test structurally cannot catch.
//
// In practice the version is the first two bytes of a harvester-written file
// (0x08 then the value), because field 1 is the lowest field number and this
// archive is written by google.golang.org/protobuf, whose marshaller emits
// fields in ascending field-number order — but that is a convenience of THIS
// writer, not the contract. Rule 1 is what makes the scan correct on a file
// this repo did not write.
//
// The value numbering CONTINUES the cv_dump bundle's own sequence: the JSON
// manifest this message replaces reached schema_version 2, so the first archive
// version is 3. One monotonic scale for "the cv_dump bundle format", not two.
enum ArchiveFormatVersion {
  // Absent on the wire (proto3 does not encode a zero enum). A reader that
  // finds no version field MUST REFUSE the archive — it cannot know what it is
  // holding. This is deliberately the same signal as "field missing".
  ARCHIVE_FORMAT_VERSION_UNSPECIFIED = 0;

  // The nested-proto archive: manifest, io-record streams and TSDB telemetry
  // slices in one message; ring video stays as byte-for-byte VCAP segment files
  // beside it, described by VideoSegment.
  ARCHIVE_FORMAT_VERSION_V3 = 3;
}

// How a StreamGroup.payload must be turned back into its records.
//
// This enum is the CODEC SWAP seam. Compression, when it lands, changes NO
// field and NO message shape: a writer sets a new value here and compresses
// StreamGroup.payload; decoded_bytes and sha256 already describe the DECODED
// bytes, so the integrity contract is codec-independent by construction.
//
// A value is added here ONLY together with the writer that emits it — a
// declared-but-unproducible value is a signal that can never fire while readers
// keep asserting it (mirror-obligations.md). So v1 declares NONE and nothing
// else; a reader meeting an unknown value is reading a NEWER writer's archive
// and must refuse THAT GROUP while still reading the rest of the message.
enum ArchiveCodec {
  // Absent on the wire. A group MUST state its codec — refuse the group.
  ARCHIVE_CODEC_UNSPECIFIED = 0;

  // payload is the serialized records message verbatim, uncompressed.
  ARCHIVE_CODEC_NONE = 1;
}

// What a StreamGroup holds, and therefore how payload parses once decoded.
// Groups are ordered by this value so every group of one kind is CONTIGUOUS in
// the encoded archive — the property a future codec needs, since a homogeneous
// byte run is what compresses.
enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;

  // `logs:can:<id>` on the LOGS redis (db 6) — one group per CAN id, so one group
  // is one id and therefore one direction. payload is RedisStreamRecords.
  STREAM_KIND_CAN = 1;

  // logs:rotary:uart:{tx,rx} — the rotary platform's chunked DATCON byte
  // stream. payload is RedisStreamRecords.
  STREAM_KIND_ROTARY_UART = 2;

  // logs:frame:{day,heat} — the C RECORD_PROD per-frame taps.
  // payload is RedisStreamRecords.
  STREAM_KIND_FRAME_TAP = 3;

  // A windowed TimescaleDB table slice (state_logs, autofocus_log,
  // journal_logs, crashes, xform_log). source is the table name, columns
  // carries its schema, and payload is TableRows.
  STREAM_KIND_TSDB_TABLE = 4;

  // logs:motion:history — eutropia's motion-history transport stream: one
  // io_redis record per composed motion-history entry (day + heat CUDA-IPC
  // posts), each record's payload a self-verifying mh wire image
  // (crc32c ‖ seq_abs ‖ MhEntry). payload is RedisStreamRecords.
  STREAM_KIND_MOTION_HISTORY = 5;
}

// Whether the capture the archive describes is trustworthy as a whole. Mirrors
// the cv_dump_sessions.status text column exactly (complete | partial | failed);
// the column stays text so existing SQL keeps working.
enum ArchiveStatus {
  ARCHIVE_STATUS_UNSPECIFIED = 0;
  ARCHIVE_STATUS_COMPLETE = 1;  // every promised artifact landed intact
  ARCHIVE_STATUS_PARTIAL = 2;   // usable, but at least one degrade flag is set
  ARCHIVE_STATUS_FAILED = 3;    // the harvest aborted; see IntegrityReport.note
}

// Where the capture-session id came from.
enum SessionProvenance {
  SESSION_PROVENANCE_UNSPECIFIED = 0;
  SESSION_PROVENANCE_EUTROPIA = 1;      // the id eutropia minted and tagged autofocus_log with
  SESSION_PROVENANCE_SYNTHESIZED = 2;   // eutropia never tagged a row; the harvester minted a UUIDv4
}

// ONE capture-session archive — the whole self-description of a cv_dump bundle
// in a single nested message, written to `<bundle>/archive.pb`.
//
// It replaces manifest.json, `io_records/<stream>.bin` and
// `telemetry/<table>.jsonl.zst` + telemetry/schema.json. The FAT-safe-filename
// problem those files created is gone with them: a redis stream key now rides
// in StreamGroup.source verbatim, so nothing is lossily rewritten to reach a
// vfat/exfat export drive.
//
// What deliberately stays OUTSIDE this message: the ring video. A dump can
// carry gigabytes of VCAP segments (the day ring alone defaults to 42 x 64 MiB
// — see parse_segments in mods/video_capture/video_capture.cpp), which no
// in-memory proto can hold and which a 2 GiB message limit forbids outright.
// Segments therefore stay byte-for-byte files under `video/<channel>/`, fully
// described by VideoSegment.
//
// FIELD ORDER IS DELIBERATE: everything needed to triage a bundle sits at a
// LOWER field number than `streams`, so a reader that stops at the first large
// field has already seen the version, the identity and the verdict.
message CvDumpArchive {
  // PERMANENTLY FIELD 1. See ArchiveFormatVersion for why, and for how a reader
  // recovers it without a schema. Never renumber, never reuse.
  ArchiveFormatVersion version = 1;

  // The capture-session id — an eutropia-minted dashed UUID, or a harvester
  // UUIDv4 of the same shape (see provenance). Also the bundle directory name
  // and the cv_dump_sessions primary key.
  string id = 2 [(buf.validate.field).string.min_len = 36];

  // When this archive was written (ISO-8601, RFC3339 with nanoseconds, UTC).
  // NOT the capture window — that is `window`.
  string generated_at = 3;

  // The [t0,t1] capture window, in both clock domains.
  CaptureWindow window = 4;

  SessionProvenance provenance = 5;

  // Free-text harvester note. Empty on a healthy harvest; on a failed one it
  // carries the failure REASON, and is frequently the only human-readable
  // record of why a bundle is unusable. Distinct from the operator's own note,
  // which lives in cv_dump_sessions.operator_note and never here.
  string note = 6;

  // Which device, which boot, which deployed code produced this capture.
  MachineIdentity machine = 7;

  // Whether the capture is trustworthy, and every degrade flag behind that
  // verdict.
  IntegrityReport integrity = 8;

  // Per-channel ring-video description, ONE ENTRY PER PROMISED CHANNEL — a
  // channel that captured nothing appears here with no segments rather than
  // being dropped, so the promise stays visible. The segment BYTES are files;
  // this is their inventory plus the per-segment time window parsed out of the
  // VCAP records at harvest time.
  //
  // There is deliberately no separate `channels` list and no `total_bytes`:
  // both would be stored copies of what this field already determines, and a
  // stored aggregate is free to disagree with its own parts. Sum the segments.
  repeated VideoChannel video = 9;

  // The io-record and telemetry lanes, ORDERED BY (kind, source) so all groups
  // of one kind are contiguous. It is the bulk of a capture-window bundle.
  repeated StreamGroup streams = 10;

  // The cv-dump PHOTO (cmd.CV.DumpShot): one instant, every plane of both
  // channels' rings, as files under shots/ with their geometry, encoding and
  // provenance here. ONE ENTRY PER PROMISED CHANNEL, the VideoChannel rule — a
  // channel that captured nothing appears with no planes and a reason. Empty
  // on a capture-window bundle; a photo bundle has empty video + streams.
  repeated ShotCapture shots = 11;
}

// One plane of one channel's photo. The output format keys on the plane's
// FORMAT tag from the control block, never on the plane index.
message ShotPlane {
  // Ring plane index (0..3).
  uint32 plane = 1 [(buf.validate.field).uint32.lte = 3];
  // SensorRingPlaneTag as the control block carried it: 1 NATIVE, 2 CLAHE,
  // 3 OPERATOR, 4 RAW.
  uint32 tag = 2;
  // The plane's source pixel format (NvBufSurfaceColorFormat, or the RAW
  // enum), as the control block carried it.
  uint32 source_format = 3;
  // Bundle-relative path, e.g. "shots/day_p0_raw.rg12".
  string path = 4 [(buf.validate.field).string.min_len = 1];
  // "png8-rgb" | "png8-gray" | "raw-rg12-msb16" | "raw-nv12".
  string encoding = 5 [(buf.validate.field).string.min_len = 1];
  uint32 width = 6;
  uint32 height = 7;
  // Source pitch in bytes (what the raw encodings preserve verbatim).
  uint32 pitch = 8;
  // NV12 UV-plane offset within the source, 0 for single-plane formats.
  uint32 uv_offset = 9;
  uint64 bytes = 10;
  // Lowercase hex SHA-256 of the file.
  string sha256 = 11 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

// One channel's photo: the frame's identity + the whole control block, and
// every plane written for it.
message ShotCapture {
  // "day" | "heat".
  string channel = 1 [(buf.validate.field).string = {
    in: ["day", "heat"]
  }];
  uint32 generation = 2;
  uint64 pts_ns = 3;
  // CLOCK_MONOTONIC — the cross-channel skew key.
  uint64 capture_time_ns = 4;
  // The 1024-byte control block, verbatim, as snapshotted under the seqlock.
  bytes ctl_snapshot = 5;
  // Empty when the channel captured nothing — then absent_reason says why.
  repeated ShotPlane planes = 6;
  string absent_reason = 7;
}

// The capture window in both clock domains.
//
// The wall stamps index the redis io-record streams (redis auto-ids are
// wall-clock ms) and the cv_dump_sessions t0/t1 columns. The boot stamps are
// the segment-timeline join key. They are only comparable ACROSS bundles when
// MachineIdentity.boot_id matches, because boot_id is the namespace of every
// CLOCK_BOOTTIME value here.
message CaptureWindow {
  string t0_wall = 1;    // ISO-8601, RFC3339 with nanoseconds, UTC
  string t1_wall = 2;
  int64 t0_boot_ns = 3;  // CLOCK_BOOTTIME at the dump-start edge
  int64 t1_boot_ns = 4;  // CLOCK_BOOTTIME at the dump-stop edge
}

// Device + boot + deployed-code identity, gathered at harvest time from local
// reads only. Every field is individually best-effort: an unreadable source
// leaves the field ABSENT (not empty-string) and sets machine_incomplete, which
// is informational and never forces a partial verdict.
//
// machine_id keys the DEVICE; boot_id keys the BOOT — and because every
// *_boot_ns value in this archive is CLOCK_BOOTTIME, boot_id is the namespace
// of all of them. Two bundles join on boot time iff their boot_id matches;
// otherwise only wall-clock joins are valid.
message MachineIdentity {
  optional string machine_id = 1;  // /etc/machine-id
  optional string hostname = 2;
  optional string hw_model = 3;    // /proc/device-tree/model
  optional string boot_id = 4;     // /proc/sys/kernel/random/boot_id

  // What code produced this capture, read from the deployed sysroot manifest at
  // /etc/jettison/sysroot-manifest.json — a LOCAL file, so it survives the TSDB
  // being down. Absent when that file is missing or unparseable.
  DeployFingerprint deploy = 5;

  // The interpretation constants that otherwise live only in the C stream
  // defines headers. An offline consumer must not have to correlate a firmware
  // version against source headers to learn the heat crop. Repeated rather than
  // a map so the encoding is deterministic and the C binding needs no options.
  repeated ChannelConfig channels_config = 6;

  // At least one of the fields above could not be read.
  bool machine_incomplete = 7;
}

// The deploy the capture ran under. Values are opaque strings to a consumer.
message DeployFingerprint {
  string fingerprint = 1;   // repo_state.fingerprint_sha256
  string jettison_sha = 2;  // repo_state.jettison_sha
  string describe = 3;      // repo_state.jettison_describe
  string deployed_at = 4;   // build.timestamp_iso
}

// Frozen per-channel stream constants (day: 1920x1080; heat: a 900x720 crop of
// the 1280x720 core).
message ChannelConfig {
  string channel = 1;        // "day" | "heat"
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps_limit = 4;      // the encoder's rate ceiling
  uint32 sensor_fps = 5;     // what the sensor is configured to deliver
  uint32 crop_margins = 6;   // per-side crop applied to the core, in pixels
}

// Whether the capture is trustworthy, and why. Every bool here is a DEGRADE
// FLAG: any one of them set means status is PARTIAL at best, never a silent
// COMPLETE.
message IntegrityReport {
  ArchiveStatus status = 1;

  // Ring segments that vanished or failed to copy mid-harvest (drop-oldest
  // rotation lapping the harvest), plus channels whose segment directory could
  // not be listed. Counts VIDEO losses only — an io-record or telemetry failure
  // has its own flag below and must never inflate this number.
  uint32 lapped_segments = 2;

  // The window's HEAD was never captured: the oldest segment overlapping
  // [t0,t1] begins later than t0 plus the rec-enable tolerance, or the harvester
  // joined an already-running dump and stamped a late t0.
  //
  // THIS IS THE ONLY DETECTOR FOR AN UNDER-SIZED DUMP WINDOW. lapped_segments
  // does not fire for it: a segment evicted before the harvest is simply absent,
  // not a failed copy. Do not remove or weaken it.
  bool window_start_lost = 3;

  // The writer-owned newest segment still overlapped [t0,t1] and could not be
  // rotated out, so the window's video tail is truncated.
  bool writer_seg_skipped = 4;

  // The pre-dump rec_control state was unreadable at t0, so the restore was
  // SKIPPED rather than driving a fabricated OFF. Informational: it does not by
  // itself make the bundle partial.
  bool rec_control_unknown = 5;

  // The t0 rec_control enable failed, so the window may hold no video at all.
  bool rec_enable_failed = 6;

  // Channels present in CvDumpArchive.video that captured ZERO in-window
  // segments — a promised channel listed rather than silently absent.
  //
  // The reference is `video`, NOT a `channels` list: this message deliberately
  // has no such field (see the note on `video` itself — a separate list would
  // be a stored copy free to disagree with its own parts). An earlier draft of
  // this comment named `CvDumpArchive.channels`, which does not exist and
  // never did; a consumer author following it goes looking for a field that
  // cannot be found.
  repeated string no_window_video_channels = 7;

  // Sources that hit their per-source record cap: a redis stream key, or a TSDB
  // table name. Dropped WITH a count (see the group's record_count), never
  // silently.
  repeated string truncated_sources = 8;

  // At least one TSDB table could not be read or its schema could not be
  // resolved. The window's telemetry is unrecoverable later, so this IS partial.
  bool telemetry_incomplete = 9;

  // The io-record export failed part-way (redis unreachable, auth, a mid-window
  // XRANGE error). Distinct from lapped_segments so a redis fault is never
  // reported as lost video.
  bool io_records_incomplete = 10;
}

// One channel's ring video: the segment files that cover [t0,t1], and the time
// window each was measured to hold.
message VideoChannel {
  string channel = 1;  // "day" | "heat"
  repeated VideoSegment segments = 2;
}

// One VCAP ring segment, copied byte-for-byte into the bundle.
//
// The [start_ns,end_ns] window is parsed from the segment's own VCAP records at
// harvest time and would otherwise be discarded — carrying it is what lets an
// offline reader pick the segment covering a timeline event without re-walking
// every file. BOTH stamps are CLOCK_MONOTONIC (video_capture stamps them from
// now_ns, and the per-record ctl capture_time_ns is documented monotonic),
// compared here against a CLOCK_BOOTTIME window. On a target that never
// suspends the two coincide; that is a premise, not an identity.
message VideoSegment {
  uint32 sequence = 1;  // the NNNNNNNN of seg_NNNNNNNN.bin
  string path = 2;      // bundle-relative, e.g. "video/day/seg_00000123.bin"
  uint64 bytes = 3;
  string sha256 = 4 [(buf.validate.field).string.len = 64];  // lowercase hex

  int64 start_ns = 5;   // first record's capture_time_ns
  int64 end_ns = 6;     // last record's capture_time_ns

  // end_ns is a LOWER BOUND, not the true segment end: the record walk stopped
  // early (record cap, a torn tail, or a control-block layout/CRC refusal). A
  // reader must treat the segment as open on the high side.
  bool open_end = 7;
}

// One contiguous run of records from ONE source.
//
// The records are carried as an opaque payload rather than as repeated nested
// messages precisely so a codec can be applied to them later without touching
// the layout: compression operates on a byte range, and a byte range is what
// this field is. Groups are emitted ordered by (kind, source) so like sits
// beside like in that range.
message StreamGroup {
  StreamKind kind = 1;

  // The EXACT source, never sanitized: a redis stream key for kinds 1-3
  // (e.g. "logs:can:0x500", "logs:rotary:uart:tx"), a TSDB table name for
  // kind 4 (e.g. "state_logs").
  string source = 2 [(buf.validate.field).string.min_len = 1];

  // How to turn payload back into records. See ArchiveCodec.
  ArchiveCodec codec = 3;

  // How many records payload decodes to. A reader that decodes a different
  // number has a corrupt group.
  uint64 record_count = 4;

  // Length of the DECODED payload in bytes — equal to payload's own length
  // while codec is NONE, and the pre-compression length once it is not.
  uint64 decoded_bytes = 5;

  // sha256 (lowercase hex) of the DECODED payload. Deliberately over the
  // decoded bytes, not the stored ones, so the integrity contract is unchanged
  // by a later codec.
  string decoded_sha256 = 6 [(buf.validate.field).string.len = 64];

  // This source hit its per-source record cap, so the group holds the OLDEST
  // record_count records of the window and the rest were dropped. Also listed
  // in IntegrityReport.truncated_sources.
  bool truncated = 7;

  // TSDB-table groups only (kind 4): the table's columns in ordinal order, so
  // the rows parse offline with no PostgreSQL catalog. Empty for redis-stream
  // kinds.
  repeated ColumnDef columns = 8;

  // The records. Decode with codec, then parse as RedisStreamRecords for kinds
  // 1-3 or TableRows for kind 4.
  bytes payload = 9;
}

// One column of a TSDB table.
message ColumnDef {
  string name = 1;
  string type = 2;  // the PostgreSQL data_type, verbatim from information_schema
}

// The decoded payload of a redis-stream group (StreamKind 1-3).
message RedisStreamRecords {
  repeated RedisStreamRecord records = 1;
}

// One redis stream entry, byte-faithful.
message RedisStreamRecord {
  // The redis stream id, e.g. "1783264662041-0". Its millisecond part is
  // wall-clock, so it joins to CaptureWindow.t0_wall / t1_wall.
  string id = 1;

  // Field/value pairs, sorted by field name. Order is NOT load-bearing —
  // consumers read fields by name — it is sorted so the encoding is
  // deterministic.
  repeated RedisStreamField fields = 2;
}

// A single redis field. value is RAW BYTES and is never UTF-8 decoded: the
// io-record streams carry binary payloads (DATCON frames, CAN blobs) that a
// text round-trip would destroy.
message RedisStreamField {
  string name = 1;
  bytes value = 2;
}

// The decoded payload of a TSDB-table group (StreamKind 4).
message TableRows {
  // One row per entry, each the UTF-8 text of PostgreSQL row_to_json(t) — so a
  // row carries its own column names and survives schema drift. Ordered by the
  // table's `time` column, ascending. No trailing newline: the framing is the
  // repeated field, not a separator byte.
  repeated bytes rows = 1;
}
