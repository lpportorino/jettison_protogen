syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/data/cv";

package ser;

import "jon_shared_data_types.proto";

// CV Gateway state enrichment — the CV subsystem's per-tick state on the STATE
// plane: autofocus metrics and sweep status, ROIs, CV bridge health, camera
// transforms, tracked objects, and whether the trinity tracker is running.
//
// Richer CV output — object detections, SAM tracking, the Ring-Trinity metric
// pose — does NOT travel here. It rides JonGUIState.opaque_payloads as
// ser.JonOpaquePayload entries and is decoded only by the consumers that handle
// each payload type; the state plane does not parse them.
message JonGuiDataCV {
  // Autofocus sweep state
  enum AutofocusState {
    AUTOFOCUS_STATE_UNSPECIFIED = 0;
    AUTOFOCUS_STATE_IDLE = 1;
    AUTOFOCUS_STATE_COARSE_SWEEP = 2;
    AUTOFOCUS_STATE_FINE_SWEEP = 3;
    AUTOFOCUS_STATE_CONVERGED = 4;
    AUTOFOCUS_STATE_FAILED = 5;
  }

  // CV Bridge container status
  enum CvBridgeStatus {
    CV_BRIDGE_STATUS_UNSPECIFIED = 0;
    CV_BRIDGE_STATUS_STOPPED = 1;      // Not running
    CV_BRIDGE_STATUS_STARTING = 2;     // Container starting up
    CV_BRIDGE_STATUS_RUNNING = 3;      // Healthy and processing
    CV_BRIDGE_STATUS_STOPPING = 4;     // Graceful shutdown in progress
    CV_BRIDGE_STATUS_CRASHED = 5;      // Exited unexpectedly
    CV_BRIDGE_STATUS_RESTARTING = 6;   // Auto-restart in progress
  }

  // CV Bridge exit/termination reason
  enum CvBridgeExitReason {
    CV_BRIDGE_EXIT_REASON_UNSPECIFIED = 0;
    CV_BRIDGE_EXIT_REASON_NOT_STARTED = 1;  // Never started since boot
    CV_BRIDGE_EXIT_REASON_NORMAL = 2;       // Clean shutdown
    CV_BRIDGE_EXIT_REASON_ERROR = 3;        // Internal error
    CV_BRIDGE_EXIT_REASON_CUDA_ERROR = 4;   // CUDA/GPU failure
    CV_BRIDGE_EXIT_REASON_IPC_ERROR = 5;    // IPC connection lost
    CV_BRIDGE_EXIT_REASON_OOM = 6;          // Out of memory
    CV_BRIDGE_EXIT_REASON_TIMEOUT = 7;      // Watchdog timeout
    CV_BRIDGE_EXIT_REASON_SIGNAL = 8;       // Killed by signal
  }

  // Day channel autofocus
  AutofocusState autofocus_state_day = 1 [(buf.validate.field).enum = {
    defined_only: true
  }];
  double sharpness_day = 2 [(buf.validate.field).double = {
    gte: 0.0
  }];
  double best_sharpness_day = 3 [(buf.validate.field).double = {
    gte: 0.0
  }];
  int32 sweep_progress_day = 4 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  double best_focus_pos_day = 5 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];

  // Heat channel autofocus
  AutofocusState autofocus_state_heat = 10 [(buf.validate.field).enum = {
    defined_only: true
  }];
  double sharpness_heat = 11 [(buf.validate.field).double = {
    gte: 0.0
  }];
  double best_sharpness_heat = 12 [(buf.validate.field).double = {
    gte: 0.0
  }];
  int32 sweep_progress_heat = 13 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  double best_focus_pos_heat = 14 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];

  // ROI for sharpness calculation (NDC coords: -1 to 1)
  double roi_x1 = 20 [(buf.validate.field).double = {
    gte: -1.0,
    lte: 1.0
  }];
  double roi_y1 = 21 [(buf.validate.field).double = {
    gte: -1.0,
    lte: 1.0
  }];
  double roi_x2 = 22 [(buf.validate.field).double = {
    gte: -1.0,
    lte: 1.0
  }];
  double roi_y2 = 23 [(buf.validate.field).double = {
    gte: -1.0,
    lte: 1.0
  }];

  // CV Bridge status
  CvBridgeStatus bridge_status = 30 [(buf.validate.field).enum = {
    defined_only: true
  }];
  CvBridgeExitReason last_exit_reason = 31 [(buf.validate.field).enum = {
    defined_only: true
  }];
  int64 bridge_uptime_ms = 32 [(buf.validate.field).int64 = {
    gte: 0
  }];
  int32 restart_count = 33 [(buf.validate.field).int32 = {
    gte: 0
  }];

  // ═══════════════════════════════════════════════════════════════════════════
  // ROIs - regions of interest for various camera operations (NDC: -1 to 1)
  // ═══════════════════════════════════════════════════════════════════════════

  // Day channel ROIs
  optional JonGuiDataROI roi_focus_day = 40;
  optional JonGuiDataROI roi_track_day = 41;
  optional JonGuiDataROI roi_zoom_day = 42;
  optional JonGuiDataROI roi_fx_day = 43;

  // Heat channel ROIs
  optional JonGuiDataROI roi_focus_heat = 50;
  optional JonGuiDataROI roi_track_heat = 51;
  optional JonGuiDataROI roi_zoom_heat = 52;
  optional JonGuiDataROI roi_fx_heat = 53;

  // ═══════════════════════════════════════════════════════════════════════════
  // Sharpness metrics with temporal derivatives
  // ═══════════════════════════════════════════════════════════════════════════

  // Day channel sharpness (within roi_focus_day)
  optional JonGuiDataSharpness sharpness_metrics_day = 60;

  // Heat channel sharpness (within roi_focus_heat)
  optional JonGuiDataSharpness sharpness_metrics_heat = 61;

  // ═══════════════════════════════════════════════════════════════════════════
  // Camera motion tracking (3D transforms)
  // ═══════════════════════════════════════════════════════════════════════════

  // Day camera 3D pose and velocity
  optional JonGuiDataTransform3D camera_transform_day = 70;

  // Heat camera 3D pose and velocity
  optional JonGuiDataTransform3D camera_transform_heat = 71;

  // ═══════════════════════════════════════════════════════════════════════════
  // Object tracking
  // ═══════════════════════════════════════════════════════════════════════════

  // Tracked objects (0 or more). Each object has UUID for joining with
  // external data sources (labels, classifications, etc.)
  repeated JonGuiDataTrackedObject tracked_objects = 80;

  // ═══════════════════════════════════════════════════════════════════════════
  // Trinity board tracking — the state-plane activity flag
  // ═══════════════════════════════════════════════════════════════════════════

  // Whether the Ring-Trinity board tracker is RUNNING. It follows the tracker's
  // actual run state, which cmd.CV.StartTrackTrinity and cmd.CV.StopTrackTrinity
  // are what change.
  //
  // WHAT IT IS FOR: the toggle affordance. A consumer of this state message can
  // enable, disable and reflect the trinity control from this field alone,
  // without decoding an opaque payload — the state plane does not parse
  // JonGUIState.opaque_payloads.
  //
  // THE POSE IS A DIFFERENT PLANE WITH A DIFFERENT CONSUMER, and this field does
  // not serve it. ser.TrinityTracking (opaque/trinity_tracking.proto) travels in
  // JonGUIState.opaque_payloads and is routed to the WASM OSD, which renders the
  // metric pose as an overlay. That consumer needs the pose, the per-axis sigmas,
  // the observability figures and the board identity; a bool would tell it
  // nothing. Neither field is a copy of the other, and neither suppresses the
  // other.
  //
  // IT COLLAPSES THE TRACKER'S STATES ON PURPOSE. LOCKED, SEARCHING, DEGRADED
  // and BOARD_MISMATCH are all `true` here, because the button asks only whether
  // tracking is RUNNING; TRINITY_TRACKING_STATUS_IDLE is `false`, as is the
  // tracker not being up at all. A consumer that must tell those apart — is
  // there a lock, is the pose valid, is this the board that was asked for —
  // reads TrinityTracking.status (ser.TrinityTrackingStatus) from the opaque
  // payload, which is the authoritative and richer value. This field cannot
  // answer that and must not be read as though it could.
  bool trinity_tracking_active = 90;

  // Whether a zoom-to-ROI manoeuvre is currently driving this channel.
  //
  // WHY THIS IS ON THE WIRE AT ALL. The manoeuvre's own state machine is
  // internal and stays internal — SLEWING vs ZOOMING vs settling is nobody
  // else's business, and an enum spelling those out would only invite a
  // progress display nobody asked for. What a client genuinely cannot
  // determine for itself is that the platform and lens are being driven by
  // something OTHER than an operator, because the manoeuvre runs on session 0
  // and looks exactly like a person turning the turret.
  //
  // The concrete consumer is the zoom palette. Its pending/revert model exists
  // for a ~200 ms command round trip, and its revert timeout is the same order
  // as the whole manoeuvre — so without this flag an operator who nudges the
  // slider mid-move watches their value held for two seconds while the picture
  // goes somewhere else, then snap back with no explanation. With it, the
  // palette suppresses the revert and treats a touch as "cancel and take over".
  //
  // ⚠ THERE IS DELIBERATELY NO REFUSAL REASON HERE, and this bus is the wrong
  // shape for one. A refusal answers ONE command from ONE client; this is an
  // unaddressed broadcast at ~30 Hz. A refusal field would be visible to every
  // other client with no way for any of them to tell whose it was, and two
  // commands inside one tick would race last-writer-wins. That is a per-client
  // response modelled as shared state, and no number of extra fields fixes it.
  //
  // Refusals belong where they can be attributed:
  //   - the CLIENT pre-flights everything it can already see (camera stopped,
  //     view-only mode, region too small or unreachable at the current FOV,
  //     platform moving or scanning, degenerate coordinates) and declines
  //     BEFORE sending — more precise, and faster than a round trip;
  //   - backend-only causes no client can evaluate are LOGGED, and the
  //     manoeuvre simply never starts.
  bool zoom_roi_active_day = 91;
  bool zoom_roi_active_heat = 92;

  // The display-stabilisation correction currently PUBLISHED for each
  // channel, in delivered-FX-raster pixels (day 1920x1080, heat 900x720).
  //
  // Sign convention: the value the pixel applier ADDS to image position —
  // a scene feature at raw pixel p renders at p + C. Consumers that
  // translate between display space and raw space therefore ADD C to
  // scene-locked overlay positions and SUBTRACT C from operator input
  // (taps, drags) before it becomes a command. The anchor is the LRF
  // crosshair (the digital-zoom centre), not the raster centre.
  //
  // ⚠ THIS IS THE SMOOTHER'S OUTPUT, NOT AN APPLIED-PIXELS RECEIPT. With
  // the FX bypass on, or an FX library lacking the warp, the display shows
  // RAW pixels while this field still carries the smoother's C — that gap
  // is a documented dev-mode constraint (the bypass is a debug surface),
  // and the pixels-truth readback is a separate concern. Absence means the
  // stabiliser is not publishing for that channel (disabled, or priming
  // after a reset): consumers treat absent as C = 0 for rendering and as
  // NOT-CORRECTED for input translation — an input path that requires C
  // and finds it absent while stabilisation is commanded on must refuse,
  // never guess.
  optional JonGuiDataStabCorrection stab_correction_day = 100;
  optional JonGuiDataStabCorrection stab_correction_heat = 101;
}

// One channel's display-stabilisation correction, in that channel's
// delivered-FX-raster pixels. See the field comments on
// JonGuiDataCV.stab_correction_day/_heat for the sign convention, the
// anchor, and the smoother-vs-applied caveat.
message JonGuiDataStabCorrection {
  float x_px = 1;
  float y_px = 2;
}
