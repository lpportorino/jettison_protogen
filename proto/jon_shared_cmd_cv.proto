syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/cmd/cv";

package cmd.CV;

import "jon_shared_data_types.proto";
import "opaque/trinity_tracking.proto";

message Root {
  oneof cmd {
    option (buf.validate.oneof).required = true;
    SetAutoFocus set_auto_focus = 1;
    StartTrackNDC start_track_ndc = 2;
    StopTrack stop_track = 3;
    VampireModeEnable vampire_mode_enable = 4;
    VampireModeDisable vampire_mode_disable = 5;
    StabilizationModeEnable stabilization_mode_enable = 6;
    StabilizationModeDisable stabilization_mode_disable = 7;
    DumpStart dump_start = 8;
    DumpStop dump_stop = 9;
    RecognitionModeEnable recognition_mode_enable = 10;
    RecognitionModeDisable recognition_mode_disable = 11;

    // Ring-Trinity golden fiducial board tracking
    StartTrackTrinity start_track_trinity = 12;
    StopTrackTrinity stop_track_trinity = 13;

    // The cv-dump PHOTO: one instant, every plane of BOTH channels' CUDA-IPC
    // rings, written as a cv_dump bundle (jon_cv_dump_archive.proto
    // ShotCapture). Consumed by eutropia, never forwarded to manifold;
    // progress + result ride JonGuiDataCV.shot_seq/shot_state/shot_id.
    DumpShot dump_shot = 14;

    // CV Bridge container control
    BridgeStart bridge_start = 20;
    BridgeStop bridge_stop = 21;
    BridgeRestart bridge_restart = 22;
  }
}

message VampireModeEnable {
}

message DumpStart {
}

message DumpStop {
}

// Empty on purpose: a shot is always BOTH channels (the artifact's value is
// that they are the same instant), every capture parameter already rides the
// ring's control block, and the operator note arrives later over
// PUT /note/{id} exactly as a dump's does.
message DumpShot {
}

message VampireModeDisable {
}

message StabilizationModeEnable {
}

message StabilizationModeDisable {
}

message RecognitionModeEnable {
}

message RecognitionModeDisable {
}

message SetAutoFocus {
  ser.JonGuiDataVideoChannel channel = 1 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
  bool value = 2;
}

message StartTrackNDC {
  ser.JonGuiDataVideoChannel channel = 1 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
  double x = 2 [(buf.validate.field).double = {
    gte: -1.0,
    lte: 1.0
  }];
  double y = 3 [(buf.validate.field).double = {
    gte: -1.0,
    lte: 1.0
  }];
  // TODO: Remove these fields after migration - now in Root message (fields 6-8)
  uint64 frame_time = 4;
  uint64 state_time = 5;  // System monotonic time from state when user performed action
}

message StopTrack {}

// Begin tracking the Ring-Trinity golden fiducial board.
//
// UNLIKE StartTrackNDC THERE IS NO SEED POINT, and that is the point of the board:
// it is self-locating from its own geometry, so the operator does not have to put a
// cursor on it. There is exactly ONE board in a run, so no identity is needed to
// disambiguate between targets.
message StartTrackTrinity {
  ser.JonGuiDataVideoChannel channel = 1 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];

  // Which board to expect. OPTIONAL: unset means "track whatever Ring-Trinity board
  // you find". When SET, the tracker reports TRINITY_TRACKING_STATUS_BOARD_MISMATCH
  // rather than silently producing a pose against different geometry — a pose
  // computed against the wrong board is wrong by a scale factor and looks entirely
  // plausible.
  ser.TrinityBoardVersion expect_board = 2;
}

// Stop tracking the Ring-Trinity board.
message StopTrackTrinity {}

// CV Bridge container control commands
message BridgeStart {
  // Starts the CV bridge container
}

message BridgeStop {
  bool force = 1;  // If true, SIGKILL instead of SIGTERM
}

message BridgeRestart {
  bool force = 1;  // If true, force stop before restart
}
