# Format + lint gate for HAND-AUTHORED Clojure and shell. The C lane is
# deliberately NOT here — see "WHERE IS THE C LANE?" below.
#
# This is the AUTHORITATIVE half of the gate. `.githooks/pre-push` is the fast
# local echo of it, but a client-side hook only protects whoever armed it and
# `--no-verify` bypasses it; protogen is pinned as a submodule by a consumer
# fleet, so what actually protects them is this job.
#
# WHAT IS GATED — a positive allowlist, never an ignore list: lint.mk hands each
# tool an explicit list of hand-authored paths and no tool ever walks the tree,
# so generated bindings (output/**), vendored LVGL, nanopb projections and
# generated fonts are excluded by never being passed in. One emitter projection
# under a gated `src` root IS linted, deliberately — lint.mk's header is the one
# home for which file and why, so it is not restated here.
#
# WHERE IS THE C LANE? In `renderer.yml`, as a step in the job that already
# builds the pinned toolchain image. clang-format REWRITES committed source, so
# its version is part of the toolchain pin — and the only pinned copy lives in
# the WASI-SDK the renderer is built with (/opt/wasi-sdk/bin/clang-format).
# Reproducing it here would mean either a ~15-minute image build to run a
# formatter, or an unpinned apt clang-format whose output differs from the one
# devs use — which manufactures the exact drift the gate exists to catch. The
# renderer workflow's path filter already fires on every renderer/** change, so
# no C edit can reach master without passing it.
name: Lint

on:
  push:
    branches: [main, master]
    paths:
    - "**/*.clj"
    - "**/*.cljc"
    - "**/*.edn"
    - "**/*.sh"
    # TWO HOLES THE EXTENSION GLOBS ABOVE LEAVE OPEN, closed by two entries:
    #   tools/scratchcard/bin/**  covers BOTH scratchcard (extensionless ON
    #                             PURPOSE, listed literally in LINT_SH_FILES)
    #                             and scratchcard.bb (the only tracked .bb, in
    #                             LINT_CLJ_FILES -> cljfmt + clj-kondo).
    #   **/*.awk                  covers tools/payload_apostrophes.awk, which is
    #                             not an input to a lane — it IS one, the half
    #                             `bash -n` structurally cannot see. It also
    #                             catches scripts/proto_cleanup.awk, which no
    #                             lane judges; harmless, and cheaper than a
    #                             single-file entry that would rot on a rename.
    # No `**/*.bb` entry: the only tracked .bb is under the bin/** prefix above,
    # so it would be a no-op today. Stated rather than added, because this file
    # deletes subsumed entries when it knows they are subsumed.
    - "**/*.awk"
    - "tools/scratchcard/bin/**"
    # THE OTHER THREE FILES `lint-sh` GREPS. Its bare-`git -C` clause scans
    # `$(LINT_SH_FILES) renderer/wasm.mk renderer.mk Makefile lint.mk`, and
    # `lint-sh` runs in THIS workflow only. `lint.mk` was already listed; these
    # three were not, so a bare `git -C` introduced into any of them started no
    # job that greps it and the drift landed on whoever next touched a `.sh`.
    # Same argument as `.clang-format` in renderer.yml: a gate's INPUT set is
    # part of its trigger, not just the files it is nominally "about".
    - "Makefile"
    - "renderer.mk"
    - "renderer/wasm.mk"
    - ".githooks/**"
    - ".clj-kondo/**"
    - ".cljfmt.edn"
    - "lint.mk"
    # The gate SOURCES and their config, not just the code they judge. A gate's
    # own source is one of its inputs: editing tools/lint/src/** or
    # tools/lint/ceilings.edn changes what this job MEANS, so a filter that fired
    # only on the judged files would let a gate be weakened by a commit this job
    # never saw. (The `**/*.clj` and `**/*.edn` entries above already cover both
    # today; this stays explicit so moving the gate out of those extensions
    # cannot silently un-arm the job.)
    - "tools/lint/**"
    # Every workflow, not just this one: the actionlint step below judges them
    # all, so a job that only fired on its own file could not see the breakage
    # it exists to catch. Subsumes the previous lint.yml-only entry.
    - ".github/workflows/**"
  pull_request:
    paths:
    - "**/*.clj"
    - "**/*.cljc"
    - "**/*.edn"
    - "**/*.sh"
    # TWO HOLES THE EXTENSION GLOBS ABOVE LEAVE OPEN, closed by two entries:
    #   tools/scratchcard/bin/**  covers BOTH scratchcard (extensionless ON
    #                             PURPOSE, listed literally in LINT_SH_FILES)
    #                             and scratchcard.bb (the only tracked .bb, in
    #                             LINT_CLJ_FILES -> cljfmt + clj-kondo).
    #   **/*.awk                  covers tools/payload_apostrophes.awk, which is
    #                             not an input to a lane — it IS one, the half
    #                             `bash -n` structurally cannot see. It also
    #                             catches scripts/proto_cleanup.awk, which no
    #                             lane judges; harmless, and cheaper than a
    #                             single-file entry that would rot on a rename.
    # No `**/*.bb` entry: the only tracked .bb is under the bin/** prefix above,
    # so it would be a no-op today. Stated rather than added, because this file
    # deletes subsumed entries when it knows they are subsumed.
    - "**/*.awk"
    - "tools/scratchcard/bin/**"
    # THE OTHER THREE FILES `lint-sh` GREPS. Its bare-`git -C` clause scans
    # `$(LINT_SH_FILES) renderer/wasm.mk renderer.mk Makefile lint.mk`, and
    # `lint-sh` runs in THIS workflow only. `lint.mk` was already listed; these
    # three were not, so a bare `git -C` introduced into any of them started no
    # job that greps it and the drift landed on whoever next touched a `.sh`.
    # Same argument as `.clang-format` in renderer.yml: a gate's INPUT set is
    # part of its trigger, not just the files it is nominally "about".
    - "Makefile"
    - "renderer.mk"
    - "renderer/wasm.mk"
    - ".githooks/**"
    - ".clj-kondo/**"
    - ".cljfmt.edn"
    - "lint.mk"
    # The gate SOURCES and their config, not just the code they judge. A gate's
    # own source is one of its inputs: editing tools/lint/src/** or
    # tools/lint/ceilings.edn changes what this job MEANS, so a filter that fired
    # only on the judged files would let a gate be weakened by a commit this job
    # never saw. (The `**/*.clj` and `**/*.edn` entries above already cover both
    # today; this stays explicit so moving the gate out of those extensions
    # cannot silently un-arm the job.)
    - "tools/lint/**"
    # Every workflow, not just this one: the actionlint step below judges them
    # all, so a job that only fired on its own file could not see the breakage
    # it exists to catch. Subsumes the previous lint.yml-only entry.
    - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clj:
    name: bash -n + cljfmt + clj-kondo (hand-authored Clojure + shell)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - # FIRST, and before any toolchain setup: it needs nothing but the bash
      # already on the runner, and it is the gate with the best track record.
      # generate-protos.sh builds its work as SINGLE-QUOTED `bash -c` payloads,
      # where one bare apostrophe in a comment terminates the payload and the
      # rest executes as shell — a typo that broke binding generation for four
      # consecutive runs, and was reintroduced the same day in the same file.
      #
      # TWO checks, because `bash -n` alone is NOT sufficient and this comment
      # used to claim it was. An ODD apostrophe count breaks the parse and
      # `bash -n` catches it; an EVEN count REBALANCES the quoting, so the parse
      # stays valid while the payload silently becomes EMPTY and every language
      # leg dies at runtime. That is how the bug landed a third time. The second
      # check (tools/payload_apostrophes.awk) is what covers the even case.
      #
      # The path filter above includes **/*.sh precisely so THIS job fires on
      # the commit that would break it.
      name: shell parse + payload-apostrophe check
      run: make -f lint.mk lint-sh

    - # actionlint is a single static binary, so it installs in one step and
      # needs no toolchain — which is why this sits ahead of the JDK setup
      # below rather than after it.
      #
      # Pinned, like every other tool this workflow installs. Bumping it is a
      # deliberate edit, not a floating `latest` that changes what the gate
      # means between two runs of the same commit.
      name: Install actionlint
      run: |
        curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_amd64.tar.gz \
          | sudo tar -xz -C /usr/local/bin actionlint

    - # WORKFLOW SYNTAX, not shell style — lint.mk's lint-ci runs actionlint with
      # its embedded shellcheck disabled, and the recipe's comment carries why.
      #
      # The path filter above names .github/workflows/** so THIS job fires on the
      # commit that would break a workflow. Without that, the one class of file
      # whose breakage is invisible would be the one class this job could not see.
      name: actionlint (workflow syntax + expressions)
      run: make -f lint.mk lint-ci

    - # One setup-clojure invocation covers both tools. clj-kondo is a native
      # binary and needs no JVM, but cljfmt runs through the Clojure CLI, so
      # this job DOES need Java. Linting is this workflow's alone — no other
      # workflow runs clj-kondo, which is what keeps one config and one pin.
      name: Set up JDK 25 (LTS)
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "25"

    - name: Set up Clojure CLI + clj-kondo
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        # Both pins are the ones devcards.yml already uses, deliberately: two
        # different toolchain versions gating the same tree would disagree
        # eventually, and these are known-good on a runner rather than merely
        # plausible. The first draft of this file invented "1.12.5.1590" — it
        # does not exist (brew-install has no such tag) and the job died at
        # setup, before a single gate ran. Verify a pin against
        # https://github.com/clojure/brew-install/releases before changing it.
        cli: "1.12.5.1654"
        clj-kondo: "2026.05.25"

    - # cljfmt resolves from the ROOT deps.edn (:fmt alias). Cache on its hash
      # so a warm run skips the Maven fetch entirely.
      name: Cache Maven-resolved deps
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: lint-m2-${{ hashFiles('deps.edn') }}
        restore-keys: lint-m2-

    - # Check mode, never fix mode: CI states whether the tree is canonical, it
      # does not silently rewrite it. Fixing is the author's job (the pre-push
      # hook applies the formatters locally and blocks so the result gets
      # committed) — a CI-side rewrite would either be lost or need a bot push
      # back to a trunk that a consumer fleet pins.
      name: cljfmt (check)
      run: make -f lint.mk fmt-clj

    - # --fail-level warning: a warning must fail exactly like an error, or the
      # zero-warning floor in .clj-kondo/config.edn means nothing.
      # --cache false: the gate must be deterministic; a shared analysis-shaped
      # cache entry makes the next lint emit phantom unresolved-symbol findings.
      name: clj-kondo
      run: make -f lint.mk lint-clj

    - # STRUCTURAL checks over the same corpus, from the same clj-kondo the step
      # above installed — it reads `--analysis` output rather than parsing source,
      # so it needs no extra tool and no JVM. The canaries run FIRST, and that
      # ordering is load-bearing rather than tidy: the gate has clauses that can
      # each refuse the same input, so a red from it does not on its own say WHICH
      # clause fired. The suite settles that by mutation (silence one clause,
      # require green; then require a neighbouring clause still red on that same
      # mutant), and running it here means CI re-earns the proof on every push
      # instead of trusting the day it was written.
      name: clj-gate canaries (mutation-proven clause attribution)
      run: make -f lint.mk lint-clj-gate-test

    - name: namespace-size ceiling
      run: make -f lint.mk lint-ns-size

    - # A DECLARED-SCOPE check: every defn in an ENROLLED NAMESPACE carries an
      # `m/=>`. Wired here as well as in the pre-push `lint` aggregate because
      # `.claude/rules/gate-enforcement.md` §6 makes the two enforcement points
      # complements rather than alternatives — the hook only protects whoever
      # armed it, CI protects the consumer fleet regardless.
      #
      # THE PATH FILTER ABOVE ALREADY COVERS IT, and that is worth stating rather
      # than assuming: this check's inputs are every `**/*.clj` under
      # LINT_CLJ_PATHS plus `tools/lint/**` (its own source and its enrolment),
      # and both are named in the trigger. A check whose filter excluded the files
      # that can break it would be green for a structural reason.
      name: spec presence (enrolled namespaces)
      run: make -f lint.mk lint-spec-presence
