syntax = "proto3";
package ui;

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/ui";

// ── Layer-3 concrete control nodes ───────────────────────────────────
//
// An L3 node is a self-describing METADATA record: it declares which proto
// STATE field it displays and which proto COMMAND it sends, plus the widget
// composition + the float↔int fixed-point scale that the bindings straddle.
// It is NEVER sent to the firmware WASM renderer — the renderer only ever
// consumes a Layer-1 `ui.Screen` (controls_load_ui). The L3→L2→L1 lowering
// (pure prost→prost in jettison_view/src/ui_nodes/) reads an L3 node and
// EMITS the Screen. So this proto is host-only / prost-only: no nanopb (C)
// path, hence no sibling ui_nodes.options.
//
// These are the per-KIND shapes the Phase-2 `protodoc.nodes` generator emits;
// each node is a generated INSTANCE (data) of its kind. `SliderControl` is the
// first kind, with the day-camera CLAHE node as its proven first instance.

// Node-schema version constant. The lowering entry-point checks the wire
// `version` field against the CURRENT value FIRST and returns
// Err(SchemaMismatch) on any mismatch — fail-fast, no migration branch, no
// version-sniffing. protogen + bindings + lowering regenerate in lockstep,
// so a mismatch can only mean a stale fixture (a bug). Start at 1 (0 is the
// proto3 default / "unset", deliberately invalid so an un-versioned node is
// rejected by the {gte: 1} guard on the field).
enum NodeSchemaVersion {
  NODE_SCHEMA_VERSION_UNSPECIFIED = 0;
  NODE_SCHEMA_VERSION_V1 = 1;
}

// How a normalized control value crosses the int-only WASM ABI. The camera
// state/command fields are `double` ∈ [0,1] (e.g. camera_day.clahe_level),
// but subjects + host_send_command carry only i32. `scale` is the per-mille
// multiplier that lives WITH the binding (not a magic constant in Rust):
//   state→subject:   (value * scale).round() as i32
//   event→command:   int_value as f64 / scale
// scale = 1000 for a [0,1] double; scale = 1 for an already-integer field.
message FixedPointScale {
  // Per-mille (or per-unit) multiplier. Must be > 0; the projector/builder
  // divide by it, so 0 is a divide-by-zero author error.
  uint32 scale = 1 [(buf.validate.field).uint32 = {gte: 1}];
}

// The proto STATE this node displays. The lowering resolves
// `state_field_path` against the prost `ser::` types at test time (Class-c2)
// and the projector reads that field from JonGuiState into `subject_name`.
message StateBinding {
  // Dotted JonGuiState field path, e.g. "camera_day.clahe_level". Resolves
  // structurally against the `ser` tree (state-projector input).
  string state_field_path = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 127
  }];
  // The reactive subject this state feeds, e.g. "day_clahe". Bound into the
  // lowered Screen's SubjectDeclaration + the widget's `bindings` map.
  string subject_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
  // Fixed-point convention for state→subject projection (absent ⇒ scale 1).
  FixedPointScale scale = 3;
}

// The proto COMMAND this node sends. `command_id` IS the EventBinding.name
// the lowered Screen emits and the command-builder maps to a cmd.Root oneof
// leaf (verified against the `cmd::` tree, Class-c2 / R4 oracle).
message CommandBinding {
  // Command identifier = EventBinding.name, e.g. "day.clahe.set". Resolves
  // to a concrete cmd.Root variant (command-builder input).
  string command_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
  // Fixed-point convention for event→command projection (absent ⇒ scale 1).
  FixedPointScale scale = 2;
}

// L3 SliderControl kind — a labelled card holding a slider that DISPLAYS a
// normalized state field and SENDS a set-value command. The day-camera CLAHE
// node (camera_day.clahe_level ↔ SetClaheLevel, scale 1000) is the proven first
// instance; every single-state-single-command slider node is generated data of
// this shape.
message SliderControl {
  // Schema version — checked FIRST by the lowering (fail-fast guard). A node
  // whose version != the current NodeSchemaVersion is rejected with
  // Err(SchemaMismatch); {gte: 1} rejects the unset/0 default.
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];

  // Card title shown above the slider (lowered to a Label atom).
  string title = 2 [(buf.validate.field).string = {max_len: 63}];

  // State display binding: the bound state field → subject, with the per-mille
  // fixed-point scale (double[0,1] → int).
  StateBinding state = 3;

  // Command binding: slider value-changed → the set-value command, with the
  // per-mille fixed-point scale (int → double[0,1]).
  CommandBinding command = 4;

  // Slider integer range AFTER scaling (e.g. 0..1000 for a [0,1] double at
  // scale 1000). These become the lowered SliderProps.min_value/max_value.
  int32 min_value = 5;
  int32 max_value = 6 [(buf.validate.field).int32 = {gt: 0}];
}

// L3 ActionButton kind — a labelled button that SENDS a parameterless command
// (Start / Stop / Photo / HaltAll / …). No state display and no fixed-point
// scale: a click maps straight to a 0-field cmd leaf. The generator derives one
// per `:ui-pattern :action-button` command (110 of them); the lowering emits a
// card with a label + a button whose click-event carries the command id.
message ActionButton {
  // Schema version — checked FIRST by the lowering (fail-fast guard), same
  // contract as SliderControl. {gte: 1} rejects the unset/0 default.
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];

  // Button label (lowered to a Label atom above the button).
  string title = 2 [(buf.validate.field).string = {max_len: 63}];

  // Command binding: button click → the parameterless command. Only
  // `command_id` is used (the `scale` carries no meaning for a value-less
  // command); the lowered button event sets include_widget_value = false.
  CommandBinding command = 3;
}

// L3 ToggleControl kind — a switch that flips between two parameterless commands:
// ON → command_on, OFF → command_off (e.g. RecognitionModeEnable /
// RecognitionModeDisable). The generator pairs `:ui-pattern :toggle`
// enable/disable command siblings; the lowering emits a WIDGET_SWITCH whose
// value-changed event routes through the command id, and the builder picks
// command_on / command_off by the new boolean.
message ToggleControl {
  // Schema version — checked FIRST by the lowering (fail-fast guard).
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];

  // Switch label.
  string title = 2 [(buf.validate.field).string = {max_len: 63}];

  // Command sent when the switch turns ON (the paired Enable command).
  CommandBinding command_on = 3;

  // Command sent when the switch turns OFF (the paired Disable command).
  CommandBinding command_off = 4;

  // Optional state display binding: the bool state field the switch reflects.
  // Absent for a write-only toggle; present binds the switch to a SubjectInt
  // (0/1). (Generator emits this once bool-state derivation lands; the lowering
  // already handles both.)
  StateBinding state = 5;
}

// One selectable option of an EnumPicker: the display label + the enum number it
// maps to. The dropdown's selected INDEX → `value` (an explicit map, since proto
// enums need not be 0-contiguous).
message EnumOption {
  string label = 1 [(buf.validate.field).string = {max_len: 63}];
  int32 value = 2;
}

// L3 EnumPicker kind — a dropdown that SENDS a set-enum command (e.g. SetFxMode,
// SetScanMode). The generator derives one per single-`:enum`-field
// `:ui-pattern :enum-picker` command; the options come from the enum's values
// (prefix-stripped labels + their numbers). The lowering emits a WIDGET_DROPDOWN;
// the builder maps the selected index → `options[idx].value` → the set-enum cmd.
message EnumPicker {
  // Schema version — checked FIRST by the lowering (fail-fast guard).
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];

  // Dropdown label.
  string title = 2 [(buf.validate.field).string = {max_len: 63}];

  // The set-enum command; the lowered dropdown's value-changed event routes
  // through `command_id` and the builder fills the enum field.
  CommandBinding command = 3;

  // Selectable options (label + enum number), in dropdown order.
  repeated EnumOption options = 4;
}

// L3 StepperControl kind — a pair of −/+ buttons that send two parameterless
// commands: + → command_increment, − → command_decrement (e.g. FocusStepPlus /
// FocusStepMinus). The generator pairs `:ui-pattern :stepper` Plus/Minus (or
// Increase/Decrease) command siblings; the lowering emits two buttons whose
// click events route through each command id. (Shift-by-delta steppers — a
// single int32/double command sent with ±step — are a deferred variant.)
message StepperControl {
  // Schema version — checked FIRST by the lowering (fail-fast guard).
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];

  // Stepper label.
  string title = 2 [(buf.validate.field).string = {max_len: 63}];

  // Command sent by the + button (the paired Plus/Increase command).
  CommandBinding command_increment = 3;

  // Command sent by the − button (the paired Minus/Decrease command).
  CommandBinding command_decrement = 4;
}

// L3 ShiftStepper kind — a pair of −/+ buttons that send ONE single-`int32`-field
// command with a ∓/±`step` delta (e.g. SetZoomTableValue shifted by ±step). The
// generator derives one per single-int32-field `:ui-pattern :stepper` command;
// the lowering emits two buttons whose click events carry `int_value = ∓/±step`,
// and the builder fills the int field via `build_set_int_command`. (Distinct from
// `StepperControl`, whose two buttons send two PARAMETERLESS commands.)
message ShiftStepper {
  // Schema version — checked FIRST by the lowering (fail-fast guard).
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];

  // Stepper label.
  string title = 2 [(buf.validate.field).string = {max_len: 63}];

  // The single-int32-field command both buttons send (with ±step).
  CommandBinding command = 3;

  // The ± delta a button click applies (carried as the event `int_value`).
  int32 step = 4 [(buf.validate.field).int32 = {gt: 0}];
}

// L3 BoolToggle kind — a switch that SETS a single-`bool`-field command to its
// on/off value (e.g. SetX{value: bool}). The generator derives one per
// single-bool-field `:ui-pattern :toggle` command; the lowering emits a
// WIDGET_SWITCH whose value-changed event carries the switch bool, and the
// builder fills the bool field via `build_set_bool_command`. (Distinct from
// `ToggleControl`, which fires two PARAMETERLESS enable/disable commands.)
message BoolToggle {
  // Schema version — checked FIRST by the lowering (fail-fast guard).
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];

  // Switch label.
  string title = 2 [(buf.validate.field).string = {max_len: 63}];

  // The single-bool-field command the switch sets (true on, false off).
  CommandBinding command = 3;
}
