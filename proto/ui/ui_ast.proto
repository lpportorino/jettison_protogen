// -- Style system --

// A group of style variants for one LVGL state selector.
// state_selector encodes LV_PART_MAIN (0x0), LV_PART_MAIN | LV_STATE_PRESSED (0x20), etc.
message StyleGroup {
  uint32 state_selector = 1;
  // exactly 8 entries (composite indices 0-7)
  repeated ResolvedStyle variants = 2
      [(buf.validate.field).repeated = {min_items: 8, max_items: 8}];
}

// A fully-resolved style: all token refs are resolved to concrete LVGL values.
message ResolvedStyle {
  repeated StyleProperty properties = 1;
}

// A single LVGL style property with its resolved value.
message StyleProperty {
  StylePropertyType type = 1 [(buf.validate.field).enum = {defined_only: true}];
  oneof value {
    uint32 uint_value = 2;       // pixels, opacity, enum values
    int32 int_value = 3;         // signed values (width, height, padding, coords)
    Color color_value = 4;       // resolved RGB
    // font C symbol name, image source path
    string string_value = 5 [(buf.validate.field).string = {max_len: 63}];
    ShadowBundle shadow_value = 6;
  }
}

enum StylePropertyType {
  // Existing 0-15 (backward-compatible wire format)
  PROP_BG_COLOR = 0;
  PROP_BG_OPA = 1;
  PROP_TEXT_COLOR = 2;
  PROP_TEXT_FONT = 3;
  PROP_BORDER_COLOR = 4;
  PROP_BORDER_WIDTH = 5;
  PROP_RADIUS = 6;
  PROP_PAD_ALL = 7;
  PROP_PAD_GAP = 8;
  PROP_WIDTH = 9;
  PROP_HEIGHT = 10;
  PROP_SHADOW = 11;
  PROP_PAD_HOR = 12;
  PROP_PAD_VER = 13;
  PROP_MARGIN_ALL = 14;
  PROP_BORDER_OPA = 15;

  // Size (16-20)
  PROP_MIN_WIDTH = 16;
  PROP_MAX_WIDTH = 17;
  PROP_MIN_HEIGHT = 18;
  PROP_MAX_HEIGHT = 19;
  PROP_LENGTH = 20;

  // Position (21-23)
  PROP_X = 21;
  PROP_Y = 22;
  PROP_ALIGN = 23;

  // Transform (24-34)
  PROP_TRANSFORM_WIDTH = 24;
  PROP_TRANSFORM_HEIGHT = 25;
  PROP_TRANSLATE_X = 26;
  PROP_TRANSLATE_Y = 27;
  PROP_SCALE_X = 28;
  PROP_SCALE_Y = 29;
  PROP_ROTATION = 30;
  PROP_PIVOT_X = 31;
  PROP_PIVOT_Y = 32;
  PROP_SKEW_X = 33;
  PROP_SKEW_Y = 34;

  // Padding individual (35-40)
  PROP_PAD_TOP = 35;
  PROP_PAD_BOTTOM = 36;
  PROP_PAD_LEFT = 37;
  PROP_PAD_RIGHT = 38;
  PROP_PAD_ROW = 39;
  PROP_PAD_COLUMN = 40;

  // Margin individual (41-44)
  PROP_MARGIN_TOP = 41;
  PROP_MARGIN_BOTTOM = 42;
  PROP_MARGIN_LEFT = 43;
  PROP_MARGIN_RIGHT = 44;

  // Background extended (45-55)
  PROP_BG_GRAD_COLOR = 45;
  PROP_BG_GRAD_DIR = 46;
  PROP_BG_MAIN_STOP = 47;
  PROP_BG_GRAD_STOP = 48;
  PROP_BG_MAIN_OPA = 49;
  PROP_BG_GRAD_OPA = 50;
  PROP_BG_IMAGE_SRC = 51;
  PROP_BG_IMAGE_OPA = 52;
  PROP_BG_IMAGE_RECOLOR = 53;
  PROP_BG_IMAGE_RECOLOR_OPA = 54;
  PROP_BG_IMAGE_TILED = 55;

  // Border extended (56-57)
