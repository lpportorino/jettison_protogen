  BLEND_MODE_MULTIPLY = 3;
}

enum BaseDir {
  BASE_DIR_LTR = 0;
  BASE_DIR_RTL = 1;
  BASE_DIR_AUTO = 2;
}

enum GradDir {
  GRAD_DIR_NONE = 0;
  GRAD_DIR_VER = 1;
  GRAD_DIR_HOR = 2;
  GRAD_DIR_LINEAR = 3;
  GRAD_DIR_RADIAL = 4;
  GRAD_DIR_CONICAL = 5;
}

enum Dir {
  DIR_NONE = 0;
  DIR_LEFT = 1;
  DIR_RIGHT = 2;
  DIR_HOR = 3;
  DIR_TOP = 4;
  DIR_BOTTOM = 8;
  DIR_VER = 12;
  DIR_ALL = 15;
