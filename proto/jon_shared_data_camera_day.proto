syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/data/camera_day";

package ser;

import "jon_shared_data_types.proto";

message JonGuiDataCameraDay {
  double focus_pos = 1 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];
  double zoom_pos = 2 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];
  double iris_pos = 3 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];
  bool infrared_filter = 4;
  int32 zoom_table_pos = 5 [(buf.validate.field).int32 = {
    gte: 0
  }];
  int32 zoom_table_pos_max = 6 [(buf.validate.field).int32 = {
    gte: 0
  }];
  JonGuiDataFxModeDay fx_mode = 7 [(buf.validate.field).enum = {
    defined_only: true
  }];
  bool auto_focus = 8;
  bool auto_iris = 9;
  bool auto_gain = 15;
  double digital_zoom_level = 10 [(buf.validate.field).double = {
    gte: 1.0
  }];
  double clahe_level = 11 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];
  double horizontal_fov_degrees = 12 [(buf.validate.field).double = {
    gte: 0.0,
    lt: 360.0
  }];
  double vertical_fov_degrees = 13 [(buf.validate.field).double = {
    gte: 0.0,
    lt: 360.0
  }];
  bool is_started = 14;
  JonGuiDataMeteo meteo = 16;

  // Sensor parameters (normalized 0.0-1.0, set by camera or CV)
  optional double sensor_gain = 17 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];
  optional double exposure = 18 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];

  // CLOCK_MONOTONIC timestamp (microseconds) when state was last pushed to SHM
  uint64 capture_monotonic_us = 19;

  // Measured video rates for this channel, in frames per second. Absent until
  // the producer has two samples to difference; zero when present means
  // nothing is arriving, which is a measurement rather than an absence.
  // delivered_fps counts frames handed on, content_fps only frames whose
  // content changed. Every other frame rate on this system reports the former.
  optional double delivered_fps = 20 [(buf.validate.field).double.gte = 0.0];
  optional double content_fps = 21 [(buf.validate.field).double.gte = 0.0];
}
