# protogen Actions workflow — the devcard corpus + gallery contract.
# Separate from
# build-and-release.yml on purpose: that workflow's trigger paths (proto/**,
# Dockerfile*, generate-*.sh, scripts/**) are the binding-generation contract;
# this one is the devcard corpus + gallery contract. They share nothing but a
# repo and should not share a run, a runner, or a failure mode.
#
# ── Design decisions worth flagging to the operator (not silently assumed) ──
#
# 1. RUNNER: ubuntu-latest (GH-hosted, x86_64), NOT build-and-release.yml's
#    ubuntu-22.04-arm. That ARM runner exists to match the Jetson BSP for the
#    native-toolchain generation job; the devcard runner is pure JVM+GraalWasm
#    with no Jetson dependency, so it gets the free, fast, standard runner.
#
# 2. JAVA PROVISIONING: this draft uses `graalvm/setup-graalvm@v1`
#    (distribution: graalvm-community, java-version: '25') directly on the
#    runner, NOT a `container:` built from protogen's own Dockerfile.base —
#    a reasoned divergence from container parity. Reason, verified
#    first-hand by a provisioning bench at drafting time:
#      - build-and-release.yml's OWN base-image build
#        (`docker build -t jettison-proto-generator-base:latest -f
#        Dockerfile.base .`) has NO layer cache and NO registry cache wired —
#        every run rebuilds protoc+go+rust+zig+node+nanopb from scratch. That
#        cost is fine to pay once per proto push; it is a bad tax to add to
#        EVERY devcards push (tools/devcards/**, output/manifests/**, the
#        vendored wasm/assets, proto/ui/**), most of which touch nothing the
#        big toolchain image provides.
#      - The devcard runner's only real dependency is a JDK with JVMCI
#        (org.graalvm.polyglot / org.graalvm.wasm as plain Maven deps — no
#        native `gu install` component, confirmed at spike). setup-graalvm
#        is the maintained, cached, purpose-built way to get exactly that on a
#        stock runner in ~10s from its own tool-cache, vs. minutes rebuilding
#        an unrelated 12-toolchain image.
#    If the operator wants literal container parity with the rest of
#    protogen's CI instead, the alternative is: push Dockerfile.base to GHCR
#    from build-and-release.yml (it doesn't today), then `container: image:
#    ghcr.io/.../jettison-proto-generator-base:latest` here — that is real,
#    not-yet-designed extra work, not a drop-in swap, so it is named rather
#    than silently assumed away.
#
# 3. GATE SHAPE: the ratified design lists four job concerns — "build corpus,
#    verify goldens+invariants, secret-scan, kondo" — and separately a "Gate
#    assembly (one entry point CI will call)" bundling schema + invariants +
#    vanilla-equality + golden-verify + enum-coverage + secret-scan into ONE
#    command. Both are honored by splitting into exactly two jobs: `devcards`
#    (build the corpus, then call that one bundled gate entry point — so
#    build+verify+invariants+secret-scan share one job and one clear PASS/FAIL)
#    and — historically — `kondo`, a minimal clj floor over tools/devcards.
#    That kondo job has since been REMOVED from this file: `lint.yml` now runs
#    clj-kondo over every hand-authored Clojure path in lint.mk's
#    LINT_CLJ_PATHS — tools/devcards included — against the same
#    .clj-kondo/config.edn and the same pinned version. That variable is the
#    one home of what is gated; a count here would go short the next time a
#    root is added. Keeping a strict subset of that here bought nothing and cost the
#    usual price of duplicated gates — two jobs over one tree drift apart, and
#    the narrower one silently defines a weaker floor than the config implies.
#    The design's "kondo" concern is still honored, just by the workflow that
#    owns linting. The charter's antagonistic review remains the MAIN gate;
#    both are a floor under it, not a replacement for it.
#
# 4. CACHING: `actions/cache` keyed on tools/devcards/deps.edn's hash, over
#    both `~/.m2` (Maven-resolved deps: clojure, polyglot, wasm, protobuf-java)
#    and `~/.gitlibs` (tools.deps git deps, if any land later). NOT
#    setup-graalvm's own `cache: maven` mode — that mode keys on a `pom.xml`
#    checksum, which this repo will never have (tools.deps, not Maven proper).
name: Devcards Corpus + Gallery

on:
  push:
    branches: [main, master]
    paths:
    - "tools/devcards/**"
    - "output/manifests/**"
    - "proto/ui/**"
    - "renderer.mk"
    # Inputs of the GENERATED VLM briefing (the "UI-standard briefing
    # freshness" step below). The contract doc matched no workflow at all,
    # and the generated page itself none either, so the gate could never
    # fire on a push that changed what it checks.
    - "docs/UI-QUALITY-CONTRACTS.md"
    - ".claude/skills/ui-standard-review/**"
    - ".github/workflows/devcards.yml"
    - ".github/actions/build-controls-wasm/**"
  pull_request:
    paths:
    - "tools/devcards/**"
    - "output/manifests/**"
    - "proto/ui/**"
    - "renderer.mk"
    # Inputs of the GENERATED VLM briefing (the "UI-standard briefing
    # freshness" step below). The contract doc matched no workflow at all,
    # and the generated page itself none either, so the gate could never
    # fire on a push that changed what it checks.
    - "docs/UI-QUALITY-CONTRACTS.md"
    - ".claude/skills/ui-standard-review/**"
    - ".github/workflows/devcards.yml"
    - ".github/actions/build-controls-wasm/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: devcards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcards:
    name: build corpus + verify goldens/invariants/secret-scan + interaction
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - # B3: build controls.wasm FROM SOURCE (pinned WASI-SDK). This job used to
      # depend on a committed wasm blob; that blob is retired (B2), so the wasm
      # is now a function of the checkout — the composite action installs the ONE
      # toolchain the renderer needs (the WASI-SDK, version single-sourced from
      # Dockerfile.base) and builds it. This ANSWERS the former open
      # provisioning question: build, don't vendor.
      name: Build controls.wasm from source
      uses: ./.github/actions/build-controls-wasm
    - name: Set up GraalVM CE for JDK 25 (LTS)
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: "25"
        distribution: "graalvm-community"
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Clojure CLI
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        # Verified against https://github.com/clojure/brew-install/releases
        # — pin, don't float; bump deliberately alongside
        # tools/devcards/deps.edn.
        cli: "1.12.5.1654"
    - name: Cache Maven-resolved deps (tools.deps ~/.m2, not Maven's own cache mode — no pom.xml here)
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: devcards-m2-${{ hashFiles('tools/devcards/deps.edn') }}
        restore-keys: |
          devcards-m2-
    - # interaction-prebuilt (armed below) builds the wasmtime harness with
      # cargo. Same key SHAPE and same paths as renderer.yml's fixtures job so
      # the two jobs share one cache namespace rather than each paying a cold
      # Rust build; this runner is the plain one, so CARGO_HOME is ~/.cargo.
      name: Cache cargo registry + interaction-harness target
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          renderer/wasm_harness/target
        key: fixtures-cargo-${{ hashFiles('renderer/wasm_harness/Cargo.lock', 'renderer/wasm_harness/Cargo.toml') }}
        restore-keys: |
          fixtures-cargo-
    - # The pure-helper unit suite (dump-tree reductions, image math): needs
      # only the Clojure CLI set up above — no wasm, no bindings — so it runs
      # BEFORE the corpus gate and fails cheap, mirroring devcards-test's
      # early slot in check-renderer (CI ≡ local).
      name: Devcards unit suite (pure helpers — cheap, fails before the corpus)
      run: make -f renderer.mk devcards-test
    - # B3b: compile the ui bindings via the ONE script (compile-bindings.sh,
      # invoked by renderer.mk's `bindings` prereq) — never a second inline
      # javac. The inline form had no -sourcepath (UiNodes.java references
      # cmd.Root) and no rm -rf (an orphan .class survived a rename); the script
      # is the one home. fixtures-prebuilt + gallery-prebuilt share the `bindings`
      # prereq, so one make invocation compiles them exactly once.
      #
      # fixtures-prebuilt runs devcards.core's `generate` — the ONE bundled gate:
      # schema-validate + per-card invariants (defect flags / zero-area /
      # zero-visible-area) + vanilla≡stock family-1-vs-2 equality + golden raw-FB
      # sha256 verify + enum-derived WidgetType coverage + the corpus secret-scan.
      # gallery-prebuilt regenerates the JPEG gallery + doc pages. A single red
      # names its exact failing card/check; there is no partial-credit path. Both
      # consume the wasm the composite action built above (wasm-present guards it).
      #
      # interaction-prebuilt (the wasmtime mirror of the GraalWasm interaction
      # lane) is armed HERE as well as in renderer.yml, and the reason is the
      # one renderer.yml documents for ITSELF: a gate has to run on the pushes
      # that can break it. That suite's inputs are the composition cards, the
      # framebuffer dumps and the geometry declaration the devcards runner
      # writes — every one of them a product of tools/devcards/**, which
      # matches THIS workflow's paths and NOT renderer.yml's. Until now a
      # corpus edit could take the cross-engine framebuffer comparison or a
      # pointer identity red and ship green, detonating on a later, unrelated
      # renderer/** push whose author had no part in causing it. Same
      # pathology, same fix, one workflow over.
      #
      # It rides in THIS invocation rather than a step of its own because it
      # takes fixtures-prebuilt as a declared prerequisite: a second `make`
      # naming that phony target would re-render the whole corpus again. One
      # invocation, one render, and make (not step adjacency) orders the suite
      # after the cards.
      name: Corpus gate + gallery + interaction (renderer.mk *-prebuilt)
      run: make -f renderer.mk fixtures-prebuilt gallery-prebuilt interaction-prebuilt
    - # B3a: a devcards-path change that shifts pixels re-mints the goldens AND
      # the gallery/doc pages inside the runner; without this assertion it would
      # exit green (the pass value == the nothing-ran value, fail-fast.md). The
      # goldens pin per-card raw-FB sha256; the contact sheets are renders of the
      # same corpus — a dirty goldens/ or docs/ means the push forgot them.
      # renderer.yml's fixtures job already had this assertion; devcards.yml did
      # NOT — that gap is what B3a closes.
      name: Golden manifest + gallery freshness
      run: git diff --exit-code tools/devcards/goldens tools/devcards/docs
    - # The VLM review reads a GENERATED briefing
      # (.claude/skills/ui-standard-review/STANDARD.md); a standard change that
      # never reached the page leaves the agent judging against rules that
      # moved. Armed HERE, not in renderer.yml, because a gate has to run on
      # the pushes that can break it: the generator's declared inputs are
      # docs/UI-QUALITY-CONTRACTS.md, devcards/lvgl_classes.clj and each
      # producer's :thresholds, and renderer.yml's path filter matches NONE of
      # them — it could only ever fire on pushes that structurally cannot
      # drift the briefing. This workflow already triggers on
      # tools/devcards/**, and its `on:` now also carries the contract doc and
      # the generated page itself.
      #
      # A runner step rather than a check-renderer lane because it shells out
      # to git, which cannot resolve the checkout from inside the toolchain
      # container — the same reason the goldens freshness check above is a
      # runner step.
      name: UI-standard briefing freshness
      run: make -f renderer.mk standard-brief
    - name: Upload gallery + golden manifest (debug artifact, not published)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: devcards-gate-output
        path: |
          tools/devcards/out/**
        retention-days: 7
        if-no-files-found: warn
  