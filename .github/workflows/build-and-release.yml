    # Commit updated outputs to main repository
    - name: Commit consolidated outputs
      # `id` + the `moved` output below are what the release step reads. Every
      # other writer in this job already asks "did my payload actually change?"
      # before committing; the release step could not ask, because nothing
      # published the answer.
      id: consolidated
      run: |
        # Setup SSH key for pushing to main repo
        if [ -n "${{ secrets.SELF_PUSH }}" ]; then
          mkdir -p ~/.ssh
          echo "${{ secrets.SELF_PUSH }}" > ~/.ssh/id_ed25519_self
          chmod 600 ~/.ssh/id_ed25519_self
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git to use the SSH key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_self"

          # Set remote to use SSH
          git remote set-url origin git@github.com:lpportorino/jettison_protogen.git
        fi

        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

        git add output/
        # Recorded on both branches, unconditionally: a step output that is only
        # written on the interesting path is indistinguishable, downstream, from
        # a step that never ran.
        if git diff --staged --quiet; then
          echo "moved=false" >>"$GITHUB_OUTPUT"
        else
          echo "moved=true" >>"$GITHUB_OUTPUT"
        fi
        git diff --staged --quiet || {
          git commit -m "Update generated proto bindings

        Languages updated:
        - C (nanopb)
        - C++ (with buf.validate)
        - Go (with buf.validate)
        - Kotlin (with buf.validate)
        - Python
        - TypeScript
        - TypeScript-validated (with protovalidate-es)
        - Rust
        - Zig
        - Java (with buf.validate)
        - JSON Descriptors

        Commit: ${{ github.sha }}"

          if [ -n "${{ secrets.SELF_PUSH }}" ]; then
            # Pull before pushing. A brand-new consumer repository has no upstream
            # branch yet; that one case is benign and is now detected explicitly.
            # Anything else — a rebase conflict, an auth or network failure — ABORTS
            # here instead of being swallowed and resurfacing below as a confusing
            # non-fast-forward rejection from the push.
            if GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_self" git ls-remote --exit-code --heads origin >/dev/null 2>&1; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_self" git pull --rebase
            fi
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_self" git push
          else
            echo "Warning: SELF_PUSH not configured, cannot push to main repo"
          fi
        }

    # Create release
    - name: Create release
      # The AUTOMATIC arm is guarded on whether the bindings actually moved; the
      # MANUAL arm (a dispatch naming a release_tag) is deliberately not, because
      # cutting a named release of the current bytes is the whole point of asking.
      #
      # Measured before this guard existed: of 112 consecutive build-<sha>
      # prereleases, 23 carried a byte-identical output/ payload (20.5%), and 19
      # of the last 62 (30.6%). Each one also paid two cold docker image builds,
      # ten consumer clones, and one unauthenticated BSR codegen request against
      # a 10-per-hour-per-IP budget.
      if: (github.event_name == 'push' && steps.consolidated.outputs.moved == 'true') || github.event.inputs.release_tag != ''
      run: |
        # Create tarballs for release
        mkdir -p release-artifacts
        for lang in c cpp go kotlin python typescript rust zig java json-descriptors; do
          if [ -d "output/$lang" ] && [ "$(ls -A output/$lang)" ]; then
            tar czf "release-artifacts/proto-${lang}.tar.gz" -C output "$lang"
          fi
        done

        # Create release using GitHub CLI
        gh release create \
          "${{ github.event.inputs.release_tag || format('build-{0}', github.sha) }}" \
          --title "${{ github.event.inputs.release_tag || format('Auto Build {0}', github.sha) }}" \
          --notes "Automated build of protocol buffer bindings.

        **Commit:** ${{ github.sha }}
        **Branch:** ${{ github.ref_name }}
        **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        **Build Architecture:** ARM64 ($(uname -m))
        **Target Platform:** NVIDIA Jetson AGX Orin (BSP 6.2)

        ## Available Languages
        - C (nanopb) - [jettison_proto_c](https://github.com/lpportorico/jettison_proto_c)
        - C++ (with buf.validate) - [jettison_proto_cpp](https://github.com/lpportorico/jettison_proto_cpp)
        - Go (with buf.validate) - [jettison_proto_go](https://github.com/lpportorico/jettison_proto_go)
        - Kotlin (with buf.validate) - [jettison_proto_kotlin](https://github.com/lpportorico/jettison_proto_kotlin)
        - Python - [jettison_proto_python](https://github.com/lpportorico/jettison_proto_python)
        - TypeScript - [jettison_proto_typescript](https://github.com/lpportorico/jettison_proto_typescript)
        - TypeScript (validated) - [jettison_protovalidate_es](https://github.com/lpportorico/jettison_protovalidate_es)
        - Rust - [jettison_proto_rust](https://github.com/lpportorico/jettison_proto_rust)
        - Zig (zig-protobuf)
        - Java (with buf.validate) - [jettison_proto_java](https://github.com/lpportorico/jettison_proto_java)
        - JSON Descriptors - [jettison_proto_json-descriptors](https://github.com/lpportorico/jettison_proto_json-descriptors)" \
          ${{ github.event.inputs.release_tag == '' && '--prerelease' || '' }} \
          release-artifacts/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
