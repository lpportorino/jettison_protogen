syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/cmd/system";

package cmd.System;

import "jon_shared_data_types.proto";

message Root {
  oneof cmd {
    option (buf.validate.oneof).required = true;
    StartALl start_all = 1;
    StopALl stop_all = 2;
    Reboot reboot = 3;
    PowerOff power_off = 4;
    SetLocalization localization = 5;
    ResetConfigs reset_configs = 6;
    StartRec start_rec = 7;
    StopRec stop_rec = 8;
    MarkRecImportant mark_rec_important = 9;
    UnmarkRecImportant unmark_rec_important = 10;
    EnterTransport enter_transport = 11;
    EnableGeodesicMode geodesic_mode_enable = 12;
    DisableGeodesicMode geodesic_mode_disable = 13;
    SaveFactoryDefaults save_factory_defaults = 14;
    WipeUserData wipe_user_data = 15;
    StepYear step_year = 16;
    StepMonth step_month = 17;
    StepDay step_day = 18;
    StepHour step_hour = 19;
    StepMinute step_minute = 20;
    StepSecond step_second = 21;
    EnableManualTime enable_manual_time = 22;
    DisableManualTime disable_manual_time = 23;
    SetTimeZone set_time_zone = 24;
    StepTimeZone step_time_zone = 25;
    SetTimeAndZone set_time_and_zone = 26;
  }
}

message StartALl {}

message StopALl {}

message Reboot {}

message PowerOff {}

message ResetConfigs {}

message SaveFactoryDefaults {}

message WipeUserData {}

message StartRec {}

message StopRec {}

message MarkRecImportant {}

message UnmarkRecImportant {}

message EnterTransport {}

message EnableGeodesicMode {}

message DisableGeodesicMode {}

message SetLocalization {
  ser.JonGuiDataSystemLocalizations loc = 1 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
}

message StepYear {
  int32 offset = 1;  // Positive or negative year offset
}

message StepMonth {
  int32 offset = 1;  // Positive or negative month offset
}

message StepDay {
  int32 offset = 1;  // Positive or negative day offset
}

message StepHour {
  int32 offset = 1;  // Positive or negative hour offset
}

message StepMinute {
  int32 offset = 1;  // Positive or negative minute offset
}

message StepSecond {
  int32 offset = 1;  // Positive or negative second offset
}

message EnableManualTime {}

message DisableManualTime {}

message SetTimeZone {
  int32 zone_id = 1 [(buf.validate.field).int32 = {
    gte: 0,
    lt: 595  // JON_SHARED_DATA_TIMEZONE_COUNT
  }];
}

message StepTimeZone {
  int32 offset = 1;  // Positive or negative timezone index offset
}

message SetTimeAndZone {
  int64 timestamp = 1 [(buf.validate.field).int64 = {
    gte: 0
  }];
  int32 zone_id = 2 [(buf.validate.field).int32 = {
    gte: 0,
    lt: 595  // JON_SHARED_DATA_TIMEZONE_COUNT
  }];
}
