syntax = "proto3";
package ui;

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/ui";

// ── Bidirectional host↔WASM pointer / lifecycle / feedback channel ───────────
//
// A size-bound, versioned, bidirectional protobuf channel between the
// LVGL-in-WASM controls program and its host (the native Rust shell AND the
// browser controls worker — ONE shared controls.wasm, two thin symmetric hosts).
//
//   host → WASM   ui.HostToWasm { pointer | lifecycle }
//   WASM → host   ui.WasmToHost { hover | cursor }
//
// Responsibility split (the rework — see docs/ui-nodes/04): gesture RECOGNITION
// lives INSIDE the shared controls.wasm (a reusable gesture module), so the host
// forwards ONLY raw W3C-style pointer events + lifecycle; it does NOT recognize
// gestures and there is NO `GestureCommand` on this channel. The WASM keeps a
// bounded pointer-state table, runs the gesture FSM off the pointer stream it
// already receives for LVGL hit-testing, and builds the full cmd.* device
// command itself (emitted as OPAQUE bytes over a separate `env.host_command`
// ABI, NOT in this proto — the host relays them to cmd_server without decoding).
//
// SIZE-BOUND BY CONSTRUCTION — nanopb-friendly with NO sibling ui_input.options:
// every field is scalar / enum. No strings (a nanopb string forces a max_size
// char[N]); no repeated (forces a max_count array or a non-size-bound
// FT_CALLBACK). ONE PointerEvent crosses per call; the multi-pointer bound lives
// in the WASM's fixed pointer-state table (MAX ~10), never on the wire. nanopb
// emits flat fixed-width C structs (the jon_shared_data_camera_day.proto
// precedent — also no .options). The ABSENT .options is the proof of
// size-boundedness. (Contrast ui_ast.options, which exists only because ui_ast
// has strings + repeated + recursion.)
//
// NDC coordinates are double ∈ [-1.0, 1.0], +x right / +y UP (Y-flipped from
// screen) — the convention shared with the cmd.* NDC commands (RotateToNDC /
// HaltWithNDC / StartTrackNDC), so the WASM-built device command is
// byte-identical (no fixed-point re-cast, no host-side conversion divergence).

// ── Shared enums (each carries _UNSPECIFIED = 0; consumers use
//    defined_only + not_in:[0] to reject the proto3 zero-default) ──────────

// Channel schema version registry — the canonical list of valid versions. The
// wire field is a uint32 (range-validated {gte:1,lte:255}) so it fail-fast
// rejects the proto3 default 0; this enum documents which values are valid.
enum InputSchemaVersion {
  INPUT_SCHEMA_VERSION_UNSPECIFIED = 0;
  INPUT_SCHEMA_VERSION_V1 = 1;
}

// W3C-style pointer lifecycle phase (host input device → WASM hit-test + FSM).
// CANCEL = pointercancel / lostpointercapture (palm-reject / OS-takeover /
// capture loss) — the FSM hard-aborts the pointer and emits NO terminal, so a
// lost contact never fires a phantom pan-end / tap device command.
enum PointerPhase {
  POINTER_PHASE_UNSPECIFIED = 0;
  POINTER_PHASE_DOWN = 1;
  POINTER_PHASE_MOVE = 2;
  POINTER_PHASE_UP = 3;
  POINTER_PHASE_CANCEL = 4;
}

// Pointing-device kind (W3C pointerType), for LVGL input semantics + the
// hit-test path (mouse can hover without contact; touch cannot).
enum PointerKind {
  POINTER_KIND_UNSPECIFIED = 0;
  POINTER_KIND_MOUSE = 1;
  POINTER_KIND_TOUCH = 2;
  POINTER_KIND_PEN = 3;
}

// OS theme the host reports for WASM restyle.
enum ThemeMode {
  THEME_MODE_UNSPECIFIED = 0;
  THEME_MODE_LIGHT = 1;
  THEME_MODE_DARK = 2;
}

// Cursor the WASM requests the host render over the hovered region.
enum CursorType {
  CURSOR_TYPE_UNSPECIFIED = 0;
  CURSOR_TYPE_DEFAULT = 1;
  CURSOR_TYPE_POINTER = 2;
  CURSOR_TYPE_TEXT = 3;
  CURSOR_TYPE_GRAB = 4;
  CURSOR_TYPE_RESIZE = 5;
  CURSOR_TYPE_NOT_ALLOWED = 6;
}

// ── Host → WASM payloads ─────────────────────────────────────────────────

// A bounded adaptation of the W3C Pointer Events API (mouse + touch + pen
// unified). The host forwards every pointer event; the WASM accumulates them
// into its fixed pointer-state table by `pointer_id` and runs the gesture FSM.
// The WASM SELF-VALIDATES at the decode boundary (nanopb strips buf.validate):
// reject phase/kind = 0, reject event_time = 0, clamp NDC, find-slot-or-drop on
// pointer_id, clamp non-positive FSM time deltas.
message PointerEvent {
  PointerPhase phase = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  PointerKind kind = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  uint32 pointer_id = 3;   // W3C pointerId — the multi-pointer FSM key (pinch keys on ≥2)
  double x = 4 [(buf.validate.field).double = {gte: -1.0, lte: 1.0}];   // NDC, +x right
  double y = 5 [(buf.validate.field).double = {gte: -1.0, lte: 1.0}];   // NDC, +y UP
  uint64 event_time = 6;   // W3C event.timeStamp, ms — the FSM clock (EVENT time, NOT the render tick)
}

// OS lifecycle the host pushes for WASM restyle / pause. focused/visible = false
// also doubles as the whole-surface FSM flush (recovers from blur/tab-switch
// pointer loss that a per-pointer CANCEL cannot cover).
message Lifecycle {
  ThemeMode theme = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  bool focused = 2;
  bool visible = 3;
}

// Host → WASM envelope. `version` is field 1 (fail-fast guard); the consumer
// checks it against the CURRENT value FIRST and returns a mismatch error — no
// migration branch, no version-sniffing. {gte:1} rejects the proto3 default 0.
message HostToWasm {
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];
  oneof event {
    option (buf.validate.oneof).required = true;
    PointerEvent pointer = 2;
    Lifecycle lifecycle = 3;
  }
}

// ── WASM → host payloads ─────────────────────────────────────────────────

// What the WASM hit-test found under the pointer. Identity travels as the
// WidgetNode.uid (a uint32), never a name — no string, stays size-bound.
message HoverState {
  uint32 hovered_uid = 1;   // ui_ast WidgetNode.uid; 0 = nothing hovered
  bool interactive = 2;     // host shows an interactive affordance when true
}

// The cursor the WASM wants the host to render.
message CursorRequest {
  CursorType cursor = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

// WASM → host envelope. Same version-guard contract as HostToWasm.
message WasmToHost {
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];
  oneof report {
    option (buf.validate.oneof).required = true;
    HoverState hover = 2;
    CursorRequest cursor = 3;
  }
}
