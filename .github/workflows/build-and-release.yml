name: Build and Distribute Proto Bindings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'proto/**'
      - 'Dockerfile*'
      - 'generate-*.sh'
      - 'scripts/**'
      # The wire-contract gate below is a step of THIS job, so a change to the
      # checker or its make target must re-run the fan-out's validation.
      - 'tools/wire_contract_check.py'
      - 'lint.mk'
      # THIS FILE ONLY — not '.github/workflows/**'. The other three workflows
      # each name only their own file; this one used to name the whole
      # directory, so every renderer.yml / devcards.yml / lint.yml edit ran the
      # fan-out. That is not a cheap no-op: each of the ten "Push to …" steps
      # rewrites the consumer README with `date -u` and the triggering sha
      # BEFORE `git add -A`, so the `git diff --staged --quiet` guard below can
      # never be true — every run commits and pushes to all ten consumer repos,
      # and the unconditional "Create release" step cuts a prerelease.
      #
      # Measured on this repo's own history (503 first-parent master commits,
      # per COMMIT — GitHub evaluates a push's whole range, so this is a lower
      # bound on pushes, not a push count): 199 commits match the old set, 189
      # match this one. The ten that stop firing touched only renderer.yml,
      # devcards.yml, lint.yml or .github/actions/**, none of which changes
      # anything this workflow runs. Every commit that touches THIS file still
      # fires (verified: 0 misses).
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write  # Allow pushing to the repository
  packages: write  # Allow pushing packages

# The other three workflows all had one; this one never did, and stacking was
# real rather than theoretical — 12 overlapping run-pairs across 4 clusters,
# up to 4 runs concurrently in flight on one day.
#
# cancel-in-progress is FALSE, deliberately, and this is the one place this
# repo's concurrency shape diverges from renderer/devcards/lint/wire-contract.
# Those four are read-only gates whose only product is a verdict, so cancelling
# a superseded run costs nothing. This workflow is a WRITER: it clones, commits
# and pushes to ten consumer repositories in sequence, then cuts a release.
# Cancelling it mid-sequence leaves the fleet SPLIT — some consumers carrying
# the new bindings, the rest carrying the old — with no record of where it
# stopped, which is exactly the cross-repo divergence CLAUDE.md's trunk-only
# policy exists to prevent. Queueing instead makes the fan-out serial: at most
# one run writing to any consumer repo at a time (today two stacked runs can
# clone/rebase/push the same consumer concurrently), one `buf generate` against
# the BSR at a time, and the newest push still wins because GitHub cancels the
# PENDING run — never the running one — when a third arrives.
concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-distribute:
    runs-on: ubuntu-22.04-arm  # Native ARM64 runner matching Jetson BSP 6.2 (Ubuntu 22.04)

    steps:
    - name: Verify ARM64 architecture
      run: |
        echo "Running on architecture: $(uname -m)"
        if [ "$(uname -m)" != "aarch64" ]; then
          echo "Error: Expected aarch64 architecture but got $(uname -m)"
          exit 1
        fi
        echo "✓ Confirmed running on ARM64"

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # Build base Docker image (native ARM64 build)
    - name: Build base Docker image
      run: |
        echo "Building base image..."
        docker build -t jettison-proto-generator-base:latest -f Dockerfile.base .

    # Build main Docker image
    - name: Build main Docker image
      run: |
        echo "Building main image..."
        docker build -t jettison-proto-generator:latest -f Dockerfile .

    # Generate all proto bindings
    - name: Generate all proto bindings
      env:
        # BSR AUTHENTICATION for the Go leg (the one generator that reaches the
        # network — two REMOTE plugins in its buf.gen.yaml). Unauthenticated,
        # BSR allows 10 code-generation requests/hour per IP; a token lifts that
        # to 960. This workflow has been unauthenticated for its entire life.
        #
        # THE SECRET DOES NOT EXIST YET. To configure it: create a BSR token at
        # https://buf.build/settings/user, add it as the repository secret
        # `BUF_TOKEN`, and nothing else changes — generate-protos.sh forwards it
        # into the go container only, and ONLY when non-empty.
        #
        # Until then this expands to the empty string, which the script treats
        # as absent: it prints the unauthenticated warning and runs exactly as
        # it does today. That is also what every fork build gets, since forks
        # cannot read repository secrets — so this must never be a hard failure.
        BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      run: |
        # List proto files we're going to process
        echo "Proto files to process:"
        ls -la proto/*.proto | head -10

        # Use Make command which properly sets PROTO_SOURCE_DIR=./proto by default
        make generate

        echo "Generated files:"
        find output -type f 2>/dev/null | head -20 || echo "No files generated yet"

    # THE ONLY VALIDATION BETWEEN `make generate` AND TEN CONSUMER REPOS.
    #
    # It runs HERE, after generation and before the first push, because this is
    # the one point in the fleet where the FRESHLY generated descriptor set
    # exists and nothing has shipped yet. wire-contract.yml runs the same target
    # on PRs and pushes, but against the COMMITTED descriptor set — which cannot
    # see a proto edit nobody regenerated. This step can.
    #
    # WHAT IT DOES NOT DO: forbid a renumber. docs/INTERFACE-CONTRACTS.md §10
    # allows one when every consumer rebuilds in lockstep, and that same §10
    # spells out the loop — "edit proto/, regenerate the bindings, UPDATE THIS
    # DOC TO MATCH, bump the jettison_protogen submodule pin in BOTH consumers".
    # This step enforces the doc-update beat of that documented loop. A red here
    # means the bindings about to be fanned out no longer match the contract the
    # consumers assert their encoders against, so shipping them would hand every
    # consumer a §9 parity failure whose cause lives in a commit already pushed.
    # Fix the doc (and bump the pins in lockstep), or revert the proto change.
    - name: Validate the wire contract against the generated descriptors
      run: make -f lint.mk wire-contract

    # Push to C repository
    - name: Push to jettison_proto_c
      run: |
        set -e  # Exit on any error
        if [ -n "${{ secrets.C_PUSH }}" ]; then
          # Clean up any existing target-repo directory
          rm -rf target-repo

          # Clone via HTTPS using GitHub token for authentication
          echo "Cloning repository..."
          git clone https://${{ github.actor }}:${{ github.token }}@github.com/lpportorino/jettison_proto_c.git target-repo || {
            echo "Failed to clone repository"
            exit 1
          }

          cd target-repo

          # Setup SSH key for pushing
          mkdir -p ~/.ssh
          echo "${{ secrets.C_PUSH }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git to use SSH for push
          git remote set-url origin git@github.com:lpportorino/jettison_proto_c.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Update files
          rm -rf *.pb.* *.h *.c
          cp -r ../output/c/* .

          cp ../LICENSE .
          git add -f -A
          if git diff --staged --quiet; then
            echo "No C binding changes to distribute"
          else
            echo "# Jettison Proto C Bindings" > README.md
            echo "" >> README.md
            echo "Auto-generated C bindings using nanopb." >> README.md
            echo "" >> README.md
            echo "**Target Platform**: ARM64 (NVIDIA Jetson AGX Orin BSP 6.2)" >> README.md
            echo "**Build Architecture**: $(uname -m)" >> README.md
            echo "" >> README.md
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md
            echo "Commit: ${{ github.sha }}" >> README.md

            git add -f README.md
            git commit -m "Update C bindings from ${{ github.sha }}"
            # Pull latest changes before pushing to avoid rejection (skip if remote is empty)
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git pull --rebase || true
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git push
          fi
        else
          echo "C_PUSH secret not configured, skipping"
        fi

    # Push to C++ repository
