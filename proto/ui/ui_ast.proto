syntax = "proto3";
package ui;

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/ui";

// Subject type — LVGL 9.2 supports INT, STRING, POINTER, COLOR, GROUP.
// We expose INT and STRING; others are renderer-internal.
enum SubjectType {
  SUBJECT_INT = 0;
  SUBJECT_STRING = 1;
}

// Declaration of a reactive subject (lives in Screen, initialized at load time)
message SubjectDeclaration {
  // unique identifier, e.g. "zoom_level"
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
  SubjectType type = 2 [(buf.validate.field).enum = {defined_only: true}];
  oneof initial {
    int32 int_initial = 3; // default value for INT subjects
    // default value for STRING subjects
    string string_initial = 4 [(buf.validate.field).string = {max_len: 255}];
  }
}

// Host → WASM state update (decoded by controls_update_state)
message StateUpdate {
  repeated SubjectValue values = 1;
}

// A single subject value in a state update
message SubjectValue {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
  oneof value {
    int32 int_value = 2;
    string string_value = 3 [(buf.validate.field).string = {max_len: 255}];
  }
}

// A complete UI screen — root message pushed via controls_load_ui().
message Screen {
  // `optional` is required so nanopb generates `has_root` for presence
  // checking in proto3 (submessage fields do NOT get `has_*` by default).
  optional WidgetNode root = 1;
  repeated SubjectDeclaration subjects = 2; // reactive subject declarations
}

// A node in the widget tree (recursive).
message WidgetNode {
  WidgetType type = 1 [(buf.validate.field).enum = {defined_only: true}];

  // Position (optional — 0,0 = use layout)
  int32 x = 2;
  int32 y = 3;

  // Static text (labels, checkbox, textarea, button)
  string text = 4 [(buf.validate.field).string = {max_len: 255}];

  // Subject data bindings (key = LVGL property, value = subject name)
  map<string, string> bindings = 5;

  // Event binding (what command to emit on click)
  EventBinding event = 6;

  // Layout flow
  Layout layout = 7;

  // Children
  repeated WidgetNode children = 8;

  // Style groups: default + per-state, each with 8 composite variants,
  // ordered default, pressed, focused, disabled, ...
  repeated StyleGroup style_groups = 9;

  // Typed widget-specific properties (one per widget type)
  oneof widget_props {
    ObjProps obj_props = 10;
    ButtonProps button_props = 11;
    LabelProps label_props = 12;
    SliderProps slider_props = 13;
    ImageProps image_props = 14;
    ArcProps arc_props = 15;
    BarProps bar_props = 16;
    SwitchProps switch_props = 17;
    CheckboxProps checkbox_props = 18;
    DropdownProps dropdown_props = 19;
    RollerProps roller_props = 20;
    TextareaProps textarea_props = 21;
    SpinboxProps spinbox_props = 22;
    SpinnerProps spinner_props = 23;
    LedProps led_props = 24;
    LineProps line_props = 25;
    ScaleProps scale_props = 26;
    ButtonMatrixProps buttonmatrix_props = 27;
    TableProps table_props = 28;
    TabviewProps tabview_props = 38;
    ChartProps chart_props = 40;
    HostProxyProps host_proxy_props = 41;
    TargetOverlayProps target_overlay_props = 48;
  }

  // Conditional visibility binding (show/hide based on subject value)
  VisibilityBinding visibility = 29;

  // Format strings for bound text (key = binding key, value = printf format)
  map<string, string> bind_formats = 30;

  // LV_OBJ_FLAG_* bitmask to ADD on the widget (direct-cast to LVGL —
  // parity-gated). 0 = no extra flags.
  uint32 obj_flags = 31;

  // LV_OBJ_FLAG_* bitmask to REMOVE (e.g. clear SCROLLABLE on panels).
  uint32 obj_flags_clear = 32;

  // lv_state_t bitmask applied at create (e.g. DISABLED). Direct-cast.
  uint32 states = 33;

  // lv_dir_t scroll direction constraint; 0 = leave the LVGL default.
  uint32 scroll_dir = 34;

  // Grid track templates (lv_coord_t values incl. LV_GRID_FR/CONTENT
  // encodings; the renderer appends LV_GRID_TEMPLATE_LAST). Both empty =
  // no grid layout.
  repeated int32 grid_col_dsc = 35;
  repeated int32 grid_row_dsc = 36;

  // Strip ALL theme/base styles before applying style_groups
  // (lv_obj_remove_style_all) — layout-only or fully hand-styled nodes.
  bool bare = 37;

  // Tab-bar slot selector — meaningful ONLY on a direct child of a
  // WIDGET_TABVIEW node: true builds this child inside the tab bar
  // (lv_tabview_get_tab_bar) instead of zipping into a tab page.
  bool in_tab_bar = 39;

  // Reactive checked-state binding — the widget gets LV_STATE_CHECKED while
  // the comparison against the subject holds, cleared otherwise (the
  // reactive sibling of `states`; setting CHECKED in both is author error,
  // rejected by codegen validation). Reuses the VisibilityBinding shape
  // (subject + ref_value + compare).
  VisibilityBinding checked_when = 42;

  // Reactive ENABLED-state binding — the reactive sibling of `checked_when`,
  // inverted in polarity: the widget carries LV_STATE_DISABLED while the
  // comparison against the subject does NOT hold, and is cleared (enabled)
  // while it holds. Reuses the VisibilityBinding shape (subject + ref_value +
  // compare); EQ/NOT_EQ use the native lv_obj_bind_state_if_* helpers, the
  // range ops a custom observer (the checked_when / visibility precedent).
  // Drives reactive precondition-disable — a control greyed until its
  // preconditions read satisfied.
  VisibilityBinding enabled_when = 45;

  // Reactive TEXT-COLOR binding — the widget's LV_PART_MAIN text color is set
  // to `color_when.color` while the comparison holds, and reverted to the
  // theme/authored default when it does not. Unlike the three state bindings
  // above, LVGL has no native bind helper for a style property, so ALL compare
  // ops use a custom observer. Drives reactive fault-coloring — a readout that
  // recolors while its value is out of range.
  ColorBinding color_when = 46;

  // Touch affordance: grow this node's HIT box beyond its drawn box by this
  // many design pixels, on all four sides (lv_obj_set_ext_click_area, which
  // is one value per object — LVGL has no per-side form, so neither does
  // this). DPI-scaled through LV_DPX, so 24 here is 24px at DPI 160 and 48
  // at 320; 0 (the default) is exactly 0 at every DPI and means the hit box
  // IS the drawn box.
  //
  // This is an lv_obj_t FIELD, not a style property, which is why it sits on
  // the node rather than in a StyleGroup — it cannot be varied per state and
  // it does not cascade.
  //
  // AUTHORING DUTY, and it is the whole reason this is explicit rather than
  // a per-widget-class default. The slop is INVISIBLE to layout: a flex or
  // grid parent reserves space by the DRAWN box, so slop bleeds into
  // whatever sits next to this node, and lv_indev_search_obj returns the
  // FIRST hit walking children in REVERSE — so in the overlapped band one
  // sibling silently takes every press and the other is dead there, with no
  // pixel and no event to show for it. Reserve the space you claim: keep at
  // least this many clear pixels to every interactive sibling, or wrap the
  // node in a transparent container that owns the margin. Prefer growing the
  // CONTROL where the design allows it, because that growth is the kind a
  // layout can see. renderer/src/renderer.h carries the full contract and
  // docs/UI-QUALITY-CONTRACTS.md §2.5 the sibling-gap arithmetic.
  uint32 hit_slop = 47 [(buf.validate.field).uint32 = {lte: 64}];

  // Stable node identity for tree patching: FNV-1a-32 of the node's
  // root→node identity path (author :id segments, else type#ordinal among
  // unkeyed same-type siblings), assigned + collision-checked by codegen.
  // 0 = never assigned (proto3 default); the renderer mirrors it into
  // lv_obj user_data and a uid→obj registry so ScreenPatch ops can
  // address live widgets.
  uint32 uid = 43;

  // Pre-encoded gesture→cmd templates (R5a) — meaningful ONLY on the
  // gesture-surface host-proxy node. The host recognizer matches a decision to
  // the entry whose GestureSpec.kind equals its kind and whose
  // GestureSpec.delta_sign admits its step, then patches the slots.
  //
  // The bound is ONE ENTRY PER DEFINED GestureKind, plus one: PINCH is the only
  // kind whose decisions carry a step, so it is the only kind that legitimately
  // takes two entries. WHEEL is counted even though it has no device analogue,
  // because a bound that excepts an enumerator has to be re-derived by every
  // reader — and the earlier bound of 5 was derived that way, from the five
  // device gestures of the day, and then silently went one short when
  // GESTURE_KIND_ROI was added beside them. renderer/src/main.c holds this sum
  // to the vocabulary with a static_assert so the next added kind fails the
  // BUILD rather than a consumer's load.
  repeated GestureSpec gestures = 44 [(buf.validate.field).repeated = {max_items: 8}];
}

// ── Tree patches — partial UI updates (controls_apply_patch) ──────────
// A ScreenPatch carries explicit node-level ops the codegen-side differ
// resolved against authoritative uids; the wasm reconciler applies them
// mechanically (no client-side matching). Op ordering is the differ's
// obligation: ops apply strictly sequentially against the live tree.

enum PatchOpKind {
  PATCH_OP_UPDATE_PROPS = 0; // morph target in place from node's props
  PATCH_OP_REPLACE_NODE = 1; // teardown target subtree, build node in slot
  PATCH_OP_INSERT_NODE = 2; // build node under parent_uid at index
  PATCH_OP_REMOVE_NODE = 3; // teardown target subtree
  PATCH_OP_MOVE_NODE = 4; // reorder target to index (same parent)
}

message TreePatchOp {
  PatchOpKind kind = 1 [(buf.validate.field).enum = {defined_only: true}];
  uint32 target_uid = 2; // UPDATE / REPLACE / REMOVE / MOVE
  uint32 parent_uid = 3; // INSERT / MOVE destination
  uint32 index = 4; // INSERT / MOVE child slot
  // INSERT/REPLACE: the full new subtree; UPDATE_PROPS: the node's
  // morphable prop set with children EMPTY (non-empty children in an
  // UPDATE op is a decode error).
  optional WidgetNode node = 5;
}

// Tree patch container — pushed via controls_apply_patch(ptr, len).
message ScreenPatch {
  // FNV-1a-32 of the base .pb bytes this patch was diffed from; the
  // reconciler refuses on mismatch (fail-fast against out-of-order pushes).
  uint32 base_hash = 1;
  // Hash of the target full .pb; becomes the current-state hash after a
  // successful apply.
  uint32 target_hash = 2;
  repeated TreePatchOp ops = 3;
}

enum WidgetType {
  WIDGET_OBJ = 0;
  WIDGET_BUTTON = 1;
  WIDGET_LABEL = 2;
  WIDGET_SLIDER = 3;
  WIDGET_IMAGE = 4;
  WIDGET_ARC = 5;
  WIDGET_BAR = 6;
  WIDGET_SWITCH = 7;
  WIDGET_CHECKBOX = 8;
  WIDGET_DROPDOWN = 9;
  WIDGET_ROLLER = 10;
  WIDGET_TEXTAREA = 11;
  WIDGET_SPINBOX = 12;
  WIDGET_SPINNER = 13;
  WIDGET_LED = 14;
  WIDGET_LINE = 15;
  WIDGET_SCALE = 16;
  WIDGET_BUTTONMATRIX = 17;
  WIDGET_TABLE = 18;
  WIDGET_TABVIEW = 19;
  WIDGET_CHART = 20;
  WIDGET_HOST_PROXY = 21;
  WIDGET_TARGET_OVERLAY = 22;
}

// -- Widget-specific properties messages --

message ObjProps {}

message ButtonProps {}

message LabelProps {
  LabelLongMode long_mode = 1 [(buf.validate.field).enum = {defined_only: true}];
}

message SliderProps {
  int32 min_value = 1;
  int32 max_value = 2;
  int32 value = 3;
  BarMode mode = 4 [(buf.validate.field).enum = {defined_only: true}];
  // Seek immediately on press: LV_EVENT_PRESSED maps the pressed point to a
  // value with the stock update_knob_pos math. Stock LVGL seeks a stationary
  // track tap only at RELEASE, so this changes WHEN the value moves, and
  // nothing else. BAR_MODE_RANGE never press-seeks: which knob a press
  // adjusts is the two-knob proximity contract, and jumping a knob on DOWN
  // would preempt it.
  //
  // THIS PROP IS BEHAVIOUR ONLY. It used to also widen the ext click area to
  // LV_DPX(24), because the wire had nowhere else to put a touch affordance
  // — so a scrubber could not ask for the envelope without the seek, or the
  // seek without the envelope, and no other widget could ask for either.
  // WidgetNode.hit_slop now carries that, for every widget; a press-seek
  // slider that wants the envelope sets both, and its author owes hit_slop's
  // reserve-the-space duty.
  bool seek_on_press = 5;
}

message ImageProps {
  string src = 1 [(buf.validate.field).string = {max_len: 255}];
  // Transform pivot (lv_image_set_pivot) — meaningful with rotation.
  bool has_pivot = 2;
  int32 pivot_x = 3;
  int32 pivot_y = 4;
  // Rotation in 0.1-degree units (lv_image_set_rotation).
  int32 rotation = 5;
}

message ArcProps {
  uint32 start_angle = 1 [(buf.validate.field).uint32 = {lte: 360}];
  uint32 end_angle = 2 [(buf.validate.field).uint32 = {lte: 360}];
  uint32 bg_start_angle = 3 [(buf.validate.field).uint32 = {lte: 360}];
  uint32 bg_end_angle = 4 [(buf.validate.field).uint32 = {lte: 360}];
  int32 rotation = 5;
  ArcMode mode = 6 [(buf.validate.field).enum = {defined_only: true}];
  int32 min_value = 7;
  int32 max_value = 8;
  int32 value = 9;
}

message BarProps {
  int32 min_value = 1;
  int32 max_value = 2;
  int32 value = 3;
  int32 start_value = 4;
  BarMode mode = 5 [(buf.validate.field).enum = {defined_only: true}];
}

message SwitchProps {
  bool checked = 1;
}

message CheckboxProps {
  bool checked = 1;
}

message DropdownProps {
  string options = 1 [(buf.validate.field).string = {max_len: 1023}];
  uint32 selected = 2;
  Dir direction = 3 [(buf.validate.field).enum = {defined_only: true}];
  // Per-option device enum VALUES, in the SAME order as the `options` label list.
  // A value-driven state bind index-selects the option whose value == the subject
  // int (the renderer scans this array), fixing the enum-number-as-index off-by-one
  // when options drop _UNSPECIFIED / :not-in values (1-based options vs 0-based
  // enum). Empty when the dropdown carries no enum-value bind.
  repeated int32 option_values = 4 [(buf.validate.field).repeated = {max_items: 16}];
}

message RollerProps {
  string options = 1 [(buf.validate.field).string = {max_len: 511}];
  uint32 selected = 2;
  uint32 visible_row_count = 3;
  RollerMode mode = 4 [(buf.validate.field).enum = {defined_only: true}];
}

message TextareaProps {
  string placeholder = 1 [(buf.validate.field).string = {max_len: 255}];
  uint32 max_length = 2;
  bool one_line = 3;
  bool password_mode = 4;
}

message SpinboxProps {
  int32 min_value = 1;
  int32 max_value = 2;
  int32 value = 3;
  int32 step = 4;
  uint32 digit_count = 5;
  uint32 separator_position = 6;
}

message SpinnerProps {
  uint32 spin_time = 1;
  uint32 arc_length = 2;
}

message LedProps {
  Color color = 1;
  uint32 brightness = 2 [(buf.validate.field).uint32 = {lte: 255}];
}

message LineProps {
  repeated Point points = 1;
  bool y_invert = 2;
}

message ScaleProps {
  ScaleMode mode = 1 [(buf.validate.field).enum = {defined_only: true}];
  uint32 total_tick_count = 2;
  uint32 major_tick_every = 3;
  bool label_show = 4;
  int32 min_value = 5;
  int32 max_value = 6;
  int32 rotation = 7;
  uint32 angle_range = 8 [(buf.validate.field).uint32 = {lte: 360}];
  // Demo-parity extensions (lv_demo_widgets analytics scales):
  // major-tick label sources ("\n"-joined custom texts).
  string text_src = 9 [(buf.validate.field).string = {max_len: 255}];
  // Draw tick labels after the needle/indicator (lv_scale_set_post_draw).
  bool post_draw = 10;
  // Colored value sections (lv_scale_section_*).
  repeated ScaleSection sections = 11 [(buf.validate.field).repeated = {max_items: 4}];
}

message ScaleSection {
  int32 range_min = 1;
  int32 range_max = 2;
  // INDICATOR + ITEMS tick-line style for the section (line_color /
  // line_width — the demo styles both parts identically).
  Color color = 3;
  uint32 width = 4;
  // MAIN-part style for the section — the arc band on a round scale /
  // the main line on a linear one (arc_color+arc_width AND
  // line_color+line_width are both set from this pair; LVGL reads the
  // part that matches the scale mode). Absent color + zero width = no
  // MAIN section style.
  Color main_color = 5;
  uint32 main_width = 6;
}

message ButtonMatrixProps {
  string map_str = 1 [(buf.validate.field).string = {max_len: 1023}];
  bool one_check = 2;
}

message TableProps {
  uint32 row_count = 1;
  uint32 column_count = 2;
}

message TabviewProps {
  // Tab names, one per content child of the tabview node — child i of the
  // node's regular children list becomes tab i's page content (children
  // flagged in_tab_bar are excluded from the zip; they go to the tab bar).
  repeated string tab_names = 1 [(buf.validate.field).repeated = {
    max_items: 8
    items: {
      string: {max_len: 31}
    }
  }];
  // Tab bar size in px (height for top/bottom bars, width for left/right);
  // 0 = keep the LVGL default (DPI-derived).
  int32 tab_bar_size = 2;
  // Initially active tab index (applied LAST, with LV_ANIM_OFF).
  uint32 active_index = 3;
  // Tab bar placement — lv_dir_t direct-cast (parity-gated); DIR_NONE = keep
  // the LVGL default (top).
  Dir tab_bar_position = 4 [(buf.validate.field).enum = {defined_only: true}];
  // Extra left padding (px) on the tab bar itself — the demo offsets its
  // tab buttons into the right half (pad_left = LV_HOR_RES/2) and floats
  // logo + title decor over the freed left half. 0 = no extra padding.
  int32 tab_bar_pad_left = 5;
}

// One chart data series (lv_chart_add_series + per-index value writes).
message ChartSeries {
  // Series color; absent = the theme primary color (the demo's default
  // for its unstyled series).
  Color color = 1;
  // Y axis the series attaches to — lv_chart_axis_t direct-cast
  // (parity-gated, sparse bitmask values); PRIMARY_Y (0) is the default.
  ChartAxis axis = 2 [(buf.validate.field).enum = {defined_only: true}];
  // Frozen-frame data points, written BY INDEX (point i = values[i] via
  // lv_chart_set_series_value_by_id); points past the list keep
  // LV_CHART_POINT_NONE.
  repeated int32 values = 3 [(buf.validate.field).repeated = {max_items: 32}];
}

message ChartProps {
  // lv_chart_type_t direct-cast (parity-gated); NONE (0) = keep the LVGL
  // default (LINE).
  ChartType type = 1 [(buf.validate.field).enum = {defined_only: true}];
  // 0 = keep the LVGL default point count.
  uint32 point_count = 2;
  // Division lines: 0 is a VALID explicit count (the demo sets 0,12), so
  // presence rides has_div_lines (the ImageProps.has_pivot pattern);
  // false = keep the LVGL defaults (HDIV_DEF/VDIV_DEF).
  bool has_div_lines = 3;
  uint32 hdiv_count = 4 [(buf.validate.field).uint32 = {lte: 255}];
  uint32 vdiv_count = 5 [(buf.validate.field).uint32 = {lte: 255}];
  repeated ChartSeries series = 6 [(buf.validate.field).repeated = {max_items: 8}];
  // Replicate the demo's chart fader draw-event: a vertical-gradient area
  // under every LINE-series segment (LV_EVENT_DRAW_TASK_ADDED).
  bool fade_area = 7;
}

// Host-proxy positioning modes. OUR enum (no LVGL counterpart — not
// parity-gated); int values are the wire contract for the mode subject.
enum ProxyMode {
  PROXY_MODE_STATIC = 0; // host element interactive; proxy inert
  PROXY_MODE_DRAGGABLE = 1; // body drag moves the box
  PROXY_MODE_RESIZABLE = 2; // corner handles resize; body drag moves
  PROXY_MODE_ALIGNABLE = 3; // 3x3 snap grid; no free drag
}

// Host-proxy widget: a box that POSITIONS a host-side element. The renderer
// draws the box + its interaction affordances and streams the box's rect +
// mode to the host via the host_proxy_report import; the host composites
// its own element (DOM overlay, video plane) at the reported rect.
message HostProxyProps {
  // Stable host-side join key (jettison keys proxies by name —
  // proxySerializationUtils.ts). Survives tree rebuilds.
  string proxy_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
  // Initial mode. When a "mode" binding is present, the SUBJECT is the
  // source of truth and this is ignored after attach.
  ProxyMode mode = 2 [(buf.validate.field).enum = {defined_only: true}];
  // Resize clamps, framebuffer px. 0 = unconstrained (renderer floors
  // at 2x the resolved handle size so handles stay usable).
  int32 min_w = 3;
  int32 min_h = 4;
  int32 max_w = 5;
  int32 max_h = 6;
  // Corner handle edge, px. 0 = renderer default (DPI-derived).
  uint32 handle_size = 7;
  // Opaque host stacking hint, forwarded verbatim in reports (jettison's
  // consumers want zIndex with every position update). The renderer never
  // interprets it.
  int32 z = 8;
}

// One rectangle drawn by a WIDGET_TARGET_OVERLAY node — a computer-vision
// detection or track, not an interactive control.
message TargetBox {
  // Rect in DESIGN PIXELS, relative to the overlay's own content-box origin.
  // Same unit and same origin as WidgetNode.x/y, deliberately: a producer that
  // can place a node can place a box, and a per-mille or normalized rect would
  // be the only unit in this vocabulary that is not raw design px. Signed
  // because a detection at the frame edge is legitimately partly outside — the
  // overlay clips its children, so a box hanging off an edge draws its visible
  // part and nothing more.
  int32 x = 1;
  int32 y = 2;
  int32 w = 3;
  int32 h = 4;
  // Caption drawn inside the box's top-left corner. Empty = no caption. It
  // takes its text color and font from the OVERLAY node, so a PROP_TEXT_COLOR
  // or PROP_TEXT_FONT in the overlay's style_groups is a screen's one handle on
  // every caption — the boxes and captions are renderer-built and no StyleGroup
  // addresses them directly. The renderer carries those two values down
  // EXPLICITLY: LVGL's own style inheritance does not reach that far, because
  // the box object between overlay and caption re-resolves the theme's own text
  // color and inheritance stops at the first ancestor that resolves.
  string label = 5 [(buf.validate.field).string = {max_len: 31}];
  // Box stroke color. Absent = the theme's border color for the overlay's own
  // class, which is what makes an unstyled box theme-correct in both families
  // (the ChartSeries.color convention). When present it colors the caption
  // too, so one classification reads as one thing.
  Color color = 6;
}

// Target-overlay widget: a pointer-transparent box that draws N target
// rectangles over whatever it is stacked on (typically a host-proxy video
// plane). The boxes are DATA, not child WidgetNodes: they carry their own
// geometry, are never laid out by LVGL, and take no part in the pointer path —
// an overlay that absorbed presses would be a dead zone over the surface
// underneath it, which is the failure LV_STATE_DISABLED stacking already
// demonstrates elsewhere.
//
// Live detections arrive as a ScreenPatch op against the overlay's uid; there
// is no per-box subject binding, because the box list is a structure and
// StateUpdate carries only ints and strings. The op is a
// PATCH_OP_REPLACE_NODE, never PATCH_OP_UPDATE_PROPS: the renderer appends one
// LVGL object per box, so the live subtree does not mirror the node's own
// children and re-applying these props in place would stack a second set of
// boxes over the first. That puts this widget in the same replace-only class
// as WIDGET_TABVIEW and WIDGET_HOST_PROXY, and the renderer refuses an
// UPDATE_PROPS naming it.
message TargetOverlayProps {
  // The frame's boxes. FT_POINTER on the C side (ui_ast.options): the arm sits
  // in the widget_props union, which is on the recursive decode stack once per
  // tree level, so an inline array would tax every node of every screen for a
  // list only this widget carries.
  repeated TargetBox boxes = 1 [(buf.validate.field).repeated = {max_items: 32}];
  // Box stroke width in design px; 0 = the renderer default. It is a prop
  // rather than a style property because the boxes are renderer-built children
  // that no StyleGroup can address — the same reason HostProxyProps carries
  // handle_size.
  uint32 border_width = 2 [(buf.validate.field).uint32 = {lte: 16}];
  // Suppress every caption without clearing the labels. Polarity is chosen so
  // proto3's false default draws them: a producer that fills in boxes and
  // labels gets the captions it wrote without having to set a second flag.
  bool hide_labels = 3;
}

// -- Supporting types --

message Point {
  int32 x = 1;
  int32 y = 2;
}

// Which LVGL event code triggers this event binding.
enum EventTrigger {
  TRIGGER_CLICKED = 0; // LV_EVENT_CLICKED (default)
  TRIGGER_VALUE_CHANGED = 1; // LV_EVENT_VALUE_CHANGED
  TRIGGER_LONG_PRESSED = 2; // LV_EVENT_LONG_PRESSED
}

message EventBinding {
  // event keyword — IS the command identifier. Budget 127 for parity with
  // CmdSpec.command_id: a composite command's collect events read
  // cmd.<Pkg>.<Command>.collect.<field>, which exceeds 63 for long composites
  // (e.g. cmd.Heater.SetAutomaticControlParams.collect.channel_0_target_temperature).
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 127
  }];
  // which LVGL event fires this (default: CLICKED)
  EventTrigger trigger = 2 [(buf.validate.field).enum = {defined_only: true}];
  int32 int_value = 3; // static int payload
  bool include_widget_value = 4; // inject widget's current value as int_value
  // local subject to mutate (empty = host event). Bounded at 63: subject names
  // are 64-buffered everywhere (the registry, SubjectDeclaration.name), so a
  // longer value could never resolve to a declarable subject.
  string set_subject = 5 [(buf.validate.field).string = {max_len: 63}];
  int32 set_value = 6; // value to set on subject
  bool toggle = 7; // flip 0↔1 instead of set_value
  bool notify_host = 8; // also send to host when mutating subject
  // Pre-encoded cmd.* device-command template + slot patch descriptor
  // (R5a). When present the renderer (R5b) builds the full cmd.Root by
  // memcpy'ing root_template and overwriting the patch slot(s) with the
  // widget value, then relays the result as OPAQUE bytes via host_command —
  // controls.wasm no longer round-trips through the server /node-cmd shim.
  CmdSpec cmd = 9;
  // Pre-encoded cmd.* templates the widget's INTEGER value index-selects
  // among (R5a). When present, the widget's current int value (0/1 for a
  // switch, a dropdown/slider index, any bounded int) selects which entry to
  // emit; each entry is a FIXED template (patch_count 0, no runtime slot
  // rewrite). Serves :bool-set (2 entries [false,true]), :on-off (2 entries
  // [off,on]) and :enum (N entries in dropdown-option order). Mutually
  // exclusive with `cmd` (a widget's value either patches ONE template or
  // index-selects among fixed ones); an out-of-range index emits nothing.
  repeated CmdSpec cmd_by_value = 10 [(buf.validate.field).repeated = {max_items: 16}];
}

// ── cmd-out pre-encode (R5a) ──────────────────────────────────────────
// The uigen GENERATOR pre-encodes a full cmd.Root template (deterministic
// envelope + the command's leaf in a FIXED-WIDTH slot) at GENERATION time;
// at runtime the renderer memcpy's root_template and overwrites just the
// slot(s) named by `patches`. The byte stream is fixed-width: DOUBLE leaves
// are wire-type 1 (8 fixed LE bytes, byte-identical NDC), VARINT int leaves
// are pre-encoded as a NON-MINIMAL padded varint of fixed max width so the
// slot stays a clean fixed offset (value-identity holds for varint leaves).

// WHERE the patcher reads the value it writes into a slot. This is the SOURCE
// axis only; how the value is written is PatchEncoding below.
enum PatchKind {
  PATCH_KIND_UNSPECIFIED = 0;
  PATCH_KIND_NDC_X = 1; // gesture NDC x → a double slot (verbatim, no recast)
  PATCH_KIND_NDC_Y = 2; // gesture NDC y → a double slot (verbatim, no recast)
  PATCH_KIND_DELTA = 3; // pinch/wheel ±1 step → an int slot
  PATCH_KIND_WIDGET_VALUE = 4; // the emitting widget's int value → an int slot
  PATCH_KIND_NDC_X2 = 5; // ROI rubber-band 2nd-corner NDC x → a double slot (verbatim)
  PATCH_KIND_NDC_Y2 = 6; // ROI rubber-band 2nd-corner NDC y → a double slot (verbatim)
  // The current int of the NAMED local subject in FieldPatch.subject. The one
  // source that is neither a pointer gesture nor the emitting widget's own
  // value, which is what lets a multi-field FORM be sent by a control that has
  // no value of its own: each slot names its own subject, so N slots carry N
  // independent values without the emit call gaining N arguments.
  PATCH_KIND_SUBJECT_VALUE = 7;
}

// HOW the patcher writes a value-sourced slot. Separate from PatchKind because
// the two are genuinely orthogonal: ONE integer source targets three different
// wire shapes, so folding them into one enum needs a cross product that grows
// multiplicatively with every new source.
//
// MEANINGFUL ONLY FOR THE VALUE-SOURCED KINDS — DELTA, WIDGET_VALUE and
// SUBJECT_VALUE, each of which must set a defined encoding. The four NDC kinds
// ARE 8-byte verbatim doubles by definition, so they carry UNSPECIFIED and the
// renderer REFUSES a set encoding on them: the fact lives in exactly one field
// rather than in two that can disagree.
enum PatchEncoding {
  PATCH_ENCODING_UNSPECIFIED = 0; // the NDC kinds; refused on a value kind
  // Non-minimal padded varint of (value × wire_scale), byte_width bytes wide.
  PATCH_ENCODING_PADDED_VARINT = 1;
  // 8 little-endian IEEE-754 bytes of (value ÷ wire_scale). byte_width must be 8.
  PATCH_ENCODING_DOUBLE_LE = 2;
  // 4 little-endian IEEE-754 bytes of (value ÷ wire_scale). byte_width must be 4.
  PATCH_ENCODING_FLOAT_LE = 3;
}

// One fixed-width slot in a CmdSpec.root_template the renderer overwrites.
message FieldPatch {
  uint32 byte_offset = 1; // start of the slot in root_template
  uint32 byte_width = 2; // slot width (8 double, 4 float, 5/10 padded varint)
  PatchKind kind = 3 [(buf.validate.field).enum = {defined_only: true}];
  // gen-time fixed-point factor (uigen.scales), whose ONE definition is
  // `proto value × wire_scale = the ABI int` the LVGL widgets and subjects
  // ride. The float/double encodings therefore DIVIDE by it to recover the
  // proto value; the padded varint MULTIPLIES, because an integer leaf's ABI
  // int is already in the proto's own unit and its scale is 1. A wire_scale
  // ≤ 0 is refused rather than applied — it can only come from a malformed
  // producer, and both directions would silently corrupt the slot.
  sint32 wire_scale = 4;
  // The local subject whose current int this slot reads. REQUIRED when kind is
  // PATCH_KIND_SUBJECT_VALUE and MUST be empty for every other kind; the
  // renderer refuses both violations. Bounded at 63 like every other subject
  // reference (SubjectDeclaration.name, VisibilityBinding.subject,
  // EventBinding.set_subject), so a name legal to DECLARE is always legal to
  // reference here. A NAME rather than a registry index deliberately: the
  // renderer's registry order is a decode-time implementation detail that a
  // dropped or reordered declaration silently shifts, so an index would
  // resolve to the WRONG subject and send a plausible wrong value, while an
  // unresolvable name fails loud at load.
  string subject = 5 [(buf.validate.field).string = {max_len: 63}];
  PatchEncoding encoding = 6 [(buf.validate.field).enum = {defined_only: true}];
}

// A pre-encoded cmd.Root template + the slots the renderer overwrites.
message CmdSpec {
  // the source command-id (e.g. "cmd.RotaryPlatform.RotateToNDC") — the
  // pre-encode provenance; the renderer never re-derives a route from it.
  string command_id = 1 [(buf.validate.field).string = {max_len: 127}];
  // the full deterministic cmd.Root protobuf (envelope + leaf in its
  // fixed-width slot, leaf written at a SENTINEL the gen-time patch located).
  bytes root_template = 2;
  // The slot(s) to overwrite at runtime. Bounded at 8 by the WIDEST command
  // this vocabulary must be able to send in one shot: the rotary scan-node
  // commands carry 7 operator-facing fields (an index, two zoom-table values,
  // azimuth, elevation, linger and speed), so a form for one needs 7 slots.
  // The gesture shapes that set the previous bound of 4 are unaffected — an
  // NDC x/y pair is 2 and an ROI rubber-band's two corners are 4.
  repeated FieldPatch patches = 3 [(buf.validate.field).repeated = {max_items: 8}];
}

// A recognized gesture kind; mirrors gesture_kind_t (src/gesture.h) so a
// host-side decision tag selects its pre-encoded template directly.
enum GestureKind {
  GESTURE_KIND_PAN_MOVE = 0; // → cmd.RotaryPlatform.Axis (continuous slew)
  GESTURE_KIND_PAN_END = 1; // → cmd.RotaryPlatform.HaltWithNDC
  GESTURE_KIND_TAP = 2; // → cmd.RotaryPlatform.RotateToNDC
  GESTURE_KIND_TRACK = 3; // → cmd.CV.StartTrackNDC
  // Two fingers spreading or closing, reported as a SIGNED ±1 step. Its two
  // directions are usually two DIFFERENT commands rather than one command with
  // a signed leaf — a zoom table steps by cmd.{Day,Heat}Camera.NextZoomTablePos
  // and .PrevZoomTablePos, both EMPTY messages with no leaf a sign could be
  // written into — so a pinch surface registers TWO GestureSpecs for this kind,
  // told apart by GestureSpec.delta_sign.
  GESTURE_KIND_PINCH = 4;
  GESTURE_KIND_WHEEL = 5; // web-only; no device analogue (no template)
  // ROI rubber-band rectangle: a mode-gated REINTERPRETATION of a completed
  // pan (PAN_END) whose down+up corners become one 4-NDC command
  // (cmd.{Day,Heat}Camera.{Focus,Track,Zoom,Fx}ROI). This kind is a REGISTRY
  // LOOKUP KEY only — an ROI-mode GestureSpec registers under it; the FSM
  // never emits it as a gesture_decision_t.kind on the wire.
  GESTURE_KIND_ROI = 6;
}

// Which SIGN of a recognized gesture's step a GestureSpec answers. A decision
// carries a signed step alongside its kind (±1 for a pinch, 0 for every kind
// that has no direction), and a spec selects on it — which is what lets ONE
// GestureKind carry two templates when its two directions are two different
// commands rather than one command with a signed leaf.
enum GestureDeltaSign {
  // Answers every decision of its kind, whatever the step's sign. The ZERO
  // value, so a spec that says nothing about direction answers everything —
  // which is what every spec written before this field existed meant, and the
  // only sensible selector for a kind whose decisions carry no step at all.
  GESTURE_DELTA_SIGN_ANY = 0;
  GESTURE_DELTA_SIGN_POSITIVE = 1; // answers a step > 0 only
  GESTURE_DELTA_SIGN_NEGATIVE = 2; // answers a step < 0 only
}

// One gesture → its pre-encoded cmd template, keyed by GestureKind and by which
// sign of that gesture's step it answers. Rides the gesture-surface WidgetNode
// (WidgetNode.gestures); the host recognizer selects the entry whose kind
// matches and whose delta_sign admits the decision, then patches its slots.
message GestureSpec {
  GestureKind kind = 1 [(buf.validate.field).enum = {defined_only: true}];
  CmdSpec cmd = 2;
  // Two entries may share a `kind` ONLY as the {POSITIVE, NEGATIVE} pair. Every
  // other repeat of one kind is refused at load, because ANY already answers
  // both steps: a second entry beside it could only be reached by breaking the
  // tie on repeated-field ORDER, which would make the wire's element order a
  // contract this message does not state and would strand one template with no
  // diagnostic.
  GestureDeltaSign delta_sign = 3 [(buf.validate.field).enum = {defined_only: true}];
}

// Comparison operator for conditional visibility bindings.
enum CompareOp {
  COMPARE_EQ = 0; // show when subject == ref_value (native LVGL bind)
  COMPARE_NOT_EQ = 1; // show when subject != ref_value (native LVGL bind)
  COMPARE_GT = 2; // show when subject > ref_value  (custom observer)
  COMPARE_GTE = 3; // show when subject >= ref_value (custom observer)
  COMPARE_LT = 4; // show when subject < ref_value  (custom observer)
  COMPARE_LTE = 5; // show when subject <= ref_value (custom observer)
}

// Conditional visibility — show/hide widget based on subject value comparison.
message VisibilityBinding {
  // subject name to observe
  string subject = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
  int32 ref_value = 2; // reference value for comparison
  // comparison operator (default: EQ)
  CompareOp compare = 3 [(buf.validate.field).enum = {defined_only: true}];
}

// Value-conditional text-color binding — the VisibilityBinding subject/range
// shape PLUS the color applied while the condition holds
// (WidgetNode.color_when). The one reactive binding LVGL cannot express with a
// native bind helper (there is none for a style property), so the renderer
// drives it with a custom observer for every compare op.
message ColorBinding {
  // subject + ref_value + compare — reuses the VisibilityBinding shape
  VisibilityBinding when = 1;
  // text color applied to LV_PART_MAIN while `when` holds; the theme/authored
  // default is restored when it does not
  Color color = 2;
}

message Layout {
  FlexFlow flow = 1 [(buf.validate.field).enum = {defined_only: true}];
  FlexAlign main_place = 2 [(buf.validate.field).enum = {defined_only: true}];
  FlexAlign cross_place = 3 [(buf.validate.field).enum = {defined_only: true}];
  FlexAlign track_place = 4 [(buf.validate.field).enum = {defined_only: true}];
}

