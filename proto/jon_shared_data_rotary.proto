syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/data/rotary";

package ser;

import "jon_shared_data_types.proto";

message JonGuiDataRotary {
  double azimuth = 1 [(buf.validate.field).double = {
    gte: 0,
    lt: 360,
    example: [0, 90, 180, 270]
  }];
  double azimuth_speed = 2 [(buf.validate.field).double = {
    gte: -1.0,
    lte: 1.0,
    example: [-1.0, -0.5, 0, 0.5, 1.0]
  }];
  double elevation = 3 [(buf.validate.field).double = {
    gte: -90,
    lte: 90,
    example: [-45, 0, 45]
  }];
  double elevation_speed = 4 [(buf.validate.field).double = {
    gte: -1.0,
    lte: 1.0,
    example: [-1.0, -0.5, 0, 0.5, 1.0]
  }];
  double platform_azimuth = 5 [(buf.validate.field).double = {
    gte: 0,
    lt: 360,
    example: [0, 90, 180, 270]
  }];
  double platform_elevation = 6 [(buf.validate.field).double = {
    gte: -90,
    lte: 90,
    example: [-45, 0, 45]
  }];
  double platform_bank = 7 [(buf.validate.field).double = {
    gte: -180,
    lt: 180,
    example: [-90, 0, 90]
  }];
  bool is_moving = 8;
  JonGuiDataRotaryMode mode = 9 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
  bool is_scanning = 10;
  bool is_scanning_paused = 11;
  bool use_rotary_as_compass = 12;
  int32 scan_target = 13 [(buf.validate.field).int32 = {
    gte: 0,
    example: [1, 2, 3]
  }];
  int32 scan_target_max = 14 [(buf.validate.field).int32 = {
    gte: 0,
    example: [1, 2, 3]
  }];
  double sun_azimuth = 15 [(buf.validate.field).double = {
    gte: 0,
    lt: 360,
    example: [0, 90, 180, 270]
  }];
  // Solar elevation as a FULL 0..360 SWEEP, not the signed -90..90 every other
  // `elevation` field in this schema uses. That difference is deliberate, and
  // it has been mistaken for a copy-paste of sun_azimuth above (the constraint
  // blocks are identical) — it is not:
  //
  //   - This pair is not sensed, it is COMPUTED from GPS position + time, and
  //     both members are normalized the same way, which is why both read
  //     `lt: 360` (exclusive: 360 wraps to 0).
  //   - The sweep carries below-horizon positions rather than clipping them:
  //     0 = horizon, 90 = zenith, 180 = horizon, 270 = nadir. A signed
  //     -90..90 range would still express that, but this schema models it as
  //     one modulo'd circle so no consumer has to special-case night.
  //
  // Tightening this to -90..90 to "match the other elevation fields" would
  // reject everything past zenith — most of the cycle.
  double sun_elevation = 16 [(buf.validate.field).double = {
    gte: 0,
    lt: 360,
    example: [0, 90, 180, 270]
  }];

  ScanNode current_scan_node = 17;
  bool is_started = 18;
  JonGuiDataMeteo meteo = 19;

  // Axis initialization status (0=not init, 14=fully init)
  int32 pan_init_status = 20 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 14
  }];
  int32 tilt_init_status = 21 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 14
  }];

  // CLOCK_MONOTONIC timestamp (microseconds) when state was last pushed to SHM
  uint64 capture_monotonic_us = 22;

  // Transport-park latch (cmd.System.enter_transport sets it; RotaryPlatform
  // Start or Unpark clears it). While true, operator/tracker axis moves and
  // rotate-to-GPS are dropped by the rotary interlock.
  bool is_parked = 23;
}

message ScanNode {
  int32 index = 1 [(buf.validate.field).int32 = {
    gte: 0
  }];
  int32 DayZoomTableValue = 2 [(buf.validate.field).int32 = {
    gte: 0
  }];
  int32 HeatZoomTableValue = 3 [(buf.validate.field).int32 = {
    gte: 0
  }];
  double azimuth = 4 [(buf.validate.field).double = {
    gte: 0,
    lt: 360
  }];
  double elevation = 5 [(buf.validate.field).double = {
    gte: -90,
    lte: 90
  }];
  double linger = 6 [(buf.validate.field).double = {
    gte: 0
  }];
  double speed = 7 [(buf.validate.field).double = {
    gt: 0.0,
    lte: 1.0
  }];
}
