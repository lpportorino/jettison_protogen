name: Press browser proofs

on:
  push:
    branches: [main, master]
    paths:
    - "tools/press/**"
    - "press.mk"
    - ".github/workflows/press.yml"
  pull_request:
    paths:
    - "tools/press/**"
    - "press.mk"
    - ".github/workflows/press.yml"

permissions:
  contents: read

jobs:
  browser-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - name: Build the pinned press image
      run: make -f press.mk image
    - name: Check selftest host paths and output ownership
      run: python3 -m unittest discover -s tools/press/test -p 'selftest_launcher_test.py'
    - name: Exercise browser detectors and launcher boundaries offline
      run: |
        mkdir -p .press
        set -o pipefail
        tools/press/bin/press selftest .press/ci-selftest 2>&1 | tee .press/ci-selftest.log
    - name: Package browser evidence with its original fixture paths
      if: always()
      run: bash tools/press/bin/pack-evidence.sh .press/ci-selftest .press/ci-selftest.tar.gz
    - name: Keep browser evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: press-browser-evidence
        path: |
          .press/ci-selftest.tar.gz
          .press/ci-selftest.log
        include-hidden-files: true
        if-no-files-found: error
