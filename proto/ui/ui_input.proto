syntax = "proto3";
package ui;

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/ui";

import "jon_shared_data_types.proto";

// ── Bidirectional host↔WASM gesture / pointer / lifecycle channel ────────
//
// A size-bound, versioned, bidirectional protobuf channel between the
// LVGL-in-WASM controls program and its host (the native Rust shell AND the
// browser controls worker — one shared controls.wasm, two hosts).
//
//   host → WASM   ui.HostToWasm { pointer | gesture | lifecycle }
//   WASM → host   ui.WasmToHost { hover | cursor }
//
// Responsibility split: the HOST recognizes gestures (timing-critical,
// device-tuned FSM) and submits the RECOGNIZED INTENT here; the WASM hit-tests
// against the LVGL UI it draws and maps a gesture that lands on the video area
// to the full cmd.* device command (emitted as opaque bytes over a separate
// ABI, NOT in this proto). This channel carries ONLY the light recognized
// intent + the feedback report — never the heavy cmd.* command and never the
// UI tree.
//
// SIZE-BOUND BY CONSTRUCTION — and therefore nanopb-friendly with NO sibling
// ui_input.options: every field is scalar / enum / fixed-count. No strings (a
// nanopb string forces a max_size char[N]); no repeated (forces a max_count
// static array or a non-size-bound FT_CALLBACK). nanopb emits flat fixed-width
// C structs (the jon_shared_data_camera_day.proto precedent — also no
// .options). The ABSENT .options is the strongest proof of size-boundedness.
// (Contrast ui_ast.options, which exists only because ui_ast has strings +
// repeated + recursion.)
//
// NDC coordinates are double ∈ [-1.0, 1.0], +x right / +y UP — the established
// convention shared with the cmd.* NDC commands (RotateToNDC / HaltWithNDC /
// StartTrackNDC), so the WASM-built device command is byte-identical (no
// fixed-point re-cast, no host-side conversion divergence).

// ── Shared enums (each carries _UNSPECIFIED = 0; consumers use
//    defined_only + not_in:[0] to reject the proto3 zero-default) ──────────

// Channel schema version registry — the canonical list of valid versions. The
// wire field is a uint32 (range-validated {gte:1,lte:255}) so it fail-fast
// rejects the proto3 default 0; this enum documents which values are valid.
// (Mirrors the NodeSchemaVersion / uint32 version pattern.)
enum InputSchemaVersion {
  INPUT_SCHEMA_VERSION_UNSPECIFIED = 0;
  INPUT_SCHEMA_VERSION_V1 = 1;
}

// Raw pointer lifecycle phase (host input device → WASM hit-testing).
enum PointerPhase {
  POINTER_PHASE_UNSPECIFIED = 0;
  POINTER_PHASE_DOWN = 1;
  POINTER_PHASE_MOVE = 2;
  POINTER_PHASE_UP = 3;
}

// Pointing-device kind, for LVGL input semantics.
enum PointerKind {
  POINTER_KIND_UNSPECIFIED = 0;
  POINTER_KIND_MOUSE = 1;
  POINTER_KIND_TOUCH = 2;
  POINTER_KIND_PEN = 3;
}

// The gesture the HOST has already recognized — selects which GestureCommand
// fields are meaningful (the WASM interprets the scalar set per this tag).
enum RecognizedGesture {
  RECOGNIZED_GESTURE_UNSPECIFIED = 0;
  RECOGNIZED_GESTURE_PAN_MOVE = 1;   // continuous rotary slew (Axis)
  RECOGNIZED_GESTURE_PAN_END = 2;    // slew release (HaltWithNDC)
  RECOGNIZED_GESTURE_TAP = 3;        // slew-to-point (RotateToNDC)
  RECOGNIZED_GESTURE_TRACK = 4;      // CV point-track (StartTrackNDC)
  RECOGNIZED_GESTURE_PINCH = 5;      // optical zoom (SetZoomTableValue)
}

// OS theme the host reports for WASM restyle.
enum ThemeMode {
  THEME_MODE_UNSPECIFIED = 0;
  THEME_MODE_LIGHT = 1;
  THEME_MODE_DARK = 2;
}

// Cursor the WASM requests the host render over the hovered region.
enum CursorType {
  CURSOR_TYPE_UNSPECIFIED = 0;
  CURSOR_TYPE_DEFAULT = 1;
  CURSOR_TYPE_POINTER = 2;
  CURSOR_TYPE_TEXT = 3;
  CURSOR_TYPE_GRAB = 4;
  CURSOR_TYPE_RESIZE = 5;
  CURSOR_TYPE_NOT_ALLOWED = 6;
}

// ── Host → WASM payloads ─────────────────────────────────────────────────

// Raw pointer + position for WASM-side LVGL hit-testing. The host owns the
// input device; the WASM needs the raw pointer to hit-test its own layout.
message PointerEvent {
  PointerPhase phase = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  PointerKind kind = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  double x = 3 [(buf.validate.field).double = {gte: -1.0, lte: 1.0}];   // NDC, +x right
  double y = 4 [(buf.validate.field).double = {gte: -1.0, lte: 1.0}];   // NDC, +y UP
  uint32 buttons = 5;   // held-button bitfield (fixed 32-bit)
}

// A gesture the HOST already recognized → the device-command intent. A flat,
// scalar-only struct (size-bound); the `gesture` tag selects which fields the
// WASM reads when it maps this to the full cmd.* command.
message GestureCommand {
  RecognizedGesture gesture = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  ser.JonGuiDataVideoChannel channel = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];

  // NDC aim point for PAN_MOVE / PAN_END / TAP / TRACK. The mirrored device
  // commands all carry x,y: RotateToNDC + HaltWithNDC (jon_shared_cmd_rotary)
  // and StartTrackNDC (jon_shared_cmd_cv).
  double x = 3 [(buf.validate.field).double = {gte: -1.0, lte: 1.0}];
  double y = 4 [(buf.validate.field).double = {gte: -1.0, lte: 1.0}];

  // Continuous rotary pan (Axis): az/el speed ∈ [0,1] + direction. 0 / unset
  // when the gesture is not a pan.
  double az_speed = 5 [(buf.validate.field).double = {gte: 0.0, lte: 1.0}];
  double el_speed = 6 [(buf.validate.field).double = {gte: 0.0, lte: 1.0}];
  ser.JonGuiDataRotaryDirection az_dir = 7;
  ser.JonGuiDataRotaryDirection el_dir = 8;

  // PINCH: ABSOLUTE zoom-table value. SetZoomTableValue is absolute and the
  // WASM is a stateless 1:1 pass-through, so the host owns the running value
  // and resolves any ±1 step into this absolute (a delta is inexpressible).
  int32 zoom = 9 [(buf.validate.field).int32 = {gte: 0}];

  // Frame-accurate aim-point resolution — the NDC commands REQUIRE these
  // (RotateToNDC / HaltWithNDC frame_time/state_time).
  uint64 frame_time = 10;
  uint64 state_time = 11;
}

// OS lifecycle the host pushes for WASM restyle / pause.
message Lifecycle {
  ThemeMode theme = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  bool focused = 2;
  bool visible = 3;
}

// Host → WASM envelope. `version` is field 1 (fail-fast guard); the consumer
// checks it against the CURRENT value FIRST and returns a mismatch error — no
// migration branch, no version-sniffing. {gte:1} rejects the proto3 default 0.
message HostToWasm {
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];
  oneof event {
    option (buf.validate.oneof).required = true;
    PointerEvent pointer = 2;
    GestureCommand gesture = 3;
    Lifecycle lifecycle = 4;
  }
}

// ── WASM → host payloads ─────────────────────────────────────────────────

// What the WASM hit-test found under the pointer. Identity travels as the
// WidgetNode.uid (a uint32), never a name — no string, stays size-bound.
message HoverState {
  uint32 hovered_uid = 1;   // ui_ast WidgetNode.uid; 0 = nothing hovered
  bool interactive = 2;     // host shows an interactive affordance when true
}

// The cursor the WASM wants the host to render.
message CursorRequest {
  CursorType cursor = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

// WASM → host envelope. Same version-guard contract as HostToWasm.
message WasmToHost {
  uint32 version = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 255}];
  oneof report {
    option (buf.validate.oneof).required = true;
    HoverState hover = 2;
    CursorRequest cursor = 3;
  }
}
