syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/data/camera_heat";

package ser;

import "jon_shared_data_types.proto";

message JonGuiDataCameraHeat {
  double zoom_pos = 1 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];
  JonGuiDataVideoChannelHeatAGCModes agc_mode = 2 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
  JonGuiDataVideoChannelHeatFilters filter = 3 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
  bool auto_focus = 4;
  int32 zoom_table_pos = 5 [(buf.validate.field).int32 = {
    gte: 0
  }];
  int32 zoom_table_pos_max = 6 [(buf.validate.field).int32 = {
    gte: 0
  }];
  int32 dde_level = 7 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 512
  }];
  bool dde_enabled = 8;
  JonGuiDataFxModeHeat fx_mode = 9 [(buf.validate.field).enum = {
    defined_only: true
  }];
  double digital_zoom_level = 10 [(buf.validate.field).double = {
    gte: 1.0
  }];
  double clahe_level = 11 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 1.0
  }];
  double horizontal_fov_degrees = 12 [(buf.validate.field).double = {
    gte: 0.0,
    lt: 360.0
  }];
  double vertical_fov_degrees = 13 [(buf.validate.field).double = {
    gte: 0.0,
    lt: 360.0
  }];
  bool is_started = 14;
  JonGuiDataMeteo meteo = 15;

  // CLOCK_MONOTONIC timestamp (microseconds) when state was last pushed to SHM
  uint64 capture_monotonic_us = 16;

  // Measured video rates for this channel, in frames per second. Absent until
  // the producer has two samples to difference; zero when present means
  // nothing is arriving, which is a measurement rather than an absence.
  // delivered_fps counts frames handed on, content_fps only frames whose
  // content changed.
  //
  // DIVERGENCE IS THE SIGNAL, NOT THE BASELINE. A healthy idle heat channel
  // reads the two rates EQUAL: the 2:1 ingress drop ahead of the GPU upload
  // cancels the thermal core's idle re-serve exactly. Do not read a 1:1 heat
  // channel as a broken counter. Content falls below delivery under scan
  // load, not at rest.
  optional double delivered_fps = 17 [(buf.validate.field).double.gte = 0.0];
  optional double content_fps = 18 [(buf.validate.field).double.gte = 0.0];
}
