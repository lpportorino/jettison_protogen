message Color {
  uint32 r = 1 [(buf.validate.field).uint32 = {lte: 255}];
  uint32 g = 2 [(buf.validate.field).uint32 = {lte: 255}];
  uint32 b = 3 [(buf.validate.field).uint32 = {lte: 255}];
}

message ShadowBundle {
  uint32 width = 1;
  int32 offset_x = 2;
  int32 offset_y = 3;
  uint32 spread = 4;
  uint32 opa = 5 [(buf.validate.field).uint32 = {lte: 255}];
}
