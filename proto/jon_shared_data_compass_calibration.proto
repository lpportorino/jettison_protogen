syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/data/compass_calibration";

package ser;

import "jon_shared_data_types.proto";

message JonGuiDataCompassCalibration {
  uint32 stage = 1 [(buf.validate.field).uint32 = {
    gte: 0
  }];
  uint32 final_stage = 2 [(buf.validate.field).uint32 = {
    gt: 0
  }];
  double target_azimuth = 3 [(buf.validate.field).double = {
    gte: 0,
    lt: 360
  }];
  double target_elevation = 4 [(buf.validate.field).double = {
    gte: -90,
    lte: 90
  }];
  double target_bank = 5 [(buf.validate.field).double = {
    gte: -180,
    lt: 180
  }];
  JonGuiDataCompassCalibrateStatus status = 6 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
  // Figure of merit reported by the DMC-pico after compensation completes.
  // Two raw bytes from the CAN-UART bridge response, packed as uint16
  // (byte 0 in low 8 bits, byte 1 in next 8 bits) and zero-extended.
  // The vendor manual (TML 913755) documents FOM as a degrees value
  // (typical 0.2-0.3, recommended < 0.5, device rejects results > 9.9)
  // for the ASCII serial protocol, but the binary CAN-UART encoding is
  // not in the public manual. Consumers must decode empirically.
  uint32 figure_of_merit_raw = 7 [(buf.validate.field).uint32 = {
    lte: 65535
  }];
}
