syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/data/gps";

package ser;

import "jon_shared_data_types.proto";

message JonGuiDataGps {
  double longitude = 1 [(buf.validate.field).double = {
    gte: -180.0,
    lte: 180.0
  }];
  double latitude = 2 [(buf.validate.field).double = {
    gte: -90.0,
    lte: 90.0
  }];
  // Unbounded by design: a contested-GPS platform legitimately reports spoofed
  // or out-of-range altitudes, so bounding STATE here yields only a validation
  // firehose. Operator COMMAND altitudes keep their bounds.
  double altitude = 3;
  double manual_longitude = 4 [(buf.validate.field).double = {
    gte: -180.0,
    lte: 180.0
  }];
  double manual_latitude = 5 [(buf.validate.field).double = {
    gte: -90.0,
    lte: 90.0
  }];
  // Unbounded by design, as with `altitude` above.
  double manual_altitude = 6;
  JonGuiDataGpsFixType fix_type = 7 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]  // Assuming 0 is UNSPECIFIED in the enum
  }];
  bool use_manual = 8;
  int64 timestamp = 9;  // GPS timestamp from satellite (Unix time in seconds)
  bool is_started = 10;
  JonGuiDataMeteo meteo = 11;
}
