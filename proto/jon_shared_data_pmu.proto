syntax = "proto3";

option go_package = "git-codecommit.eu-central-1.amazonaws.com/v1/repos/jettison/jonp/data/pmu";

package ser;

import "jon_shared_data_types.proto";

message JonGuiDataPMU {
  double temperature = 1 [(buf.validate.field).double = {
    gte: -273.15,  // Absolute zero in Celsius
    lte: 660.32,   // Melting point of aluminum in Celsius
    example: [-20, 0, 25, 100]
  }];
  reserved 2;  // was: status
  bool is_started = 3;
  JonGuiDataMeteo meteo = 4;
  double voltage = 5 [(buf.validate.field).double = {
    gte: 2.0,
    lte: 60.0
  }];
  bool heater_power_state = 6;

  // INA236 power monitor
  double ina_voltage = 7 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 36.0  // INA236 max bus voltage
  }];
  double ina_current = 8 [(buf.validate.field).double = {
    gte: -20.0,
    lte: 20.0  // Bidirectional current measurement
  }];
  double ina_power = 9 [(buf.validate.field).double = {
    gte: 0.0,
    lte: 720.0  // Max power = 36V * 20A
  }];
  bool ina_power_fault = 10;
}
