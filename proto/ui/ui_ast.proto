  FLEX_FLOW_ROW_WRAP_REVERSE = 5;
  FLEX_FLOW_COLUMN_WRAP = 6;
  FLEX_FLOW_COLUMN_REVERSE = 7;
  FLEX_FLOW_COLUMN_WRAP_REVERSE = 8;
}

enum FlexAlign {
  FLEX_ALIGN_START = 0;
  FLEX_ALIGN_END = 1;
  FLEX_ALIGN_CENTER = 2;
  FLEX_ALIGN_SPACE_EVENLY = 3;
  FLEX_ALIGN_SPACE_AROUND = 4;
