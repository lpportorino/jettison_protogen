enum LabelLongMode {
  LABEL_LONG_WRAP = 0;
  LABEL_LONG_DOT = 1;
  LABEL_LONG_SCROLL = 2;
  LABEL_LONG_SCROLL_CIRCULAR = 3;
  LABEL_LONG_CLIP = 4;
